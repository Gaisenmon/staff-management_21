<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱旋門 ATS評価システム</title>
<style>
  :root{
    --charcoal:#241E19;
    --charcoal-2:#332A22;
    --ember:#C1531B;
    --ember-dark:#9C4013;
    --cream:#FBF6EE;
    --card:#FFFFFF;
    --ink:#2B2420;
    --muted:#8A7F72;
    --line:#E7DFD2;
    --green:#3F7D4C;
    --green-bg:#E4F1E6;
    --amber:#C98A2C;
    --amber-bg:#FBF0DC;
    --gray-bg:#EFEAE1;
    --gray-ink:#9C9184;
    --training:#2F6FA8;
    --training-bg:#E4EEF5;
    --gold:#A9760B;
    --gold-bg:#FBF0D2;
    --cat-kitchen:#F5E7DA;
    --cat-hall:#E4EEF1;
    --cat-special:#EDE7F3;
    --cat-shift:#FBF0DC;
    --cat-attitude:#E4F1E6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  .app{min-height:100vh;display:flex;flex-direction:column;}
  header{background:linear-gradient(135deg, var(--charcoal), var(--charcoal-2));color:#F2E9DC;padding:20px 26px 0 26px;border-bottom:4px solid var(--ember);}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em;white-space:nowrap;}

  /* ===== スマホ専用モード(PC版のレイアウトとは完全に切り離した見た目) ===== */
  body.mobile-mode header{padding:14px 14px 0 14px;}
  body.mobile-mode .brand{flex-direction:row;flex-wrap:nowrap;align-items:center !important;gap:8px;margin-bottom:6px;}
  body.mobile-mode .brand h1{font-size:16px;}
  body.mobile-mode .brand > div{align-self:center;}
  body.mobile-mode #top-right-slot{
    display:flex !important;flex-direction:row !important;flex-wrap:wrap;
    align-items:center !important;justify-content:flex-end !important;gap:8px;
  }
  body.mobile-mode .sync-row{font-size:10px;margin-bottom:8px;}
  /* タブは折り返さず横スクロールに(前のホール運営システムと同じ方式) */
  body.mobile-mode nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  body.mobile-mode nav button{padding:9px 12px;font-size:12.5px;flex:none;}
  body.mobile-mode main{padding:14px 12px 50px;}
  body.mobile-mode h2.title{font-size:16px;}
  body.mobile-mode .card{padding:14px;border-radius:10px;}
  body.mobile-mode .title-row{flex-direction:column;align-items:stretch;gap:10px;}
  body.mobile-mode .chart-grid{grid-template-columns:1fr !important;}
  body.mobile-mode .meta-row{flex-direction:column;gap:6px;}
  body.mobile-mode .staff-picker{max-width:none;}
  body.mobile-mode table{font-size:11px;}
  body.mobile-mode .btn-group button{padding:7px 12px;font-size:12px;}
  /* iOSは16px未満のinput/selectにフォーカスすると自動ズームしてしまうため、スマホ表示では16pxに統一 */
  body.mobile-mode select, body.mobile-mode input[type=text], body.mobile-mode input[type=date],
  body.mobile-mode input[type=number], body.mobile-mode input[type=password], body.mobile-mode textarea{font-size:16px;}

  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav button{background:transparent;border:none;color:#D8CBB8;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0;position:relative;top:1px;font-family:inherit;}
  nav button.active{background:var(--cream);color:var(--ink);}
  nav button:not(.active):hover{background:rgba(255,255,255,0.08);}
  main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:24px 24px 60px;}
  .title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  h2.title{font-size:20px;margin:0;font-weight:800;}
  .btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-group button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-group button.active{background:var(--ember);border-color:var(--ember);color:#fff;}
  .period-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .period-row .lbl{font-size:12px;color:var(--muted);font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
  /* thead(見出し行)を「縦スクロールしても固定」するには、position:stickyの基準となる
     スクロールコンテナ自体が実際に縦スクロールしている必要がある。.table-wrapは
     overflow-x:autoを付けた時点で(仕様上)overflow-yも暗黙にautoとして扱われるが、
     高さの制限が無いと中身がそのまま収まってしまい実質スクロールが起きず、
     見出し行はページと一緒に流れて行ってしまう。そこで、縦固定を効かせたい表だけ
     このクラスで明示的に高さを制限し、表自身の中でスクロールするようにする。 */
  .table-wrap.scroll-y-frozen{max-height:72vh;overflow-y:auto;}
  table{border-collapse:collapse;width:100%;font-size:11.5px;}
  thead th{background:var(--charcoal);color:#EFE5D6;padding:7px 6px;text-align:center;font-weight:700;white-space:nowrap;position:sticky;top:0;z-index:2;}
  thead th.name-col{text-align:left;padding-left:12px;position:sticky;left:0;top:0;z-index:4;background:var(--charcoal);}
  thead tr.cat-row th{font-size:10.5px;background:var(--charcoal-2);border-left:2px solid var(--charcoal);}
  tbody td{padding:6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td.name-col{text-align:left;padding-left:12px;font-weight:700;position:sticky;left:0;z-index:1;background:var(--card);box-shadow:2px 0 4px rgba(0,0,0,0.06);}
  tbody tr:hover{background:#FAF5EC;}
  tbody tr:hover td.name-col{background:#FAF5EC;}
  .aff-chip{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;border-radius:20px;background:var(--gray-bg);color:var(--muted);}
  .aff-chip.hall{background:#E4EEF1;color:#2F6B7A;}
  .aff-chip.kitchen{background:#F5E7DA;color:var(--ember-dark);}
  .aff-chip.both{background:var(--amber-bg);color:var(--amber);}
  .score-cell{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;border-radius:5px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 3px;}
  .score-cell.ready{background:var(--green-bg);color:var(--green);}
  .score-cell.mid{background:var(--training-bg);color:var(--training);}
  .score-cell.low{background:var(--gray-bg);color:var(--gray-ink);}
  .score-cell.perfect{background:var(--gold-bg);color:var(--gold);}
  .legend{display:flex;gap:14px;margin:12px 2px 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .staff-picker{max-width:360px;margin-bottom:14px;}
  label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
  select, textarea, input[type=text], input[type=date], input[type=number], input[type=password], input[type=file]{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);box-sizing:border-box;}
  textarea{resize:vertical;min-height:90px;}
  .meta-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--muted);}
  .meta-row strong{color:var(--ink);}
  .edit-form{background:var(--cream);border:1px solid var(--line);border-radius:10px;padding:14px;display:flex;flex-direction:column;gap:10px;}
  .edit-form .row2{display:flex;gap:10px;flex-wrap:wrap;}
  .edit-form .row2 > div{min-width:140px;}
  body.mobile-mode .edit-form .row2{flex-direction:column;}
  body.mobile-mode .edit-form .row2 > div{min-width:0;}
  .row{display:flex;gap:14px;flex-wrap:wrap;align-items:flex-end;margin-bottom:12px;}
  .grow{flex:1;min-width:160px;}
  body.mobile-mode .row{flex-direction:column;align-items:stretch;}

  /* 紙の評価票を模した表 */
  .cat-kitchen{background:var(--cat-kitchen);}
  .cat-hall{background:var(--cat-hall);}
  .cat-special{background:var(--cat-special);}
  .cat-shift{background:var(--cat-shift);}
  .cat-attitude{background:var(--cat-attitude);}
  .chip-group{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;}
  table.pcard-table{border-collapse:collapse;width:100%;min-width:640px;}
  table.pcard-table td, table.pcard-table th{border:1px solid var(--line);}
  table.pcard-table td{padding:8px 6px;text-align:center;vertical-align:middle;font-size:12.5px;background:#fff;}
  table.pcard-table td.cat-col{width:100px;font-weight:800;font-size:12.5px;text-align:center;padding:10px 6px;border-right:2px solid var(--charcoal);}
  table.pcard-table td.item-col{width:150px;text-align:left;padding:8px 12px;font-weight:700;white-space:nowrap;position:sticky;left:0;z-index:1;background:#fff;}
  table.pcard-table th{padding:9px 6px;text-align:center;background:var(--charcoal);color:#EFE5D6;font-size:12.5px;white-space:nowrap;}
  table.pcard-table th.item-col-head{text-align:left;padding-left:12px;position:sticky;left:0;z-index:2;}
  table.pcard-table th.cat-col-head{width:100px;}
  /* マイページの「評価者/自己評価」比較表は列数が少なく横スクロールの必要が無いため、
     ATS評価-個人用の横固定(sticky)・最小幅指定を外し、画面幅に自然に収まるようにする。
     固定したままだと、スマホの狭い画面では固定列だけで幅を使い切ってしまい、
     肝心のスコア列が画面外にはみ出て見切れてしまう。 */
  table.pcard-table.pcard-table-compare{min-width:0;table-layout:fixed;}
  table.pcard-table.pcard-table-compare td.cat-col{position:static;width:15%;padding:6px 2px;font-size:11px;}
  table.pcard-table.pcard-table-compare td.item-col{position:static;left:auto;width:auto;white-space:normal;padding:6px 4px;font-size:11.5px;}
  table.pcard-table.pcard-table-compare th.item-col-head{position:static;}
  table.pcard-table.pcard-table-compare th{padding:6px 2px;font-size:11px;}
  table.pcard-table.pcard-table-compare td{padding:6px 2px;}
  table.pcard-table.pcard-table-compare .pcard-score{width:24px;height:24px;font-size:10.5px;}
  .pcard-score{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:800;font-size:13px;border:2px solid var(--line);color:var(--muted);}
  .pcard-score.ready{background:var(--green-bg);color:var(--green);border-color:var(--green);}
  .pcard-score.mid{background:var(--training-bg);color:var(--training);border-color:var(--training);}
  .pcard-score.low{background:var(--gray-bg);color:var(--gray-ink);border-color:var(--line);}
  .pcard-score.perfect{background:var(--gold-bg);color:var(--gold);border-color:var(--gold);}
  .chip-btn.selected{background:var(--ember);border-color:var(--ember);color:#fff;}

  button.primary{background:var(--ember);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;}
  button.primary:hover{background:var(--ember-dark);}
  .save-toast{position:fixed;top:14px;left:50%;transform:translateX(-50%) translateY(-20px);background:var(--charcoal);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}

  /* 印刷 / PDF保存用。個人タブの「印刷 / PDF保存」ボタンから window.print() を呼ぶ想定 */
  @media print{
    header, .save-toast, .no-print{display:none !important;}
    body{background:#fff !important;}
    main{padding:0 !important;max-width:none !important;margin:0 !important;}
    .card{border:none !important;box-shadow:none !important;padding:4px 0 !important;margin-bottom:4px !important;}
    table{break-inside:auto;}
    tr{break-inside:avoid;}
    thead{display:table-header-group;} /* 表が複数ページにまたがる時、見出し行を各ページの先頭に繰り返す */
  }
  .sync-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:11px;color:#C8BBA8;}
  #reload-btn{background:transparent;border:1px solid rgba(255,255,255,0.3);color:#EFE5D6;border-radius:20px;padding:2px 10px;font-size:10.5px;cursor:pointer;font-family:inherit;margin-left:auto;flex:none;}
  #reload-btn:hover{background:rgba(255,255,255,0.1);}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#5EA36B;flex:none;}
  .sync-dot.off{background:#B23A2E;}

  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 26px),
      linear-gradient(135deg, var(--charcoal), var(--charcoal-2));
    padding:20px;
  }
  .login-card{
    background:var(--card);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .login-card h2{font-size:17px;margin:0 0 4px;font-weight:800;color:var(--ink);}
  .login-card p{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .login-card input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px;height:42px;box-sizing:border-box;}
  .login-card button{width:100%;margin-top:4px;}
  .login-error{color:#B23A2E;font-size:12.5px;margin-top:10px;min-height:16px;}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#EFE5D6;border-radius:20px;padding:3px 12px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  /* 一般ユーザーのスマホ下部ナビ */
  nav .ts{display:none;}
  body.mobile-mode nav.general-nav{position:fixed;left:0;right:0;bottom:0;z-index:60;background:var(--charcoal);border-top:3px solid var(--ember);padding:5px 4px calc(5px + env(safe-area-inset-bottom));gap:2px;overflow:visible;flex-wrap:nowrap;}
  body.mobile-mode nav.general-nav button{flex:1 1 0;min-width:0;top:0;border-radius:8px;padding:11px 2px;font-size:12px;text-align:center;}
  body.mobile-mode nav.general-nav button.active{background:var(--ember);color:#fff;}
  body.mobile-mode nav.general-nav .tl{display:none;}
  body.mobile-mode nav.general-nav .ts{display:inline;}
  body.has-bottom-nav main{padding-bottom:96px !important;}
  body.has-bottom-nav .sticky-actions{bottom:58px;}
  body.has-bottom-nav header{padding-bottom:12px;}
  /* マイページ:ズレ一覧・折りたたみカード */
  .diff-row{display:flex;align-items:center;gap:8px;flex-wrap:wrap;padding:9px 2px;border-top:1px solid var(--line);font-size:13.5px;}
  .diff-row .nm{font-weight:800;flex:1 1 110px;}
  .diff-row .val{color:var(--muted);font-weight:700;white-space:nowrap;}
  .diff-row .val.strong.up{color:var(--green);}
  .diff-row .val.strong.down{color:var(--ember-dark);}
  .diff-row .arrow{color:var(--muted);}
  details.fold-card > summary{cursor:pointer;list-style:none;display:flex;align-items:center;justify-content:space-between;}
  details.fold-card > summary::-webkit-details-marker{display:none;}
  details.fold-card > summary::after{content:"▸ 開く";font-size:12px;color:var(--muted);font-weight:700;}
  details.fold-card[open] > summary::after{content:"▾ 閉じる";}
  /* 点数入力(評価入力・自己評価共通) */
  .score-list{border:1px solid var(--line);border-radius:10px;overflow:hidden;background:#fff;}
  .score-cat{font-weight:800;font-size:12.5px;padding:7px 12px;border-top:1px solid var(--line);}
  .score-cat:first-child{border-top:none;}
  .score-item{display:flex;flex-wrap:wrap;align-items:center;gap:6px 12px;padding:8px 12px;border-top:1px solid var(--line);}
  .score-item .nm{flex:0 1 170px;font-weight:700;font-size:13.5px;}
  .score-item .chip-group{flex:0 0 auto;flex-wrap:nowrap;}
  .score-item .chip-btn{width:36px;height:36px;font-size:13.5px;}
  /* 保存ボタン・合計点を画面下に固定するバー */
  .sticky-actions{position:sticky;bottom:0;z-index:5;background:#fff;border-top:1px solid var(--line);margin:18px -20px -20px;padding:12px 20px;border-radius:0 0 14px 14px;display:flex;align-items:center;gap:8px;flex-wrap:wrap;box-shadow:0 -6px 16px rgba(36,30,25,.06);}
  .sticky-actions .total{font-weight:800;font-size:14px;color:var(--ember-dark);margin-right:auto;}
  .sticky-actions .note{font-size:12px;color:var(--muted);margin-right:auto;flex:1 1 200px;}
  .sticky-actions .btns{display:flex;gap:8px;margin-left:auto;}
  .sticky-actions > button.primary{margin-left:auto;}
  .sticky-actions button.primary{padding:10px 14px;white-space:nowrap;}
  body.mobile-mode .sticky-actions{margin:14px -14px -14px;padding:10px 14px;border-radius:0 0 10px 10px;}
  /* ホーム画面・評価担当 */
  .role-chip{border:1px solid var(--line);background:#fff;color:var(--gray-ink);border-radius:20px;padding:3px 10px;font-size:11px;font-weight:800;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .role-chip.on{background:var(--amber-bg);border-color:var(--amber-bg);color:var(--amber);}
  .role-chip.on:first-child{background:var(--charcoal);border-color:var(--charcoal);color:#fff;}
  th.sm-sticky, td.sm-sticky{position:sticky;left:0;z-index:1;}
  td.sm-sticky{background:#fff;box-shadow:1px 0 0 var(--line);}
  th.sm-sticky{z-index:3;}
  .assign-select{width:auto;min-width:120px;padding:5px 8px;font-size:12.5px;border-radius:8px;}
  .assign-select.unset{color:var(--red, #B23A2E);border-color:#F1C9C3;}
  button.btn-danger{background:transparent;color:var(--red, #B23A2E);border:1px solid #E7B4AD;border-radius:8px;padding:8px 14px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;}
  button.btn-ghost{background:transparent;color:var(--ember-dark);border:1px solid var(--ember);border-radius:8px;padding:8px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;white-space:nowrap;}
  .home-card-title{font-weight:800;font-size:15px;margin-bottom:4px;}
  .home-card-sub{font-size:12px;color:var(--muted);margin-bottom:12px;}
  .todo-group-head{font-size:12.5px;font-weight:800;color:var(--muted);margin:14px 0 6px;display:flex;align-items:center;gap:8px;}
  .todo-group-head:first-of-type{margin-top:4px;}
  .todo-row{display:flex;align-items:center;gap:10px;width:100%;padding:11px 12px;border:1px solid var(--line);border-radius:10px;background:#fff;margin-bottom:6px;cursor:pointer;font-family:inherit;font-size:14px;text-align:left;color:var(--ink);}
  .todo-row:hover{background:#FAF5EC;}
  .todo-row .nm{font-weight:800;flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;}
  .todo-row .arrow{color:var(--muted);font-weight:800;flex:none;}
  .st-chip{flex:none;font-size:11px;font-weight:800;padding:2px 9px;border-radius:20px;white-space:nowrap;}
  .st-chip.todo{background:#FBE4E1;color:var(--red, #B23A2E);}
  .st-chip.doing{background:var(--amber-bg);color:var(--amber);}
  .st-chip.done{background:var(--green-bg);color:var(--green);}
  .st-chip.skip{background:var(--gray-bg);color:var(--gray-ink);}
  .progress-bar{height:8px;border-radius:8px;background:var(--gray-bg);overflow:hidden;margin:6px 0 2px;}
  .progress-bar > div{height:100%;background:var(--green);}
  .home-task{display:flex;align-items:center;gap:12px;flex-wrap:wrap;padding:14px;border-radius:10px;background:var(--cream, #FBF6EE);border:1px solid var(--line);margin-bottom:8px;}
  .home-task .msg{flex:1;min-width:180px;font-size:14px;font-weight:700;}
  .home-task.done .msg{color:var(--green);}
  .menu-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(150px,1fr));gap:10px;}

function computeTenureText(hireDateStr){
  if(!hireDateStr) return "-";
  const hire = new Date(hireDateStr);
  const now = new Date();
  let years = now.getFullYear() - hire.getFullYear();
  let months = now.getMonth() - hire.getMonth();
  if(now.getDate() < hire.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  if(years < 0) return "-";
  return `${years}年${months}ヶ月`;
}
function computeTenureMonths(hireDateStr){
  if(!hireDateStr) return null;
  const hire = new Date(hireDateStr);
  const now = new Date();
  if(isNaN(hire.getTime())) return null;
  let months = (now.getFullYear()-hire.getFullYear())*12 + (now.getMonth()-hire.getMonth());
  if(now.getDate() < hire.getDate()) months -= 1;
  return months < 0 ? null : months;
}

/* ============================== 状態管理・共有保存(Firebase Realtime Databaseでリアルタイム共有) ============================== */

/* 本体(staff/years)側の移行処理。履歴は別パスになったのでここでは扱わない。 */
function migrateCoreState(s){
  if(!Array.isArray(s.staff)) s.staff = [];
  if(!s.years || s.years.length===0) s.years = [INITIAL_YEAR];
  s.staff.forEach(st=>{
    if(!st.status){ st.status = st.active===false ? "resigned" : "active"; }
    if(st.isEvaluator === undefined){ st.isEvaluator = EVALUATOR_SEED_NAMES.some(n=>st.name.includes(n)); }
    st.isEvaluatee = st.employType !== "社員"; // 被評価者かどうか。社員は別の評価指標のため常に対象外(評価データはその時点の値のまま残る)
    if(st.isAdmin === undefined){ st.isAdmin = (st.employType === "社員") || st.name === "木内 健太"; } // 管理者かどうか。既存の社員+木内さんは自動でtrue
    if(st.hasLogin === undefined){ st.hasLogin = false; }
    if(!Array.isArray(st.growthNotes)) st.growthNotes = [];
    if(st.assignedEvaluatorId === undefined) st.assignedEvaluatorId = ""; // 評価担当(評価者のstaff id)
    if(st.yearData){
      Object.values(st.yearData).forEach(yd=>{
        Object.values(yd).forEach(pd=>{
          if(pd.exempt === undefined) pd.exempt = false;
          if(!pd.selfScores) pd.selfScores = emptyScores();
          if(pd.selfGoal === undefined) pd.selfGoal = "";
          if(pd.selfSubmitted === undefined) pd.selfSubmitted = false;
          if(pd.evaluatorGoal === undefined) pd.evaluatorGoal = "";
        });
      });
    }
  });
  return s;
}
function defaultCoreState(){ return { staff: seedStaff(), years: [INITIAL_YEAR], updatedAt: null }; }

/* 直近にサーバーから受け取った状態(=自分がまだ書き込んでいない基準点)。
   これと今の手元の state を比べることで「自分が実際に何を触ったか」を判定する。 */
let lastServerCore = null;   // {staff, years} の基準点
let lastServerHistory = null; // history配列の基準点

/* 保存直前にサーバーの最新データを取り直し、自分が実際に触った部分(スタッフ・年度)だけを
   その最新データに重ねてから書き込む。
   理由:「編集中は他人の更新を取り込まない」ガードのせいで、長時間編集している間に
   他の人が保存した内容を、自分の保存時にまるごと上書きして消してしまう事故があったため。 */
function mergeStateForSave(latest, local, base){
  const merged = {...latest};
  const baseStaffMap = new Map((base?.staff||[]).map(s=>[s.id, s]));
  const localStaffMap = new Map((local.staff||[]).map(s=>[s.id, s]));
  const mergedStaffMap = new Map((latest.staff||[]).map(s=>[s.id, s])); // 基本は最新データを採用
  localStaffMap.forEach((localSt, id)=>{
    const baseSt = baseStaffMap.get(id);
    const changed = !baseSt || JSON.stringify(baseSt) !== JSON.stringify(localSt);
    if(changed || !mergedStaffMap.has(id)){
      mergedStaffMap.set(id, localSt); // 自分が実際に触った(=基準点から変化した)人だけ、自分の値を優先
    }
  });
  merged.staff = Array.from(mergedStaffMap.values());
  // 年度は増える一方の情報なので、両方を合わせる
  merged.years = Array.from(new Set([...(latest.years||[]), ...(local.years||[])])).sort();
  return merged;
}
/* 変更履歴は「追加」と「削除」だけのログなので、id単位の3-wayマージで正しく合成できる。
   自分が追加した分は足す、自分が削除した分は(他人がまだ持っていても)消す、
   それ以外(他人が追加/削除した分)は最新データをそのまま尊重する。 */
function mergeHistoryForSave(latest, local, base){
  const baseIds = new Set((base||[]).map(h=>h.id));
  const localIds = new Set((local||[]).map(h=>h.id));
  const addedLocally = (local||[]).filter(h=>!baseIds.has(h.id));
  const deletedLocally = new Set((base||[]).filter(h=>!localIds.has(h.id)).map(h=>h.id));
  const merged = (latest||[]).filter(h=>!deletedLocally.has(h.id));
  const mergedIds = new Set(merged.map(h=>h.id));
  addedLocally.forEach(h=>{ if(!mergedIds.has(h.id)){ merged.push(h); mergedIds.add(h.id); } });
  merged.sort((a,b)=> (b.ts||"").localeCompare(a.ts||"")); // 新しい順
  return merged;
}
/* 保存は1つずつ順番に行う。連続操作で保存が並行すると、古い取得結果で新しい変更を上書きしうるため。 */
let saveChain = Promise.resolve();

  saveChain = saveChain.then(saveStateNow, saveStateNow);

  // ---- 本体(staff/years) ----
  try{
    const snap = await get(stateRef);
    const latestRaw = snap.val();
    if(latestRaw){
      const merged = mergeStateForSave(migrateCoreState(latestRaw), {staff:state.staff, years:state.years}, lastServerCore);
      state.staff = merged.staff;
      state.years = merged.years;
    }
  }catch(e){
    console.error("保存前の再取得に失敗。手元のデータでそのまま保存します", e);
  }
  state.updatedAt = new Date().toISOString();
  try{
    await set(stateRef, { staff: state.staff, years: state.years, updatedAt: state.updatedAt });
    lastServerCore = JSON.parse(JSON.stringify({staff: state.staff, years: state.years}));
  }catch(e){
    console.error("save failed", e);
    showToast("保存に失敗しました");
    return;
  }

  // ---- 変更履歴(別パス。頻繁に増減するので本体と分けて保存している) ----
  const historyChangedLocally = JSON.stringify(lastServerHistory||[]) !== JSON.stringify(state.history||[]);
  if(historyChangedLocally){
    try{
      const histSnap = await get(historyRef);
      const latestHistory = Array.isArray(histSnap.val()) ? histSnap.val() : [];
      state.history = mergeHistoryForSave(latestHistory, state.history, lastServerHistory);
      await set(historyRef, state.history);
      lastServerHistory = JSON.parse(JSON.stringify(state.history));
    }catch(e){
      console.error("history save failed", e);
    }
  }
  showToast("保存しました(全員に共有されます)");
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg || "保存しました";
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

/* ---- ログインコードから「今ログインしているのが誰か」を自動判定する ---- */
let currentPersonName = null;
function getLoginCode(){
  const email = auth.currentUser?.email || "";
  return email.split("@")[0];
}
function resolveCurrentPersonName(){
  if(!state) return null;
  const code = String(getLoginCode());
  const match = (state.staff||[]).find(s=>String(s.code)===code);
  return match ? match.name : null;
}
/* 権限まわり:今ログインしている人のスタッフレコードと、その人が管理者かどうか。
   まだサーバー側(Firebaseセキュリティルール)では強制していない「見た目レベル」の制御で、
   本当の意味でのアクセス制御ではない点に注意(開発者ツールから操作すれば技術的には回避できる)。 */
function currentStaffObj(){
  if(!state) return null;
  return (state.staff||[]).find(s=>s.name===currentPersonName) || null;
}
/* 評価担当:担当に指定されている人が評価者から外れた・退職した場合は「未割り当て」として扱う */
function assignedEvaluatorOf(staffObj){
  if(!staffObj || !staffObj.assignedEvaluatorId) return null;
  const ev = state.staff.find(s=>s.id===staffObj.assignedEvaluatorId);
  return (ev && ev.isEvaluator && ev.status==="active" && ev.id!==staffObj.id) ? ev : null;
}
function activeEvaluatees(){
  return state.staff.filter(s=>s.isEvaluatee && s.status==="active");
}
function assigneesOf(evaluatorId){
  return activeEvaluatees().filter(s=> assignedEvaluatorOf(s)?.id===evaluatorId);
}
/* 評価の進み具合:todo=未入力 / doing=入力あり・未確定 / done=確定済み / skip=評価対象外 */
function evalStatus(staffObj, year, period){
  const pd = staffObj.yearData?.[year]?.[period];
  if(!pd) return "todo";
  if(pd.exempt) return "skip";
  if(pd.confirmed) return "done";
  const hasInput = Object.values(pd.scores||{}).some(v=>v>0) || (pd.bonus||0)>0 || (pd.comment||"").trim() || (pd.evaluatorGoal||"").trim();
  return hasInput ? "doing" : "todo";
}
const EVAL_STATUS_LABEL = {todo:"未入力", doing:"入力中", done:"確定済み", skip:"対象外"};
function isCurrentUserAdmin(){
  const s = currentStaffObj();
  return !!(s && s.isAdmin);
}

   一時的な別インスタンスを作ってそこで作成し、使い終わったら破棄する。 */
async function createLoginAccount(code, password){
  const tempApp = initializeApp(firebaseConfig, "temp-"+Date.now());
  const tempAuth = getAuth(tempApp);

    await createUserWithEmailAndPassword(tempAuth, codeToEmail(code), password);
  } finally {
    await deleteApp(tempApp);
  }
}

/* ---------- 変更履歴の記録 ---------- */
/* 評価スコア以外の重要な変更(管理者権限の付与・剥奪、シフトデータの削除など)を
   変更履歴に記録するための汎用ヘルパー。diffAndLogと同じ形式のエントリを1件追加する。 */
function logGenericChange(staffName, field, oldValue, newValue){
  state.history.unshift({
    id: "h"+Date.now()+Math.random().toString(36).slice(2,6),
    ts: new Date().toISOString(), user: currentPersonName || `(不明:${getLoginCode()})`,
    staffName, year:"-", period:"-", field, oldValue, newValue,
  });
}
function diffAndLog(staffObj, year, period, before, after){
  const entries = [];
  ALL_ITEMS.forEach(it=>{
    const ov = before.scores[it.name] ?? 0, nv = after.scores[it.name] ?? 0;
    if(ov !== nv) entries.push({field: it.name, oldValue: String(ov), newValue: String(nv)});
  });
  if((before.bonus ?? 0) !== (after.bonus ?? 0)) entries.push({field:"加点", oldValue:String(before.bonus ?? 0), newValue:String(after.bonus ?? 0)});
  if((before.evaluator || "") !== (after.evaluator || "")) entries.push({field:"評価者", oldValue: before.evaluator || "(未選択)", newValue: after.evaluator || "(未選択)"});
  if((before.comment || "") !== (after.comment || "")) entries.push({field:"コメント", oldValue:"(変更前あり)", newValue:"(変更後あり)"});
  if((before.evaluatorGoal || "") !== (after.evaluatorGoal || "")) entries.push({field:"目標設定", oldValue:"(変更前あり)", newValue:"(変更後あり)"});
  if(!!before.confirmed !== !!after.confirmed) entries.push({field:"ステータス", oldValue: before.confirmed ? "確定" : "編集中", newValue: after.confirmed ? "確定" : "編集中"});
  if(!!before.exempt !== !!after.exempt) entries.push({field:"評価対象外", oldValue: before.exempt ? "対象外" : "対象内", newValue: after.exempt ? "対象外" : "対象内"});
  if(entries.length===0) return;
  const ts = new Date().toISOString();
  entries.forEach(e=>{
    state.history.unshift({
      id: "h"+Date.now()+Math.random().toString(36).slice(2,6),

/* 「4月・7月・10月・1月」のうち、今日時点で直近に経過している時期と、
   それが属する年度をあわせて判定する。1〜3月は前年度の1月分として扱う。
   (例:2026年9月なら → 2026年度・7月。2027年2月なら → 2026年度・1月) */
function computeCurrentPeriodDefault(){
  const now = new Date();
  const month = now.getMonth() + 1; // 1-12
  const calYear = now.getFullYear();
  let period, fiscalYear;
  if(month>=4 && month<=6){ period="4月"; fiscalYear=calYear; }
  else if(month>=7 && month<=9){ period="7月"; fiscalYear=calYear; }
  else if(month>=10 && month<=12){ period="10月"; fiscalYear=calYear; }
  else { period="1月"; fiscalYear=calYear-1; }
  return { period, fiscalYear: String(fiscalYear) };
}
let defaultsApplied = false;
/* 指定した年度・時期について、対象となる全スタッフ(在籍中の被評価者)が確定済み(または評価対象外)かどうか。
   「ATS評価-全体」下部の「未確定◯名」表示と同じ母集団(在籍中のみ)で判定する。
   対象者が1人もいない場合はfalse扱い(進める根拠がないため)。 */
function isPeriodFullyConfirmed(fiscalYear, period){
  const evaluatees = state.staff.filter(s=>s.isEvaluatee && s.status==="active");
  if(evaluatees.length===0) return false;
  return evaluatees.every(s=>{
    const yd = s.yearData[fiscalYear];
    const pd = yd ? yd[period] : undefined;
    if(!pd) return false;
    return !!(pd.confirmed || pd.exempt);
  });
}
/* 時期を1つ先に進める。「1月」の次は翌年度の「4月」だが、翌年度がまだ作られていない場合は
   進めようがないので、そのまま(変化なし)を返す。 */
function advancePeriod(fiscalYear, period){
  const idx = PERIODS.indexOf(period);
  if(idx < PERIODS.length-1){
    return { period: PERIODS[idx+1], fiscalYear };
  }
  const nextYear = String(Number(fiscalYear)+1);
  if(state.years.includes(nextYear)){
    return { period: PERIODS[0], fiscalYear: nextYear };
  }
  return { period, fiscalYear }; // これ以上進められない
}
/* 「1つ前の評価時期」を返す(1月の前は前年度の10月)。前年度自体が存在しない場合はnull。
   目標は「設定した期間の次の期間に対する目標」として扱うため、
   「今の期間の目標を振り返る」には1つ前の期間に設定された目標を見に行く必要がある。 */
function previousPeriodRef(fiscalYear, period){
  const idx = PERIODS.indexOf(period);
  if(idx > 0) return { period: PERIODS[idx-1], fiscalYear };
  const prevYear = String(Number(fiscalYear)-1);
  if(state.years.includes(prevYear)) return { period: PERIODS[PERIODS.length-1], fiscalYear: prevYear };
  return null;
}
function periodLabel(ref, currentFiscalYear){
  if(!ref) return "";
  return ref.fiscalYear===currentFiscalYear ? ref.period : `${ref.fiscalYear}年度${ref.period}`;
}
function applyDefaultYearAndPeriod(){
  if(defaultsApplied) return;
  defaultsApplied = true;
  let { period, fiscalYear } = computeCurrentPeriodDefault();
  fiscalYear = state.years.includes(fiscalYear) ? fiscalYear : state.years[state.years.length-1];
  // 日付ベースの時期が全員確定済みなら、まだ確定しきっていない時期まで自動で進める
  for(let i=0; i<PERIODS.length*state.years.length; i++){
    if(!isPeriodFullyConfirmed(fiscalYear, period)) break;
    const next = advancePeriod(fiscalYear, period);
    if(next.period===period && next.fiscalYear===fiscalYear) break; // これ以上進めない
    period = next.period;
    fiscalYear = next.fiscalYear;
  }
  selectedYear = fiscalYear;
  dashboardPeriod = period;
  entrySelectedPeriod = period;
  personalChartPeriod = period;
  nineboxPeriod = period;
  myPagePeriod = period;
  mySelfPeriod = period;
  goalTrainingPeriod = period;
  homePeriod = period;
}

/* ---------- CSVエクスポート共通ヘルパー ---------- */
function csvEscape(v){
  const s = String(v ?? "");
  if(/[",\n]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
  return s;
}
function downloadCSV(filename, rows){
  const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"}); // BOM付きでExcelの文字化けを防ぐ
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function affiliationMatches(aff, filter){
  if(filter==="all") return true;
  if(filter==="hall") return aff==="ホール" || aff==="両方";
  if(filter==="kitchen") return aff==="キッチン" || aff==="両方";
  return true;
}

let entrySelectedId = null;

/* 名前で絞り込める検索欄。プルダウンだと人数が多い時に探しづらいための代替。
   input+datalistではなく自前でドロップダウンパネルを描画している(iOS Safariでdatalistの候補が
   ほぼ表示されない/不安定という問題があるため、どの端末でも同じ見た目・動きになるようにした)。 */
function buildStaffSearchInput(visibleStaff, selectedId, onSelect){
  const STATUS_LABEL = {active:"", leave:"(休職)", resigned:"(退職)"};
  const labelFor = s => `${s.name}${STATUS_LABEL[s.status]||""}`;
  const box = document.createElement("div");
  box.style.cssText = "position:relative;flex:1;";
  const input = document.createElement("input");
  input.type = "text";
  input.placeholder = "名前で検索...";
  input.autocomplete = "off";
  const current = visibleStaff.find(s=>s.id===selectedId);
  input.value = current ? labelFor(current) : "";
  box.appendChild(input);

  const panel = document.createElement("div");
  panel.style.cssText = "position:absolute;top:100%;left:0;right:0;background:#fff;border:1px solid var(--line);border-radius:8px;margin-top:4px;max-height:260px;overflow-y:auto;z-index:30;box-shadow:0 8px 24px rgba(0,0,0,0.14);display:none;";
  box.appendChild(panel);

  function renderPanel(filterText){
    const q = (filterText||"").trim().toLowerCase();
    const matches = visibleStaff.filter(s=> !q || labelFor(s).toLowerCase().includes(q));
    panel.innerHTML = "";
    if(matches.length===0){
      const empty = document.createElement("div");
      empty.style.cssText = "padding:10px 14px;color:var(--muted);font-size:13px;";
      empty.textContent = "該当するスタッフがいません";
      panel.appendChild(empty);
    } else {
      matches.forEach(s=>{
        const item = document.createElement("div");
        item.textContent = labelFor(s);
        item.style.cssText = "padding:9px 14px;font-size:13.5px;cursor:pointer;";
        item.onmouseenter = ()=>{ item.style.background = "var(--cream)"; };
        item.onmouseleave = ()=>{ item.style.background = ""; };
        // blurより先に発火させたいのでmousedownで拾う(タッチ操作でも同様に発火する)
        item.onmousedown = (e)=>{
          e.preventDefault();
          input.value = labelFor(s);
          panel.style.display = "none";
          onSelect(s.id);
        };
        panel.appendChild(item);
      });
    }
    panel.style.display = "block";
  }

  input.oninput = ()=> renderPanel(input.value);
  input.onfocus = ()=>{ input.select(); renderPanel(""); };
  input.onblur = ()=>{ setTimeout(()=>{ panel.style.display = "none"; }, 120); };
  return box;
}

/* ============================== ATS評価-個人(紙の評価票と同じ形で、4期間を横並びに表示。閲覧専用) ============================== */
/* ---------- 個人タブ用:カテゴリ別達成率・店舗平均・SVGチャート ---------- */
/* 評価入力・自己評価で共通の点数表(チップ)。
   チップ押下時にrender()を呼ぶと画面全体が再構築され横スクロール位置が戻るため、
   値の更新とその行の見た目だけをその場で切り替え、追加処理はonChangeに任せる。 */
function buildScoreChipTable(scores, {locked=false, onChange=()=>{}} = {}){
  const list = document.createElement("div");
  list.className = "score-list";
  if(locked) list.style.opacity = "0.6";
  CATEGORIES.forEach(cat=>{
    const head = document.createElement("div");
    head.className = "score-cat " + CAT_CLASS[cat.id];
    head.textContent = cat.label;
    list.appendChild(head);
    cat.items.forEach(it=>{
      const row = document.createElement("div");
      row.className = "score-item";
      const nm = document.createElement("div");
      nm.className = "nm";
      nm.textContent = it.name;
      row.appendChild(nm);
      const chipGroup = document.createElement("div");
      chipGroup.className = "chip-group";
      const current = scores[it.name] ?? 0;
      for(let v=0; v<=it.max; v++){
        const chip = document.createElement("button");
        chip.className = "chip-btn" + (v===current ? " selected" : "");
        chip.textContent = v;
        chip.disabled = locked;
        chip.onclick = ()=>{
          scores[it.name] = v;
          chipGroup.querySelectorAll(".chip-btn").forEach(b=> b.classList.remove("selected"));
          chip.classList.add("selected");
          onChange();
        };
        chipGroup.appendChild(chip);
      }
      row.appendChild(chipGroup);
      list.appendChild(row);
    });
  });
  return list;
}
function categoryPct(scores, cat){
  const vals = cat.items.map(it => (scores[it.name] ?? 0) / it.max);
  return Math.round((vals.reduce((a,b)=>a+b,0) / vals.length) * 100);
}
const OPERATION_ITEMS = CATEGORIES.slice(0,3).flatMap(c=>c.items.map(it=>({...it, categoryId:c.id}))); // ①キッチン②ホール③特殊技能=15項目
/* ホール項目はホール+両方の人だけ、キッチン項目はキッチン+両方の人だけで平均を取る。
   ③特殊技能はホール/キッチン専属どちらにも該当し得る項目のため絞り込まない。 */
function affiliationMatchesItem(staffAffiliation, categoryId){
  if(categoryId === "hall") return staffAffiliation === "ホール" || staffAffiliation === "両方";
  if(categoryId === "kitchen") return staffAffiliation === "キッチン" || staffAffiliation === "両方";
  return true;
}
/* 所属に加えて、項目側の「社員専用」等の指定(employTypeOnly)も考慮する。
   肉カット・シフト作成のように、原則社員の仕事であってアルバイト・パートには
   そもそも割り当てられない項目を、達成率や★保持者数の計算から正しく除外するため。 */
function itemAppliesToStaff(item, staffObj){
  if(item.employTypeOnly && !item.employTypeOnly.includes(staffObj.employType)) return false;
  return affiliationMatchesItem(staffObj.affiliation, item.categoryId);
}
function storeItemAvgPct(year, period, item){
  const relevantStaff = state.staff.filter(s=>
    s.isEvaluatee && s.status==="active" && s.yearData[year] && itemAppliesToStaff(item, s)
  );
  if(relevantStaff.length===0) return 0;
  const sum = relevantStaff.reduce((acc,s)=> acc + ((s.yearData[year][period].scores[item.name] ?? 0) / item.max * 100), 0);
  return Math.round(sum / relevantStaff.length);
}
function storeAverageTotal(year, period){
  const activeStaff = state.staff.filter(s=>s.isEvaluatee && s.status==="active" && s.yearData[year]);
  if(activeStaff.length===0) return 0;
  const sum = activeStaff.reduce((acc,s)=> acc + totalScore(s.yearData[year][period]), 0);
  return Math.round((sum / activeStaff.length) * 10) / 10;
}

/* ============================== データ分析(勤続 × 達成率の散布図) ============================== */
/* その人の所属に関係する項目(①②③のオペレーション15項目)だけで達成率%を出す */
function personalAchievementPct(staffObj, scores){
  const relevant = OPERATION_ITEMS.filter(it => itemAppliesToStaff(it, staffObj));
  if(relevant.length===0) return 0;
  const sum = relevant.reduce((acc,it)=> acc + (scores[it.name] ?? 0)/it.max, 0);
  return Math.round((sum/relevant.length)*1000)/10; // 小数第1位まで
}
/* 勤続(横軸) × 達成率(縦軸)の散布図。バケツ分け・伸び率の判定は行わず、点をそのままプロットする。 */
function buildScatterSVG(points){
  const width=760, height=440, pad={top:16, right:80, bottom:54, left:60};
  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const maxMonths = Math.max(24, ...points.map(p=>p.months), 1);
  const xFor = m => pad.left + (m/maxMonths)*plotW;
  const yFor = pct => pad.top + plotH - (Math.max(0,Math.min(100,pct))/100)*plotH;
  const yGrid = [0,25,50,75,100].map(v=>{
    const yy = yFor(v);
    return `<line x1="${pad.left}" y1="${yy}" x2="${width-pad.right}" y2="${yy}" stroke="#E7DFD2" stroke-width="1"/><text x="${pad.left-8}" y="${yy+3}" font-size="9" fill="#8A7F72" text-anchor="end">${v}%</text>`;
  }).join("");
  const maxYears = Math.ceil(maxMonths/12);
  const xGrid = [];
  for(let yrs=0; yrs<=maxYears; yrs++){
    const xx = xFor(yrs*12);
    if(xx > width-pad.right+1) continue;
    xGrid.push(`<line x1="${xx}" y1="${pad.top}" x2="${xx}" y2="${height-pad.bottom}" stroke="#F1EBDF" stroke-width="1"/><text x="${xx}" y="${height-pad.bottom+16}" font-size="9" fill="#8A7F72" text-anchor="middle">${yrs}年</text>`);
  }
  const axisLines = `
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height-pad.bottom}" stroke="#8A7F72" stroke-width="1.5"/>
    <line x1="${pad.left}" y1="${height-pad.bottom}" x2="${width-pad.right}" y2="${height-pad.bottom}" stroke="#8A7F72" stroke-width="1.5"/>
  `;
  const axisTitles = `
    <text x="${pad.left + plotW/2}" y="${height-8}" font-size="11.5" font-weight="700" fill="#2B2420" text-anchor="middle">勤続年数</text>
    <text x="16" y="${pad.top + plotH/2}" font-size="11.5" font-weight="700" fill="#2B2420" text-anchor="middle" transform="rotate(-90 16 ${pad.top + plotH/2})">オペレーション15項目達成率</text>
  `;
  const dots = points.map(p=>{
    const px = xFor(p.months), py = yFor(p.pct);
    return `<g>
      <circle cx="${px}" cy="${py}" r="5" fill="#C1531B" fill-opacity="0.78" stroke="#9C4013" stroke-width="1">
        <title>${p.label}:勤続${(p.months/12).toFixed(1)}年 ・ 達成率${p.pct}%</title>
      </circle>
      <text x="${px+7}" y="${py+3}" font-size="9" fill="#2B2420">${p.label}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:800px;display:block;">
    ${axisTitles}${yGrid}${xGrid.join("")}${axisLines}${dots}
  </svg>`;
}

function buildLineChartSVG(labels, seriesIndividual, seriesAvg, maxVal){
  const width=520, height=200, pad={top:16,right:16,bottom:26,left:30};
  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const n = labels.length;
  const xFor = i => pad.left + (n<=1?0:(plotW*i/(n-1)));
  const yFor = v => pad.top + plotH - (plotH * Math.max(0,Math.min(maxVal,v))/Math.max(1,maxVal));
  const grid = [0,0.5,1].map(f=>{
    const y = pad.top + plotH*(1-f);
    const val = Math.round(maxVal*f);
    return `<line x1="${pad.left}" y1="${y}" x2="${width-pad.right}" y2="${y}" stroke="#E7DFD2" stroke-width="1"/><text x="${pad.left-6}" y="${y+3}" font-size="9" fill="#8A7F72" text-anchor="end">${val}</text>`;
  }).join("");
  const xLabels = labels.map((l,i)=>`<text x="${xFor(i)}" y="${height-8}" font-size="10" fill="#2B2420" text-anchor="middle">${l}</text>`).join("");
  const pathFor = series => series.map((v,i)=> `${i===0?"M":"L"} ${xFor(i)} ${yFor(v)}`).join(" ");
  const dotsFor = (series,color) => series.map((v,i)=> `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3.5" fill="${color}"/>`).join("");
  const avgPart = seriesAvg ? `<path d="${pathFor(seriesAvg)}" fill="none" stroke="#8A7F72" stroke-width="2" stroke-dasharray="4,3"/>${dotsFor(seriesAvg,"#8A7F72")}` : "";
  const indPart = `<path d="${pathFor(seriesIndividual)}" fill="none" stroke="#C1531B" stroke-width="2.5"/>${dotsFor(seriesIndividual,"#C1531B")}`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:520px;display:block;">${grid}${xLabels}${avgPart}${indPart}</svg>`;
}
function buildPersonalRadarSVG(labels, individualPct, avgPct){
  const width=460, height=400, center={x:width/2, y:height/2}, radius=130;
  const n = labels.length;
  const angleStep = (2*Math.PI)/n;
  const pointFor = (val,i) => {
    const r = radius*(Math.max(0,Math.min(100,val))/100);
    const angle = -Math.PI/2 + i*angleStep;
    return [center.x + r*Math.cos(angle), center.y + r*Math.sin(angle)];
  };
  const polyStr = pts => pts.map(p=>p.join(",")).join(" ");
  const rings = [20,40,60,80,100].map(level=>{
    const pts = labels.map((_,i)=> pointFor(level,i));
    return `<polygon points="${polyStr(pts)}" fill="none" stroke="#E7DFD2" stroke-width="1"/>`;
  }).join("");
  const axisLines = labels.map((_,i)=>{
    const [x,y] = pointFor(100,i);
    return `<line x1="${center.x}" y1="${center.y}" x2="${x}" y2="${y}" stroke="#E7DFD2" stroke-width="1"/>`;
  }).join("");
  const textLabels = labels.map((lb,i)=>{
    const angle = -Math.PI/2 + i*angleStep;
    const lx = center.x + (radius+20)*Math.cos(angle);
    const ly = center.y + (radius+20)*Math.sin(angle);
    let anchor = "middle";
    if(Math.cos(angle) > 0.15) anchor = "start";
    else if(Math.cos(angle) < -0.15) anchor = "end";
    return `<text x="${lx}" y="${ly}" font-size="9.5" font-weight="700" fill="#2B2420" text-anchor="${anchor}" dominant-baseline="middle">${lb}</text>`;
  }).join("");
  const avgPts = labels.map((_,i)=> pointFor(avgPct[i],i));
  const indPts = labels.map((_,i)=> pointFor(individualPct[i],i));
  const avgPoly = `<polygon points="${polyStr(avgPts)}" fill="none" stroke="#8A7F72" stroke-width="2" stroke-dasharray="4,3"/>`;
  const indPoly = `<polygon points="${polyStr(indPts)}" fill="#C1531B" fill-opacity="0.22" stroke="#C1531B" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:460px;display:block;margin:0 auto;">${rings}${axisLines}${avgPoly}${indPoly}${textLabels}</svg>`;
}

    </div>
  `;
  wrap.appendChild(goalCard);

  wrap.appendChild(renderGrowthNotes(staffObj));

  return wrap;
}

/* その項目に関係する所属の在籍・被評価者のうち、★基準を満たしている人を返す(単一障害点検出用) */
/* その項目に関係する所属・雇用区分の在籍・被評価者のうち、★基準を満たしている人を返す(単一障害点検出用)。
   対象母数(relevantCount)も一緒に返す:保持者数だけでなく「対象が何人中何人か」を見るため。 */
function itemStarHolders(item, year, period){
  const relevantStaff = state.staff.filter(s=>
    s.isEvaluatee && s.status==="active" && itemAppliesToStaff(item, s)
  );
  const holders = [];
  relevantStaff.forEach(s=>{
    const yd = s.yearData[year];
    const pd = yd ? yd[period] : null;
    if(!pd || pd.exempt) return;
    const v = pd.scores[item.name] ?? 0;
    if(v >= starAt(item.max)) holders.push({staff:s, score:v, isPerfect: v>=item.max});
  });
  return { holders, relevantCount: relevantStaff.length };
}
/* ページ上部の全て/ホール/キッチンの絞り込みを、項目の表示可否として流用する */
function itemVisibleForFilter(item, filter){
  if(filter==="hall") return item.categoryId !== "kitchen";
  if(filter==="kitchen") return item.categoryId !== "hall";
  return true;
}

   開店準備(9-10時)・閉店後片付け(22時)は営業時間外の作業なのでチェック対象から除外する。 */
const SKILL_CHECK_EXCLUDED_HOURS = [9, 10, 22];

// タブをまたいで判定基準がこっそり変わらないようにする)。初回はnullでrenderShiftSkillCheck内で初期化。
let shiftSkillYear = null;
let shiftSkillPeriod = null;
function renderShiftSkillCheck(date){
  if(shiftSkillYear === null) shiftSkillYear = selectedYear;
  if(shiftSkillPeriod === null) shiftSkillPeriod = dashboardPeriod;

  const container = document.createElement("div");
  const title = document.createElement("div");
  title.style.cssText = "font-weight:800;font-size:15px;margin-bottom:10px;";
  title.textContent = "不足ポジション検知";
  container.appendChild(title);

  const criteriaRow = document.createElement("div");
  criteriaRow.style.cssText = "display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-bottom:14px;";
  const criteriaLabel = document.createElement("span");
  criteriaLabel.style.cssText = "font-size:12px;color:var(--muted);font-weight:700;";
  criteriaLabel.textContent = "評価基準:";
  criteriaRow.appendChild(criteriaLabel);
  const yearSelect = document.createElement("select");
  yearSelect.style.cssText = "width:auto;padding:5px 8px;font-size:12.5px;";
  yearSelect.innerHTML = state.years.map(y=>`<option value="${y}" ${y===shiftSkillYear?"selected":""}>${y}年度</option>`).join("");
  yearSelect.onchange = ()=>{ shiftSkillYear = yearSelect.value; render(); };
  criteriaRow.appendChild(yearSelect);
  PERIODS.forEach(p=>{
    const b = document.createElement("button");
    b.textContent = p;
    b.className = p===shiftSkillPeriod ? "active" : "";
    b.style.cssText = "font-size:12px;padding:5px 12px;";
    b.onclick = ()=>{ shiftSkillPeriod = p; render(); };
    criteriaRow.appendChild(b);
  });
  container.appendChild(criteriaRow);

  const shiftData = shiftDataCache[date];
  if(!shiftData){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = `${date}のシフトデータがまだありません`;
    container.appendChild(empty);
    return container;
  }

  const norm = s => s.replace(/\s+/g,"");
  const staffSegments = shiftData.staff.map(s=>{
    const match = state.staff.find(st=> norm(st.name) === norm(s.name));
    const segs = (s.segments||[]).map(seg=>({
      label: seg.label,
      startMin: timeStrToMinutes(seg.start),
      endMin: timeStrToMinutes(seg.end),
    })).filter(seg=> seg.startMin!==null && seg.endMin!==null);
    return { name: s.name, staffObj: match, segments: segs };
  });

  let minHour = Infinity, maxHour = -Infinity;
  staffSegments.forEach(s=> s.segments.forEach(seg=>{
    minHour = Math.min(minHour, Math.floor(seg.startMin/60));
    maxHour = Math.max(maxHour, Math.ceil(seg.endMin/60));
  }));
  if(!isFinite(minHour)){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "この日は誰も勤務していません";
    container.appendChild(empty);
    return container;
  }

  const CATS = [
    { label:"ホール", items: CATEGORIES.find(c=>c.id==="hall").items },
    { label:"キッチン", items: CATEGORIES.find(c=>c.id==="kitchen").items },
  ];

  const findings = [];
  for(let h=minHour; h<maxHour; h++){
    if(SKILL_CHECK_EXCLUDED_HOURS.includes(h % 24)) continue; // 開店準備・閉店後片付けは対象外
    const hStart = h*60, hEnd = h*60+60;
    CATS.forEach(cat=>{
      const present = staffSegments.filter(s=> s.segments.some(seg=> seg.label===cat.label && seg.startMin < hEnd && seg.endMin > hStart));
      if(present.length === 0) return;
      cat.items.forEach(item=>{
        const holderCount = present.filter(s=>{
          if(!s.staffObj) return false;
          const yd = s.staffObj.yearData[shiftSkillYear];
          const pd = yd ? yd[shiftSkillPeriod] : null;
          if(!pd || pd.exempt) return false;
          const v = pd.scores[item.name] ?? 0;
          return v >= starAt(item.max);
        }).length;
        if(holderCount === 0){
          findings.push({ hour:h, catLabel:cat.label, itemName:item.name, presentNames: present.map(s=>s.name) });
        }
      });
    });
  }

  if(findings.length === 0){
    const empty = document.createElement("div");
    empty.className = "empty";
    empty.textContent = "検出された不足はありません";
    container.appendChild(empty);
    return container;
  }

  findings.sort((a,b)=> a.hour - b.hour);
  findings.forEach(f=>{
    const row = document.createElement("div");
    row.style.cssText = "padding:10px 4px;border-bottom:1px solid var(--line);";
    row.innerHTML = `<div style="font-weight:800;font-size:13px;">${hourLabel(f.hour)} ・ ${f.catLabel} ・ <span style="color:#B23A2E;">${f.itemName}ができる人が0人</span></div><div style="font-size:12px;color:var(--muted);margin-top:3px;">配置されている人:${f.presentNames.join("、")}</div>`;
    container.appendChild(row);
  });

  return container;
}

/* ============================== シフトデータ ==============================
   「日別シフト」形式のExcel(1日分)を取り込む。このシートは文字ではなく
   セルの塗りつぶし色で「誰が・いつ・何(ホール/キッチン/休憩等)をしているか」を
   表現しているため、色を凡例(シート内のC列ラベル+B列の色)と照合して読み取る。
   凡例はシートから毎回動的に読み取るので、色の意味が変わっても追従できる。 */
function todayISO(){ return new Date().toISOString().slice(0,10); }
let shiftSelectedDate = todayISO();
let shiftUploadStatus = null;
let shiftDataCache = {}; // {date: パース済みデータ|null(未取込確認済み)}
let shiftDateListCache = null; // 取り込み済みの日付一覧(配列)。未取得ならnull
let shiftDateListFetching = false;
/* シフトの「日付一覧」だけを軽く取得するための専用インデックス(stores/.../shiftDates)。
   これが無いと、日付一覧を出すためだけに全日程・全スタッフの詳細データを毎回まるごと
   取得することになり、日数が増えるほど重くなってしまう。
   既存データ(このインデックスができる前に保存された日)は、初回だけ自動でインデックスに登録する。 */
let shiftDatesIndexMigrated = false;
async function migrateLegacyShiftDatesIfNeeded(){
  if(shiftDatesIndexMigrated) return;
  shiftDatesIndexMigrated = true;
  try{
    const indexSnap = await get(ref(db, `stores/${STORE_ID}/shiftDates`));
    if(indexSnap.exists()) return;
    const fullSnap = await get(ref(db, `stores/${STORE_ID}/shifts`));
    if(!fullSnap.exists()) return;
    const updates = {};
    Object.keys(fullSnap.val()).forEach(d=>{ updates[d] = true; });
    await set(ref(db, `stores/${STORE_ID}/shiftDates`), updates);
  }catch(e){ console.error("シフト日付インデックスの移行に失敗:", e); }
}
function ensureShiftDateListLoaded(){
  if(shiftDateListCache !== null || shiftDateListFetching) return;
  shiftDateListFetching = true;
  migrateLegacyShiftDatesIfNeeded()
    .then(()=> get(ref(db, `stores/${STORE_ID}/shiftDates`)))
    .then(snap=>{
      shiftDateListCache = snap.exists() ? Object.keys(snap.val()).sort() : [];
      shiftDateListFetching = false;
      render();
    }).catch(()=>{ shiftDateListCache = []; shiftDateListFetching = false; });
}
let shiftFetchInFlight = {};
/* シフトデータを(未取得なら)Firebaseから取り込んでキャッシュする共通処理。
   シフトデータタブ・データ分析タブの両方から使う。 */
function ensureShiftDataLoaded(date){
  if(!(date in shiftDataCache) && !shiftFetchInFlight[date]){
    shiftFetchInFlight[date] = true;
    get(ref(db, `stores/${STORE_ID}/shifts/${date}`)).then(snap=>{
      shiftDataCache[date] = snap.exists() ? snap.val() : null;
      delete shiftFetchInFlight[date];
      render();
    }).catch(()=>{ delete shiftFetchInFlight[date]; });
  }
}
/* "HH:MM" または "HH:MM(翌)" を、その日の0:00からの分数に変換する(翌日分は+1440) */
function timeStrToMinutes(t){
  const m = /^(\d{2}):(\d{2})(\(翌\))?$/.exec(t||"");
  if(!m) return null;
  let mins = parseInt(m[1],10)*60 + parseInt(m[2],10);
  if(m[3]) mins += 24*60;
  return mins;
}
function hourLabel(h){
  const displayHour = h % 24;
  return `${displayHour}時台` + (h>=24 ? "(翌)" : "");
}

function parseShiftWorkbook(workbook){
  const XL = window.XLSX;
  const ws = workbook.Sheets[workbook.SheetNames[0]];
  const range = XL.utils.decode_range(ws["!ref"]);

  const legend = {};
  for(let r=range.s.r; r<=range.e.r; r++){
    const labelCell = ws[XL.utils.encode_cell({r, c:2})];
    if(labelCell && typeof labelCell.v === "string" && labelCell.v.trim()){
      const bCell = ws[XL.utils.encode_cell({r, c:1})];
      if(bCell && bCell.s && bCell.s.fgColor && bCell.s.fgColor.rgb){
        legend[bCell.s.fgColor.rgb.toUpperCase()] = labelCell.v.trim();
      }
    }
  }

  let timeHeaderCol = null;
  for(let c=range.s.c; c<=range.e.c; c++){
    const cell = ws[XL.utils.encode_cell({r:0, c})];
    if(cell && cell.v === "時間"){ timeHeaderCol = c; break; }
  }
  const blockStartCol = 3; // D列(0-indexed)。5:00スタート、15分刻み
  const blockEndCol = (timeHeaderCol!==null ? timeHeaderCol-1 : blockStartCol+95);

  function colToTime(c){
    const blockIndex = c - blockStartCol;
    const hourOffset = Math.floor(blockIndex/4);
    const quarter = blockIndex % 4;
    const hour = (5 + hourOffset) % 24;
    const minute = quarter*15;
    return `${String(hour).padStart(2,"0")}:${String(minute).padStart(2,"0")}${(5+hourOffset)>=24 ? "(翌)" : ""}`;
  }

  const staffList = [];
  for(let r=1; r<=range.e.r; r++){
    const nameCell = ws[XL.utils.encode_cell({r, c:0})];
    const typeCell = ws[XL.utils.encode_cell({r, c:1})];
    if(!nameCell || typeof nameCell.v !== "string" || !nameCell.v.trim()) break; // 空行(区切り)で終了
    if(!typeCell || typeof typeCell.v !== "string" || !typeCell.v.trim()) break;
    const name = nameCell.v.replace(/\s+/g," ").trim();
    const employType = typeCell.v.trim();

    const segments = [];
    let cur = null;
    for(let c=blockStartCol; c<=blockEndCol; c++){
      const cell = ws[XL.utils.encode_cell({r, c})];
      const color = (cell && cell.s && cell.s.fgColor && cell.s.fgColor.rgb) ? cell.s.fgColor.rgb.toUpperCase() : null;
      const label = color ? (legend[color] || null) : null;
      const segStart = colToTime(c);
      const segEnd = colToTime(c+1); // このマスの「終わり」は次のマスの「開始」(15分刻み1マス=15分間)
      if(!cur || cur.label !== label){
        if(cur && cur.label) segments.push(cur);
        cur = { label, start: segStart, end: segEnd };
      } else {
        cur.end = segEnd;
      }
    }
    if(cur && cur.label) segments.push(cur);

    let totalHours = null, totalPay = null;
    for(let c=blockEndCol+1; c<=range.e.c; c++){
      const headerCell = ws[XL.utils.encode_cell({r:0, c})];
      const valCell = ws[XL.utils.encode_cell({r, c})];
      if(headerCell && headerCell.v === "時間" && totalHours===null && valCell) totalHours = valCell.v;
      if(headerCell && headerCell.v === "支給額" && totalPay===null && valCell) totalPay = valCell.v;
    }
    staffList.push({ name, employType, segments, totalHours, totalPay });
  }

  return { legend, staff: staffList };
}

/* 元のExcelに近い見た目のタイムライン表(行=スタッフ、列=時間、色は元シートの凡例と同じ配色)。
   ExcelのUIそのものではなく、パース済みの区間データから再構築した表。 */
function buildShiftGridSVG(shiftData){
  const labelToColor = {};
  Object.entries(shiftData.legend || {}).forEach(([hex, label])=>{ labelToColor[label] = "#"+hex; });

  let minStart = Infinity, maxEnd = -Infinity;
  const parsedStaff = shiftData.staff.map(s=>{
    const segs = (s.segments||[]).map(seg=>({
      label: seg.label,
      startMin: timeStrToMinutes(seg.start),
      endMin: timeStrToMinutes(seg.end),
    })).filter(seg=> seg.startMin!==null && seg.endMin!==null);
    segs.forEach(seg=>{ minStart = Math.min(minStart, seg.startMin); maxEnd = Math.max(maxEnd, seg.endMin); });
    return { name: s.name, segs };
  });
  if(!isFinite(minStart)){ minStart = 5*60; maxEnd = 6*60; }
  minStart = Math.floor(minStart/60)*60; // 目盛りが必ず正時に来るよう、30分ではなく60分単位で丸める
  maxEnd = Math.ceil(maxEnd/60)*60;
  const totalMin = Math.max(30, maxEnd - minStart);

  const rowH = 24, padTop = 24, padLeft = 92, padRight = 16, padBottom = 8;
  const chartW = 720;
  const width = padLeft + chartW + padRight;
  const height = padTop + parsedStaff.length*rowH + padBottom;
  const xFor = m => padLeft + ((m-minStart)/totalMin)*chartW;

  const gridParts = [];
  for(let m=minStart; m<=maxEnd; m+=60){
    const x = xFor(m);
    const hh = Math.floor(m/60) % 24;
    gridParts.push(`<line x1="${x}" y1="${padTop-2}" x2="${x}" y2="${height-padBottom}" stroke="#EFEAE1" stroke-width="1"/>`);
    gridParts.push(`<text x="${x}" y="${padTop-8}" font-size="9" fill="#8A7F72" text-anchor="middle">${hh}</text>`);
  }

  const rowParts = parsedStaff.map((s,i)=>{
    const y = padTop + i*rowH;
    const nameLabel = `<text x="${padLeft-8}" y="${y+rowH/2+4}" font-size="10.5" fill="#2B2420" text-anchor="end">${s.name}</text>`;
    const bars = s.segs.map(seg=>{
      const x1 = xFor(seg.startMin), x2 = xFor(seg.endMin);
      const color = labelToColor[seg.label] || "#999";
      return `<rect x="${x1}" y="${y+3}" width="${Math.max(1,x2-x1)}" height="${rowH-8}" fill="${color}" rx="2">
        <title>${s.name}:${seg.label} ${seg.start||""}</title>
      </rect>`;
    }).join("");
    const rowLine = `<line x1="${padLeft}" y1="${y+rowH}" x2="${width-padRight}" y2="${y+rowH}" stroke="#F5F0E6" stroke-width="1"/>`;
    return nameLabel + bars + rowLine;
  }).join("");

  return `<svg viewBox="0 0 ${width} ${height}" width="${width}" style="display:block;">${gridParts.join("")}${rowParts}</svg>`;
}

function renderShifts(){
  const wrap = document.createElement("div");
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "シフトデータ";
  wrap.appendChild(h);

  const uploadCard = document.createElement("div");
  uploadCard.className = "card";
  uploadCard.innerHTML = `<div style="font-weight:800;margin-bottom:10px;">日別シフトを挿入・保存</div>`;

  const row = document.createElement("div");
  row.className = "row";
  const dateBox = document.createElement("div");
  dateBox.className = "grow";
  dateBox.style.maxWidth = "200px";
  dateBox.innerHTML = `<label>対象日</label>`;
  const dateInput = document.createElement("input");
  dateInput.type = "date";
  dateInput.value = shiftSelectedDate;
  dateInput.onchange = ()=>{ shiftSelectedDate = dateInput.value; shiftUploadStatus = null; render(); };
  dateBox.appendChild(dateInput);
  row.appendChild(dateBox);

  const fileBox = document.createElement("div");
  fileBox.className = "grow";
  fileBox.innerHTML = `<label>Excelファイル(.xlsx)</label>`;
  const fileInput = document.createElement("input");
  fileInput.type = "file";
  fileInput.accept = ".xlsx,.xls";
  fileInput.onchange = ()=>{
    const file = fileInput.files[0];
    if(!file) return;
    const m = file.name.match(/(\d{4})(\d{2})(\d{2})/); // ファイル名の8桁の数字(YYYYMMDD)から日付を自動判定
    if(m){
      const iso = `${m[1]}-${m[2]}-${m[3]}`;
      shiftSelectedDate = iso;
      dateInput.value = iso;
      shiftUploadStatus = null;
    }
  };
  fileBox.appendChild(fileInput);
  row.appendChild(fileBox);
  uploadCard.appendChild(row);

  const uploadBtn = document.createElement("button");
  uploadBtn.className = "primary";
  uploadBtn.style.marginTop = "12px";
  uploadBtn.textContent = "挿入";
  uploadBtn.onclick = ()=>{
    const file = fileInput.files[0];
    if(!file){ shiftUploadStatus = {type:"error", message:"ファイルを選んでください。"}; render(); return; }
    if(typeof window.XLSX === "undefined"){
      shiftUploadStatus = {type:"error", message:"Excel読み込み機能の読み込みに失敗しました。ページを再読み込みしてください。"};
      render(); return;
    }
    const targetDate = shiftSelectedDate;
    const reader = new FileReader();
    reader.onload = async (e)=>{
      try{
        const data = new Uint8Array(e.target.result);
        const workbook = window.XLSX.read(data, {type:"array", cellStyles:true});
        const parsed = parseShiftWorkbook(workbook);
        if(parsed.staff.length === 0){
          shiftUploadStatus = {type:"error", message:"スタッフの行が見つかりませんでした。ファイル形式をご確認ください。"};
          render();
          return;
        }
        const payload = { ...parsed, uploadedAt: new Date().toISOString() };
        await set(ref(db, `stores/${STORE_ID}/shifts/${targetDate}`), payload);
        await set(ref(db, `stores/${STORE_ID}/shiftDates/${targetDate}`), true);
        shiftDataCache[targetDate] = payload;
        if(shiftDateListCache !== null && !shiftDateListCache.includes(targetDate)){
          shiftDateListCache.push(targetDate);
          shiftDateListCache.sort();
        }
        shiftUploadStatus = {type:"success", message:`${targetDate}のシフトを取り込みました(${parsed.staff.length}名分)。`};
        render();
      }catch(err){
        console.error(err);
        shiftUploadStatus = {type:"error", message:"取り込みに失敗しました:" + (err.message||"")};
        render();
      }
    };
    reader.readAsArrayBuffer(file);
  };
  uploadCard.appendChild(uploadBtn);

  if(shiftUploadStatus){
    const statusEl = document.createElement("div");
    statusEl.style.cssText = `margin-top:10px;font-size:13px;font-weight:700;color:${shiftUploadStatus.type==="error" ? "var(--red)" : "var(--green)"};`;
    statusEl.textContent = shiftUploadStatus.message;
    uploadCard.appendChild(statusEl);
  }
  if(isCurrentUserAdmin()){
    wrap.appendChild(uploadCard);
  }

  ensureShiftDateListLoaded();
  const listCard = document.createElement("div");
  listCard.className = "card";
  listCard.innerHTML = `<div style="font-weight:800;margin-bottom:10px;">取り込み済みの日</div>`;
  if(shiftDateListCache === null){
    listCard.innerHTML += `<div class="empty">読み込み中...</div>`;
  } else if(shiftDateListCache.length === 0){
    listCard.innerHTML += `<div class="empty">まだ取り込み済みの日がありません</div>`;
  } else {
    const chipWrap = document.createElement("div");
    chipWrap.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;";
    shiftDateListCache.forEach(d=>{
      const group = document.createElement("span");
      group.style.cssText = "display:inline-flex;align-items:center;border-radius:20px;overflow:hidden;" +
        (d===shiftSelectedDate ? "background:var(--ember);" : "border:1px solid var(--ember);");

      const chip = document.createElement("button");
      chip.textContent = d;
      chip.style.cssText = d===shiftSelectedDate
        ? "background:transparent;color:#fff;border:none;padding:6px 10px 6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;"
        : "background:transparent;color:var(--ember-dark);border:none;padding:6px 10px 6px 14px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;";
      chip.onclick = ()=>{ shiftSelectedDate = d; shiftUploadStatus = null; render(); };
      group.appendChild(chip);

      if(isCurrentUserAdmin()){
        const delBtn = document.createElement("button");
        delBtn.textContent = "✕";
        delBtn.title = "この日のシフトを削除";
        delBtn.style.cssText = d===shiftSelectedDate
          ? "background:transparent;color:#fff;border:none;padding:6px 12px 6px 4px;font-size:11px;cursor:pointer;font-family:inherit;opacity:0.85;"
          : "background:transparent;color:var(--ember-dark);border:none;padding:6px 12px 6px 4px;font-size:11px;cursor:pointer;font-family:inherit;opacity:0.7;";
        delBtn.onclick = (e)=>{
          e.stopPropagation();
          showModal(`${d}のシフトデータを削除します。元に戻せません。よろしいですか?`, async ()=>{
            try{
              await set(ref(db, `stores/${STORE_ID}/shifts/${d}`), null);
              await set(ref(db, `stores/${STORE_ID}/shiftDates/${d}`), null);
            }catch(err){ console.error(err); }
            delete shiftDataCache[d];
            if(shiftDateListCache) shiftDateListCache = shiftDateListCache.filter(x=>x!==d);
            if(shiftSelectedDate === d) shiftUploadStatus = null;
            logGenericChange("(シフトデータ)", "削除", d, "-");
            saveState();
            showToast(`${d}のシフトを削除しました`);
            render();
          }, {confirmLabel:"削除する"});
        };
        group.appendChild(delBtn);
      }

      chipWrap.appendChild(group);
    });
    listCard.appendChild(chipWrap);
  }
  wrap.appendChild(listCard);

  // 選択中の日付のデータをFirebaseから(初回のみ)取得してキャッシュする
  ensureShiftDataLoaded(shiftSelectedDate);

  const statusCard = document.createElement("div");
  statusCard.className = "card";
  const currentData = shiftDataCache[shiftSelectedDate];
  statusCard.innerHTML = currentData
    ? `<div style="font-size:13px;color:var(--muted);">${shiftSelectedDate}分:取り込み済み(${currentData.staff.length}名)</div>`
    : `<div class="empty">${shiftSelectedDate}のシフトはまだ取り込まれていません</div>`;
  wrap.appendChild(statusCard);

  if(currentData){
    const gridCard = document.createElement("div");
    gridCard.className = "card";
    gridCard.innerHTML = `<div style="font-weight:800;margin-bottom:10px;">${shiftSelectedDate} のシフト表</div>`;
    const scrollWrap = document.createElement("div");
    scrollWrap.style.cssText = "overflow-x:auto;";
    scrollWrap.innerHTML = buildShiftGridSVG(currentData);
    gridCard.appendChild(scrollWrap);
    const legendWrap = document.createElement("div");
    legendWrap.style.cssText = "display:flex;flex-wrap:wrap;gap:14px;margin-top:12px;font-size:11.5px;color:var(--muted);";
    const labelToColor = {};
    Object.entries(currentData.legend || {}).forEach(([hex, label])=>{ labelToColor[label] = "#"+hex; });
    Object.entries(labelToColor).forEach(([label, color])=>{
      const span = document.createElement("span");
      span.style.cssText = "display:inline-flex;align-items:center;gap:5px;";
      span.innerHTML = `<span style="width:10px;height:10px;background:${color};border-radius:3px;display:inline-block;"></span>${label}`;
      legendWrap.appendChild(span);
    });
    gridCard.appendChild(legendWrap);
    wrap.appendChild(gridCard);
  }

  if(currentData){
    const skillCheckCard = document.createElement("div");
    skillCheckCard.className = "card";
    skillCheckCard.appendChild(renderShiftSkillCheck(shiftSelectedDate));
    wrap.appendChild(skillCheckCard);
  }

  return wrap;
}

  [...state.staff].sort((a,b)=> Number(a.code)-Number(b.code)).forEach(st=>{

    const meta = STATUS_META[st.status] || STATUS_META.active;
    tr.innerHTML = `<td class="name-col sm-sticky" style="${st.hasLogin ? "" : "color:var(--muted);"}">${st.name}</td>`;
    // 権限:押すとON/OFFが切り替わるラベル

    actionGroup.appendChild(editStaffBtn);
    const loginBtn = document.createElement("button");
    loginBtn.textContent = st.hasLogin ? "ログイン再設定" : "ログイン設定";
    loginBtn.style.cssText = pillStyle;
    loginBtn.onclick = ()=>{
      showInputModal(
        `${st.name}さん(社員CD: ${st.code})のログインパスワードを設定します。\n6文字以上で入力してください。${st.hasLogin ? "\n※既に設定済みのようです。パスワードの再設定(リセット)は現在の仕組みではできません。" : ""}`,
        async (password, close)=>{
          if(!password || password.length < 6){ throw new Error("パスワードは6文字以上にしてください(Firebaseの制限です)。"); }
          try{
            await createLoginAccount(st.code, password);
          }catch(e){
            throw new Error(e.code==="auth/email-already-in-use" ? "このスタッフのログインは既に設定済みです。" : ("作成に失敗しました:" + (e.message||"")));
          }
          st.hasLogin = true;
          await saveState();
          close();
          showToast(`${st.name}さんのログインを設定しました`);
          render();
        },
        {inputType:"password", placeholder:"新しいパスワード", confirmLabel:"設定する"}
      );
    };
    actionGroup.appendChild(loginBtn);
    actionTd.appendChild(actionGroup);
    tr.appendChild(actionTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  listCard.appendChild(tableWrap);
  wrap.appendChild(listCard);


  return wrap;
}

function renderHomeAdmin(){
  const wrap = document.createElement("div");
  const me = currentStaffObj();
  wrap.appendChild(homeTitle(`ホーム(${selectedYear}年度)`));
  wrap.appendChild(renderPeriodButtons(homePeriod, (p)=>{ homePeriod = p; render(); }));

  // 自分の担当(評価者の場合)
  if(me && me.isEvaluator){
    const mine = assigneesOf(me.id);
    const card = document.createElement("div");
    card.className = "card";
    const byStatus = {todo:[], doing:[], done:[], skip:[]};
    mine.forEach(s=> byStatus[evalStatus(s, selectedYear, homePeriod)].push(s));
    const canConfirm = isCurrentUserAdmin(); // 確定できない評価者は、入力が済めば自分のやることは完了
    const remaining = byStatus.todo.length + (canConfirm ? byStatus.doing.length : 0);
    card.innerHTML = `<div class="home-card-title">あなたの担当(${homePeriod}分)</div>
      <div class="home-card-sub">${mine.length===0 ? "担当が割り当てられていません。" : remaining===0 ? (canConfirm ? `担当${mine.length}人の評価はすべて確定しています。` : `担当${mine.length}人の入力はすべて終わっています。確定は管理者が行います。`) : `担当${mine.length}人のうち、残り${remaining}人です。`}</div>`;
    const groups = canConfirm ? [["todo","未入力"], ["doing","入力中・確定待ち"]] : [["todo","未入力"]];
    groups.forEach(([key,label])=>{
      if(byStatus[key].length===0) return;
      const head = document.createElement("div");
      head.className = "todo-group-head";
      head.textContent = `${label}(${byStatus[key].length})`;
      card.appendChild(head);
      byStatus[key].forEach(s=> card.appendChild(todoRow(s, key, ()=>openEntryFor(s.id, homePeriod))));
    });
    const doneList = canConfirm ? [...byStatus.done, ...byStatus.skip] : [...byStatus.doing, ...byStatus.done, ...byStatus.skip];
    if(doneList.length){
      const det = document.createElement("details");
      det.innerHTML = `<summary class="todo-group-head" style="cursor:pointer;">${canConfirm ? "確定済み・対象外" : "入力済み・確定済み"}(${doneList.length})</summary>`;
      doneList.forEach(s=>{
        const st = evalStatus(s, selectedYear, homePeriod);
        det.appendChild(todoRow(s, st==="doing" ? "done" : st, ()=>openEntryFor(s.id, homePeriod), st==="doing" ? "入力済み" : null));
      });
      card.appendChild(det);
    }
    wrap.appendChild(card);
  }

  // 全体の進み具合(管理者)
  if(isCurrentUserAdmin()){
    const card = document.createElement("div");
    card.className = "card";
    const all = activeEvaluatees();
    const doneCount = all.filter(s=>["done","skip"].includes(evalStatus(s, selectedYear, homePeriod))).length;
    const pct = all.length ? Math.round(doneCount/all.length*100) : 0;
    card.innerHTML = `<div class="home-card-title">全体の進み具合(${homePeriod}分)</div>
      <div style="font-size:13px;font-weight:700;">確定 ${doneCount} / ${all.length}人</div>
      <div class="progress-bar"><div style="width:${pct}%"></div></div>`;

    const evaluators = state.staff.filter(s=>s.isEvaluator && s.status==="active");
    evaluators.forEach(ev=>{
      const list = assigneesOf(ev.id);
      if(list.length===0) return;
      const st = list.map(s=>evalStatus(s, selectedYear, homePeriod));
      const n = k => st.filter(x=>x===k).length;
      const row = document.createElement("div");
      row.className = "assign-row";
      row.innerHTML = `<div class="nm">${ev.name}</div>
        <span class="st-chip todo" style="${n("todo")?"":"visibility:hidden"}">未入力 ${n("todo")}</span>
        <span class="st-chip doing" style="${n("doing")?"":"visibility:hidden"}">入力中 ${n("doing")}</span>
        <span class="st-chip done">確定 ${n("done")+n("skip")}/${list.length}</span>`;
      card.appendChild(row);
    });

    const unassigned = all.filter(s=>!assignedEvaluatorOf(s));
    if(unassigned.length){
      const task = document.createElement("div");
      task.className = "home-task";
      task.style.marginTop = "12px";
      task.innerHTML = `<div class="msg">評価担当が決まっていない人が${unassigned.length}人います</div>`;
      const go = document.createElement("button");
      go.className = "btn-ghost";
      go.textContent = "担当を割り当てる";
      go.onclick = ()=>{ activeTab = "staffAdmin"; render(); };
      task.appendChild(go);
      card.appendChild(task);
    }
    wrap.appendChild(card);
  }

  const menuCard = document.createElement("div");
  menuCard.className = "card";
  menuCard.innerHTML = `<div class="home-card-title" style="margin-bottom:12px;">メニュー</div>`;
  menuCard.appendChild(menuGrid(ADMIN_TABS.filter(t=>t.id!=="home").map(t=>({id:t.id, label:t.label, desc:ADMIN_MENU_DESC[t.id]||""}))));
  wrap.appendChild(menuCard);
  return wrap;
}
