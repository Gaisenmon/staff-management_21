<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱旋門 ATS評価システム</title>
<style>
  :root{
    --charcoal:#241E19;
    --charcoal-2:#332A22;
    --ember:#C1531B;
    --ember-dark:#9C4013;
    --cream:#FBF6EE;
    --card:#FFFFFF;
    --ink:#2B2420;
    --muted:#8A7F72;
    --line:#E7DFD2;
    --green:#3F7D4C;
    --green-bg:#E4F1E6;
    --amber:#C98A2C;
    --amber-bg:#FBF0DC;
    --gray-bg:#EFEAE1;
    --gray-ink:#9C9184;
    --training:#2F6FA8;
    --training-bg:#E4EEF5;
    --gold:#A9760B;
    --gold-bg:#FBF0D2;
    --cat-kitchen:#F5E7DA;
    --cat-hall:#E4EEF1;
    --cat-special:#EDE7F3;
    --cat-shift:#FBF0DC;
    --cat-attitude:#E4F1E6;
  }
  *{box-sizing:border-box;}
  body{margin:0;background:var(--cream);color:var(--ink);font-family:"Hiragino Sans","Yu Gothic UI","Noto Sans JP",-apple-system,sans-serif;-webkit-font-smoothing:antialiased;}
  .app{min-height:100vh;display:flex;flex-direction:column;}
  header{background:linear-gradient(135deg, var(--charcoal), var(--charcoal-2));color:#F2E9DC;padding:20px 26px 0 26px;border-bottom:4px solid var(--ember);}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em;white-space:nowrap;}
  .brand .tag{font-size:11px;color:#C8BBA8;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:2px 10px;}
  .mode-toggle{
    display:flex;gap:2px;
    background:rgba(255,255,255,0.08);border-radius:20px;padding:2px;flex:none;
  }
  .mode-toggle button{
    background:transparent;border:none;color:#C8BBA8;padding:4px 12px;
    font-size:11px;font-weight:700;border-radius:16px;cursor:pointer;font-family:inherit;
  }
  .mode-toggle button.active{background:var(--ember);color:#fff;}
  body.mobile-mode .mode-toggle{align-self:flex-start;}

  /* ===== スマホ専用モード(PC版のレイアウトとは完全に切り離した見た目) ===== */
  body.mobile-mode header{padding:14px 14px 0 14px;}
  body.mobile-mode .brand{flex-direction:column;align-items:flex-start;gap:8px;justify-content:flex-start !important;}
  body.mobile-mode .brand h1{font-size:16px;}
  body.mobile-mode #top-right-slot{
    display:flex !important;flex-direction:row !important;flex-wrap:wrap;
    align-items:center !important;width:100%;gap:8px;
  }
  body.mobile-mode .sync-row{font-size:10px;margin-bottom:8px;}
  /* タブは折り返さず横スクロールに(前のホール運営システムと同じ方式) */
  body.mobile-mode nav{flex-wrap:nowrap;overflow-x:auto;-webkit-overflow-scrolling:touch;padding-bottom:2px;}
  body.mobile-mode nav button{padding:9px 12px;font-size:12.5px;flex:none;}
  body.mobile-mode main{padding:14px 12px 50px;}
  body.mobile-mode h2.title{font-size:16px;}
  body.mobile-mode .card{padding:14px;border-radius:10px;}
  body.mobile-mode .title-row{flex-direction:column;align-items:stretch;gap:10px;}
  body.mobile-mode .chart-grid{grid-template-columns:1fr !important;}
  body.mobile-mode .meta-row{flex-direction:column;gap:6px;}
  body.mobile-mode .item-name{width:92px !important;font-size:11.5px;}
  body.mobile-mode .staff-picker{max-width:none;}
  body.mobile-mode table{font-size:11px;}
  body.mobile-mode .btn-group button{padding:7px 12px;font-size:12px;}
  /* iOSは16px未満のinput/selectにフォーカスすると自動ズームしてしまうため、スマホ表示では16pxに統一 */
  body.mobile-mode select, body.mobile-mode input[type=text], body.mobile-mode input[type=date],
  body.mobile-mode input[type=number], body.mobile-mode input[type=password], body.mobile-mode textarea{font-size:16px;}

  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav button{background:transparent;border:none;color:#D8CBB8;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0;position:relative;top:1px;font-family:inherit;}
  nav button.active{background:var(--cream);color:var(--ink);}
  nav button:not(.active):hover{background:rgba(255,255,255,0.08);}
  main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:24px 24px 60px;}
  .title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  h2.title{font-size:20px;margin:0;font-weight:800;}
  .btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-group button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-group button.active{background:var(--ember);border-color:var(--ember);color:#fff;}
  .period-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .period-row .lbl{font-size:12px;color:var(--muted);font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:11.5px;}
  thead th{background:var(--charcoal);color:#EFE5D6;padding:7px 6px;text-align:center;font-weight:700;white-space:nowrap;}
  thead th.name-col{text-align:left;padding-left:12px;position:sticky;left:0;z-index:3;background:var(--charcoal);}
  thead tr.cat-row th{font-size:10.5px;background:var(--charcoal-2);border-left:2px solid var(--charcoal);}
  tbody td{padding:6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td.name-col{text-align:left;padding-left:12px;font-weight:700;position:sticky;left:0;z-index:1;background:var(--card);box-shadow:2px 0 4px rgba(0,0,0,0.06);}
  tbody tr:hover{background:#FAF5EC;}
  tbody tr:hover td.name-col{background:#FAF5EC;}
  .aff-chip{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;border-radius:20px;background:var(--gray-bg);color:var(--muted);}
  .aff-chip.hall{background:#E4EEF1;color:#2F6B7A;}
  .aff-chip.kitchen{background:#F5E7DA;color:var(--ember-dark);}
  .aff-chip.both{background:var(--amber-bg);color:var(--amber);}
  .score-cell{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;border-radius:5px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 3px;}
  .score-cell.ready{background:var(--green-bg);color:var(--green);}
  .score-cell.mid{background:var(--training-bg);color:var(--training);}
  .score-cell.low{background:var(--gray-bg);color:var(--gray-ink);}
  .score-cell.perfect{background:var(--gold-bg);color:var(--gold);}
  .legend{display:flex;gap:14px;margin:12px 2px 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .staff-picker{max-width:360px;margin-bottom:14px;}
  label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
  select, textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:90px;}
  .meta-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--muted);}
  .meta-row strong{color:var(--ink);}

  /* 紙の評価票を模した表 */
  .paper-table-wrap{overflow-x:auto;border:1px solid var(--charcoal);border-radius:6px;}
  table.paper-table{border-collapse:collapse;width:100%;min-width:640px;}
  table.paper-table td{border:1px solid var(--line);padding:0;vertical-align:middle;}
  table.paper-table td.cat-col{
    width:110px;font-weight:800;font-size:12.5px;text-align:center;padding:10px 6px;
    border-right:2px solid var(--charcoal);writing-mode:horizontal-tb;
  }
  table.paper-table td.item-col{width:150px;font-weight:700;font-size:13px;padding:8px 12px;background:#fff;}
  table.paper-table td.opts-col{padding:6px 10px;background:#fff;}
  .cat-kitchen{background:var(--cat-kitchen);}
  .cat-hall{background:var(--cat-hall);}
  .cat-special{background:var(--cat-special);}
  .cat-shift{background:var(--cat-shift);}
  .cat-attitude{background:var(--cat-attitude);}
  .chip-group{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;}
  table.pcard-table{border-collapse:collapse;width:100%;min-width:640px;}
  table.pcard-table td, table.pcard-table th{border:1px solid var(--line);}
  table.pcard-table td{padding:8px 6px;text-align:center;vertical-align:middle;font-size:12.5px;background:#fff;}
  table.pcard-table td.cat-col{width:100px;font-weight:800;font-size:12.5px;text-align:center;padding:10px 6px;border-right:2px solid var(--charcoal);}
  table.pcard-table td.item-col{width:150px;text-align:left;padding:8px 12px;font-weight:700;white-space:nowrap;}
  table.pcard-table th{padding:9px 6px;text-align:center;background:var(--charcoal);color:#EFE5D6;font-size:12.5px;white-space:nowrap;}
  table.pcard-table th.item-col-head{text-align:left;padding-left:12px;}
  .pcard-score{display:inline-flex;align-items:center;justify-content:center;width:30px;height:30px;border-radius:50%;font-weight:800;font-size:13px;border:2px solid var(--line);color:var(--muted);}
  .pcard-score.ready{background:var(--green-bg);color:var(--green);border-color:var(--green);}
  .pcard-score.mid{background:var(--training-bg);color:var(--training);border-color:var(--training);}
  .pcard-score.low{background:var(--gray-bg);color:var(--gray-ink);border-color:var(--line);}
  .pcard-score.perfect{background:var(--gold-bg);color:var(--gold);border-color:var(--gold);}
  .chip-btn.selected{background:var(--ember);border-color:var(--ember);color:#fff;}

  button.primary{background:var(--ember);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;}
  button.primary:hover{background:var(--ember-dark);}
  .save-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .sync-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:11px;color:#C8BBA8;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#5EA36B;flex:none;}
  .sync-dot.off{background:#B23A2E;}

  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 26px),
      linear-gradient(135deg, var(--charcoal), var(--charcoal-2));
    padding:20px;
  }
  .login-card{
    background:var(--card);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .login-card h2{font-size:17px;margin:0 0 4px;font-weight:800;color:var(--ink);}
  .login-card p{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .login-card input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px;height:42px;box-sizing:border-box;}
  .login-card button{width:100%;margin-top:4px;}
  .login-error{color:#B23A2E;font-size:12.5px;margin-top:10px;min-height:16px;}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#EFE5D6;border-radius:20px;padding:3px 12px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;}
</style>
</head>
<body>
<div class="login-screen" id="login-screen">
  <div class="login-card">
    <h2>凱旋門 ATS評価システム</h2>
    <p>続けるにはログインが必要です</p>
    <input type="text" id="login-code" placeholder="社員CD" autocomplete="username">
    <input type="password" id="login-password" placeholder="パスワード" autocomplete="current-password">
    <button class="primary" id="login-btn">ログイン</button>
    <div class="login-error" id="login-error"></div>
  </div>
</div>
<div class="app" id="app" style="display:none;">
  <header>
    <div class="brand" style="justify-content:space-between;align-items:flex-start;">
      <h1>凱旋門 ATS評価システム</h1>
      <div style="display:flex;flex-direction:column;align-items:flex-end;gap:8px;">
        <div class="mode-toggle" id="mode-toggle">
          <button data-mode="pc">パソコン</button>
          <button data-mode="mobile">スマホ</button>
        </div>
        <div id="top-right-slot" style="display:flex;flex-direction:column;align-items:flex-end;gap:6px;flex:none;"></div>
      </div>
    </div>
    <div class="sync-row"><span class="sync-dot" id="sync-dot"></span><span id="sync-label">同期状態を確認中...</span></div>
    <nav id="tabs"></nav>
  </header>
  <main id="main"></main>
</div>
<div class="save-toast" id="toast">保存しました</div>

<script type="module">
import { initializeApp, deleteApp } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-app.js";
import { getDatabase, ref, set, get, onValue } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-database.js";
import { getAuth, signInWithEmailAndPassword, onAuthStateChanged, signOut, createUserWithEmailAndPassword, updatePassword } from "https://www.gstatic.com/firebasejs/10.12.2/firebase-auth.js";

/* ==============================================================
   会社用(赤門)本番接続。akamo-staff-management プロジェクトに接続。
   凱旋門店舗のホール運営システムとは別データ(ATS評価専用パス)を使う。
   ============================================================== */
const firebaseConfig = {
  apiKey: "AIzaSyDzUmUoZsTpV8PlTU-qRyDiByOImpOc_Kk",
  authDomain: "akamo-staff-management.firebaseapp.com",
  databaseURL: "https://akamo-staff-management-default-rtdb.asia-southeast1.firebasedatabase.app",
  projectId: "akamo-staff-management",
  storageBucket: "akamo-staff-management.firebasestorage.app",
  messagingSenderId: "249759074777",
  appId: "1:249759074777:web:4b9b5332d22dae182bf1c8"
};
const fbApp = initializeApp(firebaseConfig);
const db = getDatabase(fbApp);
/* ==============================================================
   店舗展開用の設定値。新しい店舗にこのファイルをコピーする時は、
   DEFAULT_STORE_ID をその店舗のIDに変更するだけでよい(他の行は触らない)。
   ここを変え忘れると、他店舗のデータと同じ場所に保存されてしまい、
   データが混ざる重大な事故につながるので、必ず店舗ごとに固有の値にすること。
   (?store=xxx というURLパラメータでも一時的に上書きできる。動作確認用)
   ============================================================== */
const DEFAULT_STORE_ID = "gaisenmon"; // ← 千葉NT店。他店舗にコピーする時はここだけ変更する
const STORE_ID = new URLSearchParams(window.location.search).get("store") || DEFAULT_STORE_ID;
const stateRef = ref(db, `stores/${STORE_ID}/ats/state`); // ホール運営システムの stores/${STORE_ID}/state とは別パス
const historyRef = ref(db, `stores/${STORE_ID}/ats/history`); // 変更履歴は増減が激しいので本体とは別パスに分離
const auth = getAuth(fbApp);
const LOGIN_DOMAIN = "gaisenmon.local";
function codeToEmail(code){ return `${code.trim()}@${LOGIN_DOMAIN}`; }

/* ============================== 評価項目マスタ ============================== */
const CATEGORIES = [
  { id:"kitchen",  label:"①キッチン",   items:[
    {name:"洗い場", max:4},{name:"サラキ", max:4},{name:"ファイヤー", max:4},{name:"バック", max:4},{name:"センター", max:4},
  ]},
  { id:"hall",     label:"②ホール",     items:[
    {name:"オンリー", max:4},{name:"ドリンカー", max:4},{name:"出し", max:4},{name:"ご案内・電話", max:4},{name:"レジ", max:4},
  ]},
  { id:"special",  label:"③特殊技能",   items:[
    {name:"夜集計", max:4},{name:"予約管理", max:5},{name:"従業員統率", max:5},{name:"肉カット", max:5, employTypeOnly:["社員"]},{name:"教育・評価", max:3},
  ]},
  { id:"shift",    label:"④シフト協力", items:[
    {name:"シフト作成", max:5, employTypeOnly:["社員"]},{name:"土日祝60%／月", max:1},{name:"イベント参加", max:1},{name:"不足協力", max:1},{name:"長期繁忙期70%", max:1},
  ]},
  { id:"attitude", label:"⑤勤務態度",   items:[
    {name:"遅刻・欠勤", max:1},{name:"シフト提出", max:1},{name:"服務規律", max:1},{name:"姿勢のルール", max:1},{name:"行事参加", max:1},
  ]},
];
const ALL_ITEMS = CATEGORIES.flatMap(c => c.items.map(it => ({...it, categoryId:c.id})));
const PERIODS = ["4月","7月","10月","1月"]; // 店長印のタイミング(年4回)に合わせた評価時期
function starAt(max){ return Math.min(3, max); }
function scoreClass(value, max){
  if(max > 0 && value === max) return "perfect";
  const th = starAt(max);
  if(value >= th) return "ready";
  if(value >= 1) return "mid";
  return "low";
}
const EVALUATOR_SEED_NAMES = ["青木","井上","熊本","寺澤","木内","篠原","和田"]; // 移行専用(既存データのisEvaluator初期値判定に使用)
function starCount(scores){
  return ALL_ITEMS.filter(it => (scores[it.name] ?? 0) >= starAt(it.max)).length;
}
function totalScore(periodData){
  return starCount(periodData.scores) + (periodData.bonus ?? 0);
}
function formatTotal(periodData){
  return periodData.exempt ? "対象外" : String(totalScore(periodData));
}
function emptyScores(){
  const s = {};
  ALL_ITEMS.forEach(it => { s[it.name] = 0; });
  return s;
}
function emptyPeriods(){
  const p = {};
  PERIODS.forEach(period => { p[period] = { scores: emptyScores(), comment:"", evaluator:"", bonus:0, confirmed:false, exempt:false }; });
  return p;
}

/* ============================== スタッフマスタ(凱旋門ATS評価.xlsxより抽出) ============================== */
const STAFF_SEED = [
  {id:"1", code:"28211", name:"下條 俊平", employType:"社員", affiliation:"両方", hireDate:"2017-10-16"},
  {id:"2", code:"100672", name:"青木 俊樹", employType:"社員", affiliation:"両方", hireDate:"2014-04-01"},

  {id:"9", code:"210062", name:"佐藤 愛恵", employType:"パート", affiliation:"キッチン", hireDate:"2022-08-10"},
  {id:"10", code:"210084", name:"中村 心咲", employType:"アルバイト", affiliation:"ホール", hireDate:"2023-06-09"},
  {id:"11", code:"210089", name:"齋藤 真美", employType:"パート", affiliation:"キッチン", hireDate:"2023-06-25"},
  {id:"12", code:"210103", name:"熊本 美羽", employType:"アルバイト", affiliation:"両方", hireDate:"2023-11-11"},
  {id:"13", code:"210105", name:"縫田 桜", employType:"アルバイト", affiliation:"ホール", hireDate:"2023-11-11"},
  {id:"14", code:"210106", name:"寺澤 一花", employType:"アルバイト", affiliation:"キッチン", hireDate:"2023-11-11"},
  {id:"15", code:"210107", name:"木内 健太", employType:"アルバイト", affiliation:"ホール", hireDate:"2023-11-30"},
  {id:"16", code:"210112", name:"平川 幸太桜", employType:"アルバイト", affiliation:"ホール", hireDate:"2024-02-19"},

function computeTenureText(hireDateStr){
  if(!hireDateStr) return "-";
  const hire = new Date(hireDateStr);
  const now = new Date();
  let years = now.getFullYear() - hire.getFullYear();
  let months = now.getMonth() - hire.getMonth();
  if(now.getDate() < hire.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  if(years < 0) return "-";
  return `${years}年${months}ヶ月`;
}
function computeTenureMonths(hireDateStr){
  if(!hireDateStr) return null;
  const hire = new Date(hireDateStr);
  const now = new Date();
  if(isNaN(hire.getTime())) return null;
  let months = (now.getFullYear()-hire.getFullYear())*12 + (now.getMonth()-hire.getMonth());
  if(now.getDate() < hire.getDate()) months -= 1;
  return months < 0 ? null : months;
}

/* 本体(staff/years)側の移行処理。履歴は別パスになったのでここでは扱わない。 */
function migrateCoreState(s){
  if(!Array.isArray(s.staff)) s.staff = [];
  if(!s.years || s.years.length===0) s.years = [INITIAL_YEAR];
  s.staff.forEach(st=>{
    if(!st.status){ st.status = st.active===false ? "resigned" : "active"; }
    if(st.isEvaluator === undefined){ st.isEvaluator = EVALUATOR_SEED_NAMES.includes(st.name); }
    if(st.isEvaluatee === undefined){ st.isEvaluatee = true; } // 被評価者かどうか。デフォルトは全員対象
    if(st.hasLogin === undefined){ st.hasLogin = false; }
    if(st.yearData){
      Object.values(st.yearData).forEach(yd=>{
        Object.values(yd).forEach(pd=>{ if(pd.exempt === undefined) pd.exempt = false; });
      });
    }
  });
  return s;
}
function defaultCoreState(){ return { staff: seedStaff(), years: [INITIAL_YEAR], updatedAt: null }; }

/* 直近にサーバーから受け取った状態(=自分がまだ書き込んでいない基準点)。
   これと今の手元の state を比べることで「自分が実際に何を触ったか」を判定する。 */
let lastServerCore = null;   // {staff, years} の基準点
let lastServerHistory = null; // history配列の基準点

/* 保存直前にサーバーの最新データを取り直し、自分が実際に触った部分(スタッフ・年度)だけを
   その最新データに重ねてから書き込む。
   理由:「編集中は他人の更新を取り込まない」ガードのせいで、長時間編集している間に
   他の人が保存した内容を、自分の保存時にまるごと上書きして消してしまう事故があったため。 */
function mergeStateForSave(latest, local, base){
  const merged = {...latest};
  const baseStaffMap = new Map((base?.staff||[]).map(s=>[s.id, s]));
  const localStaffMap = new Map((local.staff||[]).map(s=>[s.id, s]));
  const mergedStaffMap = new Map((latest.staff||[]).map(s=>[s.id, s])); // 基本は最新データを採用
  localStaffMap.forEach((localSt, id)=>{
    const baseSt = baseStaffMap.get(id);
    const changed = !baseSt || JSON.stringify(baseSt) !== JSON.stringify(localSt);
    if(changed || !mergedStaffMap.has(id)){
      mergedStaffMap.set(id, localSt); // 自分が実際に触った(=基準点から変化した)人だけ、自分の値を優先
    }
  });
  merged.staff = Array.from(mergedStaffMap.values());
  // 年度は増える一方の情報なので、両方を合わせる
  merged.years = Array.from(new Set([...(latest.years||[]), ...(local.years||[])])).sort();
  return merged;
}
/* 変更履歴は「追加」と「削除」だけのログなので、id単位の3-wayマージで正しく合成できる。
   自分が追加した分は足す、自分が削除した分は(他人がまだ持っていても)消す、
   それ以外(他人が追加/削除した分)は最新データをそのまま尊重する。 */
function mergeHistoryForSave(latest, local, base){
  const baseIds = new Set((base||[]).map(h=>h.id));
  const localIds = new Set((local||[]).map(h=>h.id));
  const addedLocally = (local||[]).filter(h=>!baseIds.has(h.id));
  const deletedLocally = new Set((base||[]).filter(h=>!localIds.has(h.id)).map(h=>h.id));
  const merged = (latest||[]).filter(h=>!deletedLocally.has(h.id));
  const mergedIds = new Set(merged.map(h=>h.id));
  addedLocally.forEach(h=>{ if(!mergedIds.has(h.id)){ merged.push(h); mergedIds.add(h.id); } });
  merged.sort((a,b)=> (b.ts||"").localeCompare(a.ts||"")); // 新しい順
  return merged;
}
async function saveState(){
  // ---- 本体(staff/years) ----
  try{
    const snap = await get(stateRef);
    const latestRaw = snap.val();
    if(latestRaw){
      const merged = mergeStateForSave(migrateCoreState(latestRaw), {staff:state.staff, years:state.years}, lastServerCore);
      state.staff = merged.staff;
      state.years = merged.years;
    }
  }catch(e){
    console.error("保存前の再取得に失敗。手元のデータでそのまま保存します", e);
  }
  state.updatedAt = new Date().toISOString();
  try{
    await set(stateRef, { staff: state.staff, years: state.years, updatedAt: state.updatedAt });
    lastServerCore = JSON.parse(JSON.stringify({staff: state.staff, years: state.years}));
  }catch(e){
    console.error("save failed", e);
    showToast("保存に失敗しました");
    return;
  }

  // ---- 変更履歴(別パス。頻繁に増減するので本体と分けて保存している) ----
  const historyChangedLocally = JSON.stringify(lastServerHistory||[]) !== JSON.stringify(state.history||[]);
  if(historyChangedLocally){
    try{
      const histSnap = await get(historyRef);
      const latestHistory = Array.isArray(histSnap.val()) ? histSnap.val() : [];
      state.history = mergeHistoryForSave(latestHistory, state.history, lastServerHistory);
      await set(historyRef, state.history);
      lastServerHistory = JSON.parse(JSON.stringify(state.history));
    }catch(e){
      console.error("history save failed", e);
    }
  }
  showToast("保存しました(全員に共有されます)");
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg || "保存しました";
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}

async function createLoginAccount(code, password){
  const tempApp = initializeApp(firebaseConfig, "temp-"+Date.now());

function diffAndLog(staffObj, year, period, before, after){
  const entries = [];
  ALL_ITEMS.forEach(it=>{
    const ov = before.scores[it.name] ?? 0, nv = after.scores[it.name] ?? 0;
    if(ov !== nv) entries.push({field: it.name, oldValue: String(ov), newValue: String(nv)});
  });
  if((before.bonus ?? 0) !== (after.bonus ?? 0)) entries.push({field:"加点", oldValue:String(before.bonus ?? 0), newValue:String(after.bonus ?? 0)});
  if((before.evaluator || "") !== (after.evaluator || "")) entries.push({field:"評価者", oldValue: before.evaluator || "(未選択)", newValue: after.evaluator || "(未選択)"});
  if((before.comment || "") !== (after.comment || "")) entries.push({field:"コメント", oldValue:"(変更前あり)", newValue:"(変更後あり)"});
  if(!!before.confirmed !== !!after.confirmed) entries.push({field:"ステータス", oldValue: before.confirmed ? "確定" : "編集中", newValue: after.confirmed ? "確定" : "編集中"});
  if(!!before.exempt !== !!after.exempt) entries.push({field:"評価対象外", oldValue: before.exempt ? "対象外" : "対象内", newValue: after.exempt ? "対象外" : "対象内"});
  if(entries.length===0) return;
  const ts = new Date().toISOString();
  entries.forEach(e=>{
    state.history.unshift({
      id: "h"+Date.now()+Math.random().toString(36).slice(2,6),
      ts, user: currentPersonName || `(不明:${getLoginCode()})`, staffName: staffObj.name, year, period,
      field: e.field, oldValue: e.oldValue, newValue: e.newValue,
    });
  });
}

/* 「4月・7月・10月・1月」のうち、今日時点で直近に経過している時期と、
   それが属する年度をあわせて判定する。1〜3月は前年度の1月分として扱う。
   (例:2026年9月なら → 2026年度・7月。2027年2月なら → 2026年度・1月) */
function computeCurrentPeriodDefault(){
  const now = new Date();
  const month = now.getMonth() + 1; // 1-12
  const calYear = now.getFullYear();
  let period, fiscalYear;
  if(month>=4 && month<=6){ period="4月"; fiscalYear=calYear; }
  else if(month>=7 && month<=9){ period="7月"; fiscalYear=calYear; }
  else if(month>=10 && month<=12){ period="10月"; fiscalYear=calYear; }
  else { period="1月"; fiscalYear=calYear-1; }
  return { period, fiscalYear: String(fiscalYear) };
}
let defaultsApplied = false;
function applyDefaultYearAndPeriod(){
  if(defaultsApplied) return;
  defaultsApplied = true;
  const { period, fiscalYear } = computeCurrentPeriodDefault();
  selectedYear = state.years.includes(fiscalYear) ? fiscalYear : state.years[state.years.length-1];
  dashboardPeriod = period;
  entrySelectedPeriod = period;
  personalChartPeriod = period;
  nineboxPeriod = period;
}

/* ---------- CSVエクスポート共通ヘルパー ---------- */
function csvEscape(v){
  const s = String(v ?? "");
  if(/[",\n]/.test(s)) return `"${s.replace(/"/g,'""')}"`;
  return s;
}
function downloadCSV(filename, rows){
  const csv = rows.map(row => row.map(csvEscape).join(",")).join("\r\n");
  const blob = new Blob(["\uFEFF" + csv], {type:"text/csv;charset=utf-8;"}); // BOM付きでExcelの文字化けを防ぐ
  const url = URL.createObjectURL(blob);
  const a = document.createElement("a");
  a.href = url;
  a.download = filename;
  document.body.appendChild(a);
  a.click();
  document.body.removeChild(a);
  setTimeout(()=> URL.revokeObjectURL(url), 1000);
}

function affiliationMatches(aff, filter){
  if(filter==="all") return true;
  if(filter==="hall") return aff==="ホール" || aff==="両方";
  if(filter==="kitchen") return aff==="キッチン" || aff==="両方";
  return true;
}

/* ============================== ATS評価-個人(紙の評価票と同じ形で、4期間を横並びに表示。閲覧専用) ============================== */
/* ---------- 個人タブ用:カテゴリ別達成率・店舗平均・SVGチャート ---------- */
function categoryPct(scores, cat){
  const vals = cat.items.map(it => (scores[it.name] ?? 0) / it.max);
  return Math.round((vals.reduce((a,b)=>a+b,0) / vals.length) * 100);
}
function storeCategoryAvgPct(year, period, cat){
  const activeStaff = state.staff.filter(s=>s.isEvaluatee && s.status==="active" && s.yearData[year]);
  if(activeStaff.length===0) return 0;
  const sum = activeStaff.reduce((acc,s)=> acc + categoryPct(s.yearData[year][period].scores, cat), 0);
  return Math.round(sum / activeStaff.length);
}
const OPERATION_ITEMS = CATEGORIES.slice(0,3).flatMap(c=>c.items.map(it=>({...it, categoryId:c.id}))); // ①キッチン②ホール③特殊技能=15項目
/* ホール項目はホール+両方の人だけ、キッチン項目はキッチン+両方の人だけで平均を取る。
   ③特殊技能はホール/キッチン専属どちらにも該当し得る項目のため絞り込まない。 */
function affiliationMatchesItem(staffAffiliation, categoryId){
  if(categoryId === "hall") return staffAffiliation === "ホール" || staffAffiliation === "両方";
  if(categoryId === "kitchen") return staffAffiliation === "キッチン" || staffAffiliation === "両方";
  return true;
}
/* 所属に加えて、項目側の「社員専用」等の指定(employTypeOnly)も考慮する。
   肉カット・シフト作成のように、原則社員の仕事であってアルバイト・パートには
   そもそも割り当てられない項目を、達成率や★保持者数の計算から正しく除外するため。 */
function itemAppliesToStaff(item, staffObj){
  if(item.employTypeOnly && !item.employTypeOnly.includes(staffObj.employType)) return false;
  return affiliationMatchesItem(staffObj.affiliation, item.categoryId);
}
function storeItemAvgPct(year, period, item){
  const relevantStaff = state.staff.filter(s=>
    s.isEvaluatee && s.status==="active" && s.yearData[year] && itemAppliesToStaff(item, s)
  );
  if(relevantStaff.length===0) return 0;
  const sum = relevantStaff.reduce((acc,s)=> acc + ((s.yearData[year][period].scores[item.name] ?? 0) / item.max * 100), 0);
  return Math.round(sum / relevantStaff.length);
}
function storeAverageTotal(year, period){
  const activeStaff = state.staff.filter(s=>s.isEvaluatee && s.status==="active" && s.yearData[year]);
  if(activeStaff.length===0) return 0;
  const sum = activeStaff.reduce((acc,s)=> acc + totalScore(s.yearData[year][period]), 0);
  return Math.round((sum / activeStaff.length) * 10) / 10;
}

/* ============================== データ分析(勤続 × 達成率の散布図) ============================== */
/* その人の所属に関係する項目(①②③のオペレーション15項目)だけで達成率%を出す */
function personalAchievementPct(staffObj, scores){
  const relevant = OPERATION_ITEMS.filter(it => itemAppliesToStaff(it, staffObj));
  if(relevant.length===0) return 0;
  const sum = relevant.reduce((acc,it)=> acc + (scores[it.name] ?? 0)/it.max, 0);
  return Math.round((sum/relevant.length)*1000)/10; // 小数第1位まで
}
/* 勤続(横軸) × 達成率(縦軸)の散布図。バケツ分け・伸び率の判定は行わず、点をそのままプロットする。 */
function buildScatterSVG(points){
  const width=680, height=440, pad={top:16, right:24, bottom:54, left:60};
  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const maxMonths = Math.max(24, ...points.map(p=>p.months), 1);
  const xFor = m => pad.left + (m/maxMonths)*plotW;
  const yFor = pct => pad.top + plotH - (Math.max(0,Math.min(100,pct))/100)*plotH;
  const yGrid = [0,25,50,75,100].map(v=>{
    const yy = yFor(v);
    return `<line x1="${pad.left}" y1="${yy}" x2="${width-pad.right}" y2="${yy}" stroke="#E7DFD2" stroke-width="1"/><text x="${pad.left-8}" y="${yy+3}" font-size="9" fill="#8A7F72" text-anchor="end">${v}%</text>`;
  }).join("");
  const maxYears = Math.ceil(maxMonths/12);
  const xGrid = [];
  for(let yrs=0; yrs<=maxYears; yrs++){
    const xx = xFor(yrs*12);
    if(xx > width-pad.right+1) continue;
    xGrid.push(`<line x1="${xx}" y1="${pad.top}" x2="${xx}" y2="${height-pad.bottom}" stroke="#F1EBDF" stroke-width="1"/><text x="${xx}" y="${height-pad.bottom+16}" font-size="9" fill="#8A7F72" text-anchor="middle">${yrs}年</text>`);
  }
  const axisLines = `
    <line x1="${pad.left}" y1="${pad.top}" x2="${pad.left}" y2="${height-pad.bottom}" stroke="#8A7F72" stroke-width="1.5"/>
    <line x1="${pad.left}" y1="${height-pad.bottom}" x2="${width-pad.right}" y2="${height-pad.bottom}" stroke="#8A7F72" stroke-width="1.5"/>
  `;
  const axisTitles = `
    <text x="${pad.left + plotW/2}" y="${height-8}" font-size="11.5" font-weight="700" fill="#2B2420" text-anchor="middle">勤続年数</text>
    <text x="16" y="${pad.top + plotH/2}" font-size="11.5" font-weight="700" fill="#2B2420" text-anchor="middle" transform="rotate(-90 16 ${pad.top + plotH/2})">オペレーション15項目達成率</text>
  `;
  const dots = points.map(p=>{
    const px = xFor(p.months), py = yFor(p.pct);
    return `<g>
      <circle cx="${px}" cy="${py}" r="5" fill="#C1531B" fill-opacity="0.78" stroke="#9C4013" stroke-width="1">
        <title>${p.label}:勤続${(p.months/12).toFixed(1)}年 ・ 達成率${p.pct}%</title>
      </circle>
      <text x="${px+7}" y="${py+3}" font-size="9" fill="#2B2420">${p.label}</text>
    </g>`;
  }).join("");
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:720px;display:block;">
    ${axisTitles}${yGrid}${xGrid.join("")}${axisLines}${dots}
  </svg>`;
}

function buildLineChartSVG(labels, seriesIndividual, seriesAvg, maxVal){
  const width=520, height=200, pad={top:16,right:16,bottom:26,left:30};
  const plotW = width-pad.left-pad.right, plotH = height-pad.top-pad.bottom;
  const n = labels.length;
  const xFor = i => pad.left + (n<=1?0:(plotW*i/(n-1)));
  const yFor = v => pad.top + plotH - (plotH * Math.max(0,Math.min(maxVal,v))/Math.max(1,maxVal));
  const grid = [0,0.5,1].map(f=>{
    const y = pad.top + plotH*(1-f);
    const val = Math.round(maxVal*f);
    return `<line x1="${pad.left}" y1="${y}" x2="${width-pad.right}" y2="${y}" stroke="#E7DFD2" stroke-width="1"/><text x="${pad.left-6}" y="${y+3}" font-size="9" fill="#8A7F72" text-anchor="end">${val}</text>`;
  }).join("");
  const xLabels = labels.map((l,i)=>`<text x="${xFor(i)}" y="${height-8}" font-size="10" fill="#2B2420" text-anchor="middle">${l}</text>`).join("");
  const pathFor = series => series.map((v,i)=> `${i===0?"M":"L"} ${xFor(i)} ${yFor(v)}`).join(" ");
  const dotsFor = (series,color) => series.map((v,i)=> `<circle cx="${xFor(i)}" cy="${yFor(v)}" r="3.5" fill="${color}"/>`).join("");
  const avgPart = seriesAvg ? `<path d="${pathFor(seriesAvg)}" fill="none" stroke="#8A7F72" stroke-width="2" stroke-dasharray="4,3"/>${dotsFor(seriesAvg,"#8A7F72")}` : "";
  const indPart = `<path d="${pathFor(seriesIndividual)}" fill="none" stroke="#C1531B" stroke-width="2.5"/>${dotsFor(seriesIndividual,"#C1531B")}`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:520px;display:block;">${grid}${xLabels}${avgPart}${indPart}</svg>`;
}
function buildPersonalRadarSVG(labels, individualPct, avgPct){
  const width=460, height=400, center={x:width/2, y:height/2}, radius=130;
  const n = labels.length;
  const angleStep = (2*Math.PI)/n;
  const pointFor = (val,i) => {
    const r = radius*(Math.max(0,Math.min(100,val))/100);
    const angle = -Math.PI/2 + i*angleStep;
    return [center.x + r*Math.cos(angle), center.y + r*Math.sin(angle)];
  };
  const polyStr = pts => pts.map(p=>p.join(",")).join(" ");
  const rings = [20,40,60,80,100].map(level=>{
    const pts = labels.map((_,i)=> pointFor(level,i));
    return `<polygon points="${polyStr(pts)}" fill="none" stroke="#E7DFD2" stroke-width="1"/>`;
  }).join("");
  const axisLines = labels.map((_,i)=>{
    const [x,y] = pointFor(100,i);
    return `<line x1="${center.x}" y1="${center.y}" x2="${x}" y2="${y}" stroke="#E7DFD2" stroke-width="1"/>`;
  }).join("");
  const textLabels = labels.map((lb,i)=>{
    const angle = -Math.PI/2 + i*angleStep;
    const lx = center.x + (radius+20)*Math.cos(angle);
    const ly = center.y + (radius+20)*Math.sin(angle);
    let anchor = "middle";
    if(Math.cos(angle) > 0.15) anchor = "start";
    else if(Math.cos(angle) < -0.15) anchor = "end";
    return `<text x="${lx}" y="${ly}" font-size="9.5" font-weight="700" fill="#2B2420" text-anchor="${anchor}" dominant-baseline="middle">${lb}</text>`;
  }).join("");
  const avgPts = labels.map((_,i)=> pointFor(avgPct[i],i));
  const indPts = labels.map((_,i)=> pointFor(individualPct[i],i));
  const avgPoly = `<polygon points="${polyStr(avgPts)}" fill="none" stroke="#8A7F72" stroke-width="2" stroke-dasharray="4,3"/>`;
  const indPoly = `<polygon points="${polyStr(indPts)}" fill="#C1531B" fill-opacity="0.22" stroke="#C1531B" stroke-width="2.5"/>`;
  return `<svg viewBox="0 0 ${width} ${height}" width="100%" style="max-width:460px;display:block;margin:0 auto;">${rings}${axisLines}${avgPoly}${indPoly}${textLabels}</svg>`;
}

/* その項目に関係する所属の在籍・被評価者のうち、★基準を満たしている人を返す(単一障害点検出用) */
/* その項目に関係する所属・雇用区分の在籍・被評価者のうち、★基準を満たしている人を返す(単一障害点検出用)。
   対象母数(relevantCount)も一緒に返す:保持者数だけでなく「対象が何人中何人か」を見るため。 */
function itemStarHolders(item, year, period){
  const relevantStaff = state.staff.filter(s=>
    s.isEvaluatee && s.status==="active" && itemAppliesToStaff(item, s)
  );
  const holders = [];
  relevantStaff.forEach(s=>{
    const yd = s.yearData[year];
    const pd = yd ? yd[period] : null;
    if(!pd || pd.exempt) return;
    const v = pd.scores[item.name] ?? 0;
    if(v >= starAt(item.max)) holders.push({staff:s, score:v, isPerfect: v>=item.max});
  });
  return { holders, relevantCount: relevantStaff.length };
}
/* ページ上部の全て/ホール/キッチンの絞り込みを、項目の表示可否として流用する */
function itemVisibleForFilter(item, filter){
  if(filter==="hall") return item.categoryId !== "kitchen";
  if(filter==="kitchen") return item.categoryId !== "hall";
  return true;
}
/* 分析モジュールの登録リスト。今後、新しい分析を増やす時はここに1つ追加するだけでよい。
   各モジュールは render() が中身のDOMノードを1つ返す、という形で自己完結させている。 */
const ANALYSIS_MODULES = [
  {
    id: "tenureScatter",
    label: "勤続 × 達成率 散布図",
    render(){
      const targets = state.staff.filter(s=> s.isEvaluatee && s.status==="active" && affiliationMatches(s.affiliation, nineboxFilter));
      const plotted = [];
      const unclassified = [];
      targets.forEach(st=>{
        const yd = st.yearData[selectedYear];
        const pd = yd ? yd[nineboxPeriod] : null;
        if(!pd){ unclassified.push({staff:st, reason:"データなし"}); return; }
        if(pd.exempt){ unclassified.push({staff:st, reason:"評価対象外"}); return; }
        const months = computeTenureMonths(st.hireDate);
        if(months === null){ unclassified.push({staff:st, reason:"入社日未登録"}); return; }
        const pct = personalAchievementPct(st, pd.scores);
        plotted.push({staff:st, months, pct});
      });

      const container = document.createElement("div");
      if(plotted.length === 0){
        container.innerHTML = `<div class="empty">プロットできるデータがありません</div>`;
      } else {
        const svgWrap = document.createElement("div");
        svgWrap.innerHTML = buildScatterSVG(plotted.map(p=>({months:p.months, pct:p.pct, label:p.staff.name})));
        container.appendChild(svgWrap);
      }
      if(unclassified.length > 0){
        const uWrap = document.createElement("div");
        uWrap.style.cssText = "margin-top:16px;padding-top:14px;border-top:1px solid var(--line);";
        uWrap.innerHTML = `<div style="font-weight:800;font-size:12.5px;margin-bottom:8px;">プロット対象外(${unclassified.length}名)</div>`;
        const list = document.createElement("div");
        list.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;";
        unclassified.forEach(u=>{
          const chip = document.createElement("span");
          chip.style.cssText = "font-size:12px;padding:4px 10px;border-radius:20px;background:var(--gray-bg);color:var(--gray-ink);";
          chip.textContent = `${u.staff.name}(${u.reason})`;
          list.appendChild(chip);
        });
        uWrap.appendChild(list);
        container.appendChild(uWrap);
      }
      return container;
    }
  },
  {
    id: "busFactor",
    label: "⭐️保持者数",
    render(){
      const container = document.createElement("div");

      const rows = OPERATION_ITEMS
        .filter(it => itemVisibleForFilter(it, nineboxFilter))
        .map(it => {
          const { holders, relevantCount } = itemStarHolders(it, selectedYear, nineboxPeriod);
          return { item: it, holders, relevantCount };
        })
        .filter(r => r.relevantCount > 0)
        .sort((a,b)=> (a.holders.length/a.relevantCount) - (b.holders.length/b.relevantCount));

      if(rows.length === 0){
        container.innerHTML += `<div class="empty">対象データがありません</div>`;
        return container;
      }
      rows.forEach(r=>{
        const catLabel = CATEGORIES.find(c=>c.id===r.item.categoryId)?.label ?? "";
        const pct = Math.round((r.holders.length / r.relevantCount) * 100);
        const isZero = r.holders.length === 0;
        const row = document.createElement("div");
        row.style.cssText = "display:flex;justify-content:space-between;align-items:flex-start;gap:12px;padding:10px 4px;border-bottom:1px solid var(--line);";
        const left = document.createElement("div");
        const namesHTML = r.holders.map(h=>
          h.isPerfect
            ? `<span style="color:var(--gold);font-weight:800;">${h.staff.name}</span>`
            : `<span>${h.staff.name}</span>`
        ).join("、");
        left.innerHTML = `<div style="font-weight:800;font-size:13.5px;">${r.item.name} <span style="font-size:11px;color:var(--muted);font-weight:400;">(${catLabel})</span></div>` +
          (r.holders.length>0 ? `<div style="font-size:12px;color:var(--muted);margin-top:3px;">できる人:${namesHTML}</div>` : "");
        row.appendChild(left);
        const badge = document.createElement("span");
        badge.style.cssText = isZero
          ? "flex:none;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;background:#FBE4E1;color:#B23A2E;white-space:nowrap;"
          : "flex:none;font-size:11.5px;font-weight:800;padding:3px 10px;border-radius:20px;background:var(--gray-bg);color:var(--gray-ink);white-space:nowrap;";
        badge.textContent = isZero ? `該当者なし(対象${r.relevantCount}人)` : `${r.holders.length}人 / 対象${r.relevantCount}人(${pct}%)`;
        row.appendChild(badge);
        container.appendChild(row);
      });
      return container;
    }
  },
];

  const exAddSelect = document.createElement("select");
  exAddSelect.style.maxWidth = "260px";
  const exCandidates = state.staff.filter(s=>s.isEvaluatee && s.status==="active");
  exAddSelect.innerHTML = exCandidates.length
    ? exCandidates.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")
    : `<option value="">(対象にできる在籍スタッフがいません)</option>`;
  exAddRow.appendChild(exAddSelect);
  const exAddBtn = document.createElement("button");
  exAddBtn.className = "ghost small";
  exAddBtn.textContent = "被評価者から除外する";
  exAddBtn.style.cssText = "background:transparent;color:var(--ember-dark);border:1px solid var(--ember);border-radius:8px;padding:8px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;";
  exAddBtn.onclick = ()=>{
    const target = state.staff.find(s=>s.id===exAddSelect.value);
    if(!target) return;
    target.isEvaluatee = false;
    saveState();
    render();
  };
  exAddRow.appendChild(exAddBtn);
  exCard.appendChild(exAddRow);
  wrap.appendChild(exCard);

  return wrap;
}

/* ============================== 変更履歴 ============================== */
function trashIconSVG(){
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`;
}
function renderHistory(){
  const wrap = document.createElement("div");
  const titleRow = document.createElement("div");
  titleRow.className = "title-row";
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "変更履歴";
  titleRow.appendChild(h);

  if(state.history && state.history.length > 0){
    const actions = document.createElement("div");
    actions.style.cssText = "display:flex;gap:8px;";
    const delAllBtn = document.createElement("button");
    delAllBtn.textContent = "すべて削除";
    delAllBtn.style.cssText = "background:#fff;border:1px solid #B23A2E;color:#B23A2E;border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;";
    delAllBtn.onclick = ()=>{
      showModal("変更履歴をすべて削除しますか?この操作は取り消せません。", ()=>{
        state.history = [];
        saveState();
        render();
      }, {confirmLabel:"すべて削除する"});
    };
    actions.appendChild(delAllBtn);
    titleRow.appendChild(actions);
  }
  wrap.appendChild(titleRow);

  const card = document.createElement("div");
  card.className = "card";

  if(!state.history || state.history.length===0){
    card.innerHTML = `<div style="color:var(--muted);font-size:13.5px;padding:20px 4px;text-align:center;">まだ変更履歴はありません。評価入力タブで保存・確定・編集を行うと、ここに記録されます。</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  const table = document.createElement("table");
  table.innerHTML = `
    <thead><tr>
      <th>日時</th><th>操作者</th><th class="name-col">スタッフ</th><th>年度</th><th>評価時期</th><th>項目</th><th>変更前</th><th></th><th>変更後</th><th style="width:36px;"></th>
    </tr></thead>
  `;
  const tbody = document.createElement("tbody");
  state.history.slice(0, 300).forEach(en=>{
    const tr = document.createElement("tr");
    const dt = new Date(en.ts).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});

    const cells = [
      {text: dt, style:"color:var(--muted);font-size:11px;"},
      {text: en.user, style:""},
      {text: en.staffName, className:"name-col", style:""},
      {text: en.year || "-", style:""},
      {text: en.period, style:""},
      {text: en.field, style:"font-weight:700;"},
      {text: en.oldValue, style:""},
      {text: "→", style:"color:var(--muted);"},
      {text: en.newValue, style:"font-weight:800;color:var(--ember-dark);"},
    ];
    cells.forEach(c=>{
      const td = document.createElement("td");
      if(c.className) td.className = c.className;
      td.style.cssText = c.style;
      td.textContent = c.text;
      tr.appendChild(td);
    });

    const delTd = document.createElement("td");
    const delBtn = document.createElement("button");
    delBtn.innerHTML = trashIconSVG();
    delBtn.title = "この履歴を削除";
    delBtn.style.cssText = "background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;";
    delBtn.onclick = ()=>{
      showModal("この変更履歴を削除しますか?", ()=>{
        state.history = state.history.filter(x => x.id !== en.id);
        saveState();
        render();
      }, {confirmLabel:"削除する"});
    };
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);
  if(state.history.length > 300){
    const note = document.createElement("div");
    note.style.cssText = "margin-top:10px;font-size:12px;color:var(--muted);";
    note.textContent = `直近300件を表示しています(全${state.history.length}件)。`;
    card.appendChild(note);
  }
  wrap.appendChild(card);
  return wrap;
}

/* ============================== 起動(ログイン後にリアルタイム購読を開始) ============================== */
let appStarted = false;
/* 変更履歴を本体から独立させる前の旧データには、state側に history が同居している可能性がある。
   新しい保存先(historyRef)がまだ空で、旧データ側に履歴が残っている場合だけ、一度だけ移す。 */
async function migrateLegacyHistoryIfNeeded(){
  try{
    const [stateSnap, histSnap] = await Promise.all([get(stateRef), get(historyRef)]);
    const legacyHistory = stateSnap.val()?.history;
    const currentHistory = histSnap.val();
    if(Array.isArray(legacyHistory) && legacyHistory.length>0 && (!Array.isArray(currentHistory) || currentHistory.length===0)){
      await set(historyRef, legacyHistory);
    }
  }catch(e){
    console.error("履歴の移行チェックに失敗", e);
  }
}

function startApp(){
  if(appStarted) return;
  appStarted = true;
  document.getElementById("main").innerHTML = `<div style="padding:30px;color:var(--muted);">読み込み中...</div>`;

  // フォーム内の入力欄にフォーカスがある間は「編集中」とみなし、
  // 他の人の保存によるリアルタイム再描画で入力中の内容を消さないようにする。
  // 解除は行わず(true にするだけ)、実際に解除するのは保存・確定・タブ切り替えなど
  // 各操作ハンドラ側の editingForm=false に任せる。
  // 理由: 点数ボタン(button要素)を押すと画面全体を再描画するため、フォーカスが外れて
  // focusout が発火してしまい、ここで自動的にfalseへ戻すと「編集中」判定が
  // ボタンを押すたびに解除されてしまう(=同時編集ガードが機能しなくなる)バグがあった。
  const mainEl = document.getElementById("main");
  mainEl.addEventListener("focusin", (e)=>{
    if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) editingForm = true;
  });

  // Firebaseの接続状態そのものを監視
  onValue(ref(db, ".info/connected"), (snap)=>{
    setSyncStatus(snap.val() === true);
  });

  state = { staff: [], years: [INITIAL_YEAR], history: [], updatedAt: null };
  function tryFirstRender(){
    if(stateLoaded && historyLoaded && !firstLoadDone){
      firstLoadDone = true;
      currentPersonName = resolveCurrentPersonName();
      render();
    }
  }

  // データ本体(staff/years)をリアルタイム購読。誰かが保存すると全員の画面に自動反映される
  onValue(stateRef, async (snapshot)=>{
    const val = snapshot.val();
    if(val === null){
      if(!stateLoaded){
        const seed = defaultCoreState();
        state.staff = seed.staff;
        state.years = seed.years;
        lastServerCore = JSON.parse(JSON.stringify({staff:state.staff, years:state.years}));
        stateLoaded = true;
        tryFirstRender();
        saveState();
      }
      return;
    }
    if(editingForm && firstLoadDone){
      return; // 編集中は他人の更新の取り込みを見送る(自分の未保存の変更を守る)
    }
    const migrated = migrateCoreState(val);
    state.staff = migrated.staff;
    state.years = migrated.years;
    state.updatedAt = migrated.updatedAt;
    lastServerCore = JSON.parse(JSON.stringify({staff: state.staff, years: state.years})); // 保存時の差分判定の基準点を更新
    stateLoaded = true;
    currentPersonName = resolveCurrentPersonName();
    if(firstLoadDone) render(); else tryFirstRender();
  });

  // 変更履歴を別パスでリアルタイム購読(本体とは独立して増減する)
  migrateLegacyHistoryIfNeeded().then(()=>{
    onValue(historyRef, (snapshot)=>{
      const val = snapshot.val();
      if(val === null){
        if(!historyLoaded){
          state.history = [];
          lastServerHistory = [];
          historyLoaded = true;
          tryFirstRender();
        }
        return;
      }
      if(editingForm && firstLoadDone){
        return;
      }
      state.history = Array.isArray(val) ? val : [];
      lastServerHistory = JSON.parse(JSON.stringify(state.history));
      historyLoaded = true;
      if(firstLoadDone) render(); else tryFirstRender();
    });
  });
}

/* ---- ログイン画面の制御 ---- */
document.getElementById("login-btn").onclick = async ()=>{
  const code = document.getElementById("login-code").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  if(!code || !password){
    errEl.textContent = "社員CDとパスワードを入力してください。";
    return;
  }
  try{
    await signInWithEmailAndPassword(auth, codeToEmail(code), password);
  }catch(e){
    errEl.textContent = "ログインできませんでした。社員CDかパスワードをご確認ください。";
  }
};
document.getElementById("login-code").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") document.getElementById("login-password").focus();
});
document.getElementById("login-password").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") document.getElementById("login-btn").click();
});

onAuthStateChanged(auth, (user)=>{
  const loginScreen = document.getElementById("login-screen");
  const app = document.getElementById("app");
  if(user){
    loginScreen.style.display = "none";
    app.style.display = "";
    startApp();
  } else {
    loginScreen.style.display = "flex";
    app.style.display = "none";
  }
});
