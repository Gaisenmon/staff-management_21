<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱旋門 ATS評価システム</title>
<style>
  :root{
    --charcoal:#241E19;
    --charcoal-2:#332A22;
    --ember:#C1531B;
    --ember-dark:#9C4013;
    --cream:#FBF6EE;
    --card:#FFFFFF;
    --ink:#2B2420;
    --muted:#8A7F72;
    --line:#E7DFD2;
    --green:#3F7D4C;
    --green-bg:#E4F1E6;
    --amber:#C98A2C;

  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em;}
  .brand .tag{font-size:11px;color:#C8BBA8;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:2px 10px;}
  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav button{background:transparent;border:none;color:#D8CBB8;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0;position:relative;top:1px;font-family:inherit;}
  nav button.active{background:var(--cream);color:var(--ink);}
  nav button:not(.active):hover{background:rgba(255,255,255,0.08);}
  main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:24px 24px 60px;}
  .title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  h2.title{font-size:20px;margin:0;font-weight:800;}
  .btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-group button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-group button.active{background:var(--ember);border-color:var(--ember);color:#fff;}
  .period-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .period-row .lbl{font-size:12px;color:var(--muted);font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:11.5px;}
  thead th{background:var(--charcoal);color:#EFE5D6;padding:7px 6px;text-align:center;font-weight:700;white-space:nowrap;}
  thead th.name-col{text-align:left;padding-left:12px;}
  thead tr.cat-row th{font-size:10.5px;background:var(--charcoal-2);border-left:2px solid var(--charcoal);}
  tbody td{padding:6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td.name-col{text-align:left;padding-left:12px;font-weight:700;}
  tbody tr:hover{background:#FAF5EC;}
  .aff-chip{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;border-radius:20px;background:var(--gray-bg);color:var(--muted);}
  .aff-chip.hall{background:#E4EEF1;color:#2F6B7A;}
  .aff-chip.kitchen{background:#F5E7DA;color:var(--ember-dark);}
  .aff-chip.both{background:var(--amber-bg);color:var(--amber);}
  .score-cell{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;border-radius:5px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 3px;}
  .score-cell.ready{background:var(--green-bg);color:var(--green);}
  .score-cell.mid{background:var(--amber-bg);color:var(--amber);}
  .score-cell.low{background:var(--gray-bg);color:var(--gray-ink);}
  .legend{display:flex;gap:14px;margin:12px 2px 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .staff-picker{max-width:360px;margin-bottom:14px;}
  label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
  select, textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:90px;}
  .meta-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--muted);}
  .meta-row strong{color:var(--ink);}

const ALL_ITEMS = CATEGORIES.flatMap(c => c.items.map(it => ({...it, categoryId:c.id})));
const PERIODS = ["4月","7月","10月","1月"]; // 店長印のタイミング(年4回)に合わせた評価時期
function starAt(max){ return Math.min(3, max); }
function scoreClass(value, max){
  const th = starAt(max);
  if(value >= th) return "ready";
  if(value >= 1) return "mid";
  return "low";
}
function achievementPct(scores){
  const vals = ALL_ITEMS.map(it => (scores[it.name] ?? 0) / it.max);
  return Math.round((vals.reduce((a,b)=>a+b,0) / vals.length) * 100);
}
const EVALUATORS = ["青木","井上","熊本","寺澤","木内","篠原","和田"];
function starCount(scores){
  return ALL_ITEMS.filter(it => scoreClass(scores[it.name] ?? 0, it.max) === "ready").length;
}
function totalScore(periodData){
  return starCount(periodData.scores) + (periodData.bonus ?? 0);
}
function emptyScores(){
  const s = {};
  ALL_ITEMS.forEach(it => { s[it.name] = 0; });
  return s;
}
function emptyPeriods(){
  const p = {};
  PERIODS.forEach(period => { p[period] = { scores: emptyScores(), comment:"", evaluator:"", bonus:0 }; });
  return p;
}

function computeTenureText(hireDateStr){
  if(!hireDateStr) return "-";
  const hire = new Date(hireDateStr);
  const now = new Date();
  let years = now.getFullYear() - hire.getFullYear();
  let months = now.getMonth() - hire.getMonth();
  if(now.getDate() < hire.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  if(years < 0) return "-";
  return `${years}年${months}ヶ月`;
}
function seedStaff(){

/* ============================== 状態管理・共有保存(プロトタイプはwindow.storageで保持) ============================== */
const STORAGE_KEY = "ats-hyouka-prototype-v2";
const STORAGE_AVAILABLE = (typeof window!=="undefined" && !!window.storage);
let state = null;
let lastSavedJSON = "";

function defaultState(){ return { staff: seedStaff(), updatedAt: null }; }
async function loadState(){
  if(!STORAGE_AVAILABLE) return defaultState();
  try{
    const res = await window.storage.get(STORAGE_KEY, true);
    if(res && res.value) return JSON.parse(res.value);
  }catch(e){}
  const s = defaultState();
  try{ await window.storage.set(STORAGE_KEY, JSON.stringify(s), true); }catch(e){}
  return s;
}
async function saveState(){
  state.updatedAt = new Date().toISOString();
  lastSavedJSON = JSON.stringify(state);
  if(STORAGE_AVAILABLE){
    try{
      await window.storage.set(STORAGE_KEY, lastSavedJSON, true);
      showToast("保存しました(全員に共有されます)");
      setSyncStatus(true);
    }catch(e){ showToast("保存に失敗しました"); setSyncStatus(false); }
  } else {
    showToast("この環境では共有保存が使えません(ローカルのみ)");
  }
}
function showToast(msg){
  const t = document.getElementById("toast");
  t.textContent = msg || "保存しました";
  t.classList.add("show");
  clearTimeout(showToast._t);
  showToast._t = setTimeout(()=>t.classList.remove("show"), 1800);
}
function setSyncStatus(ok){
  const dot = document.getElementById("sync-dot");
  const lbl = document.getElementById("sync-label");
  if(!STORAGE_AVAILABLE){ dot.classList.add("off"); lbl.textContent = "共有同期なし(この表示環境では保存できません)"; return; }
  dot.classList.toggle("off", !ok);
  const t = state?.updatedAt ? new Date(state.updatedAt).toLocaleString("ja-JP",{hour:"2-digit",minute:"2-digit",month:"numeric",day:"numeric"}) : "-";
  lbl.textContent = ok ? `全員と同期中 ・ 最終更新 ${t}` : "同期エラー";
}

    const b = document.createElement("button");
    b.textContent = p;
    b.className = p===selected ? "active" : "";
    b.onclick = ()=> onSelect(p);
    group.appendChild(b);
  });
  row.appendChild(group);
  return row;
}
function render(){
  renderTabs();
  const main = document.getElementById("main");
  main.innerHTML = "";
  if(activeTab==="dashboard")  main.appendChild(renderDashboard());
  if(activeTab==="entry")      main.appendChild(renderEntry());
  if(activeTab==="guideline")  main.appendChild(renderGuideline());
}

/* ---------- ATS評価ダッシュボード ---------- */
const sortState = { col:"code", dir:"asc" };
function affiliationMatches(aff, filter){
  if(filter==="all") return true;
  if(filter==="hall") return aff==="ホール" || aff==="両方";
  if(filter==="kitchen") return aff==="キッチン" || aff==="両方";
  return true;
}
function renderDashboard(){
  const wrap = document.createElement("div");
  const titleRow = document.createElement("div");
  titleRow.className = "title-row";
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "ATS評価ダッシュボード";
  titleRow.appendChild(h);

  const filterBtns = document.createElement("div");
  filterBtns.className = "btn-group";
  [{id:"all",label:"全て"},{id:"hall",label:"ホール"},{id:"kitchen",label:"キッチン"}].forEach(f=>{
    const b = document.createElement("button");
    b.textContent = f.label;
    b.className = dashboardFilter===f.id ? "active" : "";
    b.onclick = ()=>{ dashboardFilter = f.id; render(); };
    filterBtns.appendChild(b);
  });
  titleRow.appendChild(filterBtns);
  wrap.appendChild(titleRow);
  wrap.appendChild(renderPeriodButtons(dashboardPeriod, (p)=>{ dashboardPeriod = p; render(); }));

  const card = document.createElement("div");
  card.className = "card";
  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  const table = document.createElement("table");

  const s = sortState;
  const arrow = (col) => s.col===col ? (s.dir==="asc" ? " ▲" : " ▼") : "";
  function applySort(col, kind){
    if(s.col===col){ s.dir = s.dir==="asc" ? "desc" : "asc"; }
    else { s.col = col; s.dir = kind==="number" ? "desc" : "asc"; }
    render();
  }

  const thead = document.createElement("thead");
  const catRow = document.createElement("tr");
  catRow.className = "cat-row";
  const metaTh = document.createElement("th");
  metaTh.colSpan = 7; metaTh.textContent = "";
  catRow.appendChild(metaTh);
  CATEGORIES.forEach(cat=>{
    const th = document.createElement("th");
    th.colSpan = cat.items.length;
    th.textContent = cat.label;
    catRow.appendChild(th);
  });
  const tailTh = document.createElement("th");
  tailTh.colSpan = 2; tailTh.textContent = "";
  catRow.appendChild(tailTh);
  thead.appendChild(catRow);

  const headRow = document.createElement("tr");
  const metaCols = [
    {key:"code", label:"社員CD"}, {key:"name", label:"氏名"}, {key:"employType", label:"雇用区分"},
    {key:"affiliation", label:"所属"}, {key:"tenure", label:"勤続"}, {key:"evaluator", label:"評価者"}, {key:"achievement", label:"達成度"},
  ];
  metaCols.forEach(mc=>{
    const th = document.createElement("th");
    th.className = mc.key==="name" ? "name-col" : "";
    th.style.cursor = "pointer";
    th.textContent = mc.label + arrow(mc.key);
    th.onclick = ()=> applySort(mc.key, (mc.key==="name"||mc.key==="employType"||mc.key==="affiliation"||mc.key==="evaluator") ? "string" : "number");
    headRow.appendChild(th);
  });
  ALL_ITEMS.forEach(it=>{
    const th = document.createElement("th");
    th.title = `${it.name}(0〜${it.max}点)`;
    th.style.cursor = "pointer";
    th.textContent = it.name + arrow(it.name);
    th.onclick = ()=> applySort(it.name, "number");
    headRow.appendChild(th);
  });
  [{key:"bonus", label:"加点"}, {key:"total", label:"合計点数"}].forEach(tc=>{
    const th = document.createElement("th");
    th.style.cursor = "pointer";
    th.textContent = tc.label + arrow(tc.key);
    th.onclick = ()=> applySort(tc.key, "number");
    headRow.appendChild(th);
  });
  thead.appendChild(headRow);
  table.appendChild(thead);

  const filtered = state.staff.filter(st => affiliationMatches(st.affiliation, dashboardFilter));
  const sorted = [...filtered].sort((a,b)=>{
    let va, vb;
    const aPeriod = a.periods[dashboardPeriod];
    const bPeriod = b.periods[dashboardPeriod];
    const aScores = aPeriod.scores;
    const bScores = bPeriod.scores;
    if(s.col==="code"){ va = Number(a.code); vb = Number(b.code); }
    else if(s.col==="name"){ va = a.name; vb = b.name; }
    else if(s.col==="employType"){ va = a.employType; vb = b.employType; }
    else if(s.col==="affiliation"){ va = a.affiliation; vb = b.affiliation; }
    else if(s.col==="evaluator"){ va = aPeriod.evaluator || ""; vb = bPeriod.evaluator || ""; }
    else if(s.col==="tenure"){ va = a.hireDate || "9999"; vb = b.hireDate || "9999"; }
    else if(s.col==="achievement"){ va = achievementPct(aScores); vb = achievementPct(bScores); }
    else if(s.col==="bonus"){ va = aPeriod.bonus ?? 0; vb = bPeriod.bonus ?? 0; }
    else if(s.col==="total"){ va = totalScore(aPeriod); vb = totalScore(bPeriod); }
    else { va = aScores[s.col] ?? 0; vb = bScores[s.col] ?? 0; }
    let cmp;
    if(typeof va === "string"){ cmp = va.localeCompare(vb, "ja"); }
    else { cmp = va - vb; }
    return s.dir==="asc" ? cmp : -cmp;
  });

  const tbody = document.createElement("tbody");
  const affClass = (aff)=> aff==="ホール" ? "hall" : aff==="キッチン" ? "kitchen" : "both";
  sorted.forEach(st=>{
    const period = st.periods[dashboardPeriod];
    const scores = period.scores;
    const tr = document.createElement("tr");
    tr.innerHTML = `
      <td>${st.code}</td>
      <td class="name-col">${st.name}</td>
      <td>${st.employType}</td>
      <td><span class="aff-chip ${affClass(st.affiliation)}">${st.affiliation}</span></td>
      <td style="color:var(--muted);font-size:11px;">${computeTenureText(st.hireDate)}</td>
      <td>${period.evaluator || "-"}</td>
      <td style="font-weight:800;">${achievementPct(scores)}%</td>
      ${ALL_ITEMS.map(it=>{
        const v = scores[it.name] ?? 0;
        const cls = scoreClass(v, it.max);
        return `<td><span class="score-cell ${cls}">${v}/${it.max}</span></td>`;
      }).join("")}
      <td>${period.bonus ?? 0}</td>
      <td style="font-weight:800;color:var(--ember-dark);">${totalScore(period)}</td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = `
    <span><span class="dot" style="background:var(--green)"></span>基準達成(独り立ち・満点クリア)</span>
    <span><span class="dot" style="background:var(--amber)"></span>基準未達だが経験あり</span>
    <span><span class="dot" style="background:var(--gray-ink)"></span>0点・未経験</span>
    <span style="margin-left:auto;">列見出しをクリックすると並び替えできます・上のボタンで4月/7月/10月/1月のデータを切り替え</span>
  `;
  card.appendChild(legend);
  wrap.appendChild(card);
  return wrap;
}

/* ---------- ATS評価入力(紙の評価票と同じ表レイアウト・4期間分の履歴を保持) ---------- */
let entrySelectedId = null;
let entrySelectedPeriod = PERIODS[0];
const CAT_CLASS = {kitchen:"cat-kitchen", hall:"cat-hall", special:"cat-special", shift:"cat-shift", attitude:"cat-attitude"};

function renderEntry(){
  const wrap = document.createElement("div");
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "ATS評価入力";
  wrap.appendChild(h);

  const card = document.createElement("div");
  card.className = "card";
  const picker = document.createElement("div");
  picker.className = "staff-picker";
  picker.innerHTML = `<label>対象スタッフ</label>`;
  const sel = document.createElement("select");
  sel.innerHTML = state.staff.map(s=>`<option value="${s.id}">${s.name}</option>`).join("");
  if(!entrySelectedId) entrySelectedId = state.staff[0]?.id;
  sel.value = entrySelectedId;
  sel.onchange = ()=>{ entrySelectedId = sel.value; render(); };
  picker.appendChild(sel);
  card.appendChild(picker);
  card.appendChild(renderPeriodButtons(entrySelectedPeriod, (p)=>{ entrySelectedPeriod = p; render(); }));

  const staffObj = state.staff.find(s=>s.id===entrySelectedId);
  if(!staffObj){ wrap.appendChild(card); return wrap; }
  const periodData = staffObj.periods[entrySelectedPeriod];

  const meta = document.createElement("div");
  meta.className = "meta-row";
  meta.innerHTML = `
    <span>社員CD: <strong>${staffObj.code}</strong></span>
    <span>雇用区分: <strong>${staffObj.employType}</strong></span>
    <span>評価時期: <strong>${entrySelectedPeriod}</strong></span>
  `;
  card.appendChild(meta);

  const evaluatorRow = document.createElement("div");
  evaluatorRow.style.cssText = "max-width:280px;margin-bottom:16px;";
  evaluatorRow.innerHTML = `<label>評価者(${entrySelectedPeriod}分)</label>`;
  const evaluatorSelect = document.createElement("select");
  evaluatorSelect.innerHTML = `<option value="">未選択</option>` + EVALUATORS.map(name=>`<option value="${name}" ${periodData.evaluator===name?"selected":""}>${name}</option>`).join("");
  evaluatorSelect.onchange = ()=>{ periodData.evaluator = evaluatorSelect.value; };
  evaluatorRow.appendChild(evaluatorSelect);
  card.appendChild(evaluatorRow);

  const tableWrap = document.createElement("div");
  tableWrap.className = "paper-table-wrap";
  const table = document.createElement("table");
  table.className = "paper-table";
  const tbody = document.createElement("tbody");

  CATEGORIES.forEach(cat=>{
    cat.items.forEach((it, idx)=>{
      const tr = document.createElement("tr");
      if(idx===0){
        const catTd = document.createElement("td");
        catTd.className = "cat-col " + CAT_CLASS[cat.id];
        catTd.rowSpan = cat.items.length;
        catTd.textContent = cat.label;
        tr.appendChild(catTd);
      }
      const nameTd = document.createElement("td");
      nameTd.className = "item-col";
      nameTd.textContent = it.name;
      tr.appendChild(nameTd);

      const optsTd = document.createElement("td");
      optsTd.className = "opts-col";
      const chipGroup = document.createElement("div");
      chipGroup.className = "chip-group";
      const current = periodData.scores[it.name] ?? 0;
      for(let v=0; v<=it.max; v++){
        const chip = document.createElement("button");
        chip.className = "chip-btn" + (v===current ? " selected" : "");
        chip.textContent = v;
        chip.onclick = ()=>{ periodData.scores[it.name] = v; render(); };
        chipGroup.appendChild(chip);
      }
      optsTd.appendChild(chipGroup);
      tr.appendChild(optsTd);
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);

  const bonusRow = document.createElement("div");
  bonusRow.style.cssText = "margin-top:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 4px;border-top:1px solid var(--line);";
  const bonusLabel = document.createElement("div");
  bonusLabel.style.cssText = "font-weight:800;font-size:13.5px;width:150px;";
  bonusLabel.textContent = "加点";
  bonusRow.appendChild(bonusLabel);
  const bonusChips = document.createElement("div");
  bonusChips.className = "chip-group";
  [0,1].forEach(v=>{
    const chip = document.createElement("button");
    chip.className = "chip-btn" + (v===(periodData.bonus ?? 0) ? " selected" : "");
    chip.textContent = v;
    chip.onclick = ()=>{ periodData.bonus = v; render(); };
    bonusChips.appendChild(chip);
  });
  bonusRow.appendChild(bonusChips);
  const totalDisplay = document.createElement("div");
  totalDisplay.style.cssText = "margin-left:auto;font-weight:800;font-size:15px;color:var(--ember-dark);";
  totalDisplay.textContent = `合計点数: ${totalScore(periodData)}点 (★${starCount(periodData.scores)} + 加点${periodData.bonus ?? 0})`;
  bonusRow.appendChild(totalDisplay);
  card.appendChild(bonusRow);

  const commentBlock = document.createElement("div");
  commentBlock.style.marginTop = "18px";
  const commentHead = document.createElement("label");
  commentHead.textContent = `コメント(自由記述・${entrySelectedPeriod}分)`;
  commentBlock.appendChild(commentHead);
  const commentArea = document.createElement("textarea");
  commentArea.placeholder = "所感・特記事項など";
  commentArea.value = periodData.comment || "";
  commentArea.oninput = ()=>{ periodData.comment = commentArea.value; };
  commentBlock.appendChild(commentArea);
  card.appendChild(commentBlock);

  const saveRow = document.createElement("div");
  saveRow.style.cssText = "margin-top:18px;display:flex;justify-content:flex-end;";
  const saveBtn = document.createElement("button");
  saveBtn.className = "primary";
  saveBtn.textContent = `${entrySelectedPeriod}分を保存する(全員に共有)`;
  saveBtn.onclick = ()=> saveState();
  saveRow.appendChild(saveBtn);
  card.appendChild(saveRow);

  wrap.appendChild(card);
  return wrap;
}

/* ============================== 評価ガイドライン ============================== */
function glCard(title, innerHTML){
  const card = document.createElement("div");
  card.className = "card";
  card.innerHTML = `<div style="font-weight:800;font-size:15px;margin-bottom:10px;color:var(--ember-dark);">${title}</div>${innerHTML}`;
  return card;
}
function renderGuideline(){
  const wrap = document.createElement("div");
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "評価ガイドライン";
  wrap.appendChild(h);

  const listStyle = "margin:0;padding-left:18px;font-size:13.5px;line-height:1.9;color:var(--ink);";

  wrap.appendChild(glCard("評価の目的", `
    <ul style="${listStyle}">
      <li>公平で納得感のある評価を通じて、スタッフの育成とモチベーション向上を図る</li>
      <li>スキル到達度・協力姿勢・統率力など、実務+行動を可視化する</li>
      <li>昇格・指導対象・配置判断の基準資料として活用する</li>
    </ul>
  `));

  wrap.appendChild(glCard("評価月・時給反映", `
    <div style="font-size:13.5px;line-height:1.9;">
      評価は <strong>7月・10月・1月・4月</strong>(年4回)。時給への反映は <strong>5月・11月</strong> に実施。
    </div>
  `));

  wrap.appendChild(glCard("評価フロー", `
    <ol style="${listStyle}">
      <li><strong>一次評価</strong>:幹部 → 一般スタッフ(評価月の第1週目まで)</li>
      <li><strong>二次評価</strong>:社員・リーダー → 幹部(評価月の第2週目まで)</li>
      <li><strong>最終評価</strong>:店長 → 幹部・社員評価をもとに判断(評価月の第3週目まで)</li>
    </ol>
  `));

  wrap.appendChild(glCard("評価時のチェックポイント(主要5カテゴリ)", `
    <ul style="${listStyle}">
      <li><strong>オペレーション</strong>:1人で任せられるレベルか/ピーク時対応可/他者のフォローができるか</li>
      <li><strong>従業員統率</strong>:状況を見て的確に指示できているか/ポジション調整・シフト誘導ができているか</li>
      <li><strong>予約管理</strong>:繁忙時間の配席対応・来客調整ができているか/土日も自立して案内できるか</li>
      <li><strong>肉カット</strong>:部位の理解・見た目・歩留まり/内臓・霜降りの仕上がりが一定水準以上か</li>
      <li><strong>シフト作成</strong>:稼働効率と公平性/欠勤時の柔軟対応/人件費・スキル配置バランスが考慮されているか</li>
    </ul>
  `));

  wrap.appendChild(glCard("評価の判断基準(0〜5点の目安)", `
    <div class="table-wrap"><table style="font-size:13px;table-layout:fixed;">
      <tbody>
        <tr><td style="width:50px;font-weight:800;text-align:center;">0点</td><td style="text-align:left;padding-left:10px;white-space:normal;">未経験・理解不足・まったく対応できない</td></tr>
        <tr><td style="font-weight:800;text-align:center;">1点</td><td style="text-align:left;padding-left:10px;white-space:normal;">一部できるが、常に指示・フォローが必要</td></tr>
        <tr><td style="font-weight:800;text-align:center;">2点</td><td style="text-align:left;padding-left:10px;white-space:normal;">一通りはこなせるが、ミス・スピード・対応力に課題がある</td></tr>
        <tr style="background:var(--amber-bg);"><td style="font-weight:800;text-align:center;">3点</td><td style="text-align:left;padding-left:10px;white-space:normal;">安定して任せられる。1人で対応可能 <strong>(この点数で★一つ)</strong></td></tr>
        <tr><td colspan="2" style="text-align:left;padding:8px 10px;font-weight:800;color:var(--ember-dark);white-space:normal;">幹部以上になってからの加点部分</td></tr>
        <tr><td style="font-weight:800;text-align:center;">4点</td><td style="text-align:left;padding-left:10px;white-space:normal;">忙しい時間でも主力。周囲のフォローや他者指導もできる</td></tr>
        <tr><td style="font-weight:800;text-align:center;">5点</td><td style="text-align:left;padding-left:10px;white-space:normal;">指導者レベル。他者への教育・改善提案ができ、中心人物となっている</td></tr>
      </tbody>
    </table></div>
  `));

  wrap.appendChild(glCard("項目別の補足基準", `
    <ul style="${listStyle}">
      <li><strong>行事参加</strong>(基本参加している=○):氏神様掃除・経営理念勉強会・大掃除・経営計画</li>
      <li><strong>遅刻・欠勤</strong>:遅刻は月1回以内、欠勤は月1回以内が基準(代理を立てれば0扱い)</li>
      <li><strong>肉カット</strong>:内臓系・ジューシー(ハラミ)・霜降り(Gランチ材)</li>
      <li><strong>不足への協力</strong>:オープン準備・ラスト作業・不足時の応援移動</li>
      <li><strong>服務規律・シフト提出</strong>:どちらも注意1回まではセーフ</li>
      <li><strong>姿勢のルール</strong>:明るい挨拶・靴を揃える・出退勤の徹底</li>
      <li><strong>教育・評価</strong>:幹部入り/技術指導できる(トレーナー教本を使用)/フォローできる/評価できる、の段階で判断。ホール・キッチンいずれも3項目以上で④点評価を待っている状態か確認する</li>
    </ul>
  `));

  wrap.appendChild(glCard("加点・特記事項", `
    <ul style="${listStyle}">
      <li>①〜③(3点)まで到達すると★が一つつく</li>
      <li>発注(特殊加点):1点</li>
      <li>主要品目の発注対象:タレ・野菜・UCC・三和・服部・米</li>
    </ul>
  `));

  return wrap;
}

/* ============================== 起動 ============================== */
(async function init(){
  document.getElementById("main").innerHTML = `<div style="padding:30px;color:var(--muted);">読み込み中...</div>`;
  state = await loadState();
  lastSavedJSON = JSON.stringify(state);
  setSyncStatus(true);
  render();
})();
</script>
