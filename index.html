/* ============================== マイページ(一般スタッフ専用) ============================== */
let myGoalSnapshot = "";
function renderMyPage(){
  const wrap = document.createElement("div");
  const me = currentStaffObj();
  if(!me){
    wrap.innerHTML = `<div class="card"><div class="empty">ログイン中のスタッフ情報が見つかりませんでした。</div></div>`;
    return wrap;
  }
  if(!me.yearData[selectedYear]) me.yearData[selectedYear] = emptyPeriods();
  const pd = me.yearData[selectedYear][myPagePeriod];

  const titleRow = document.createElement("div");
  titleRow.className = "title-row";
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = `${me.name}さんのマイページ(${selectedYear}年度)`;
  titleRow.appendChild(h);
  wrap.appendChild(titleRow);
  wrap.appendChild(renderPeriodButtons(myPagePeriod, (p)=> guardedNavigate(()=>{ myPagePeriod = p; render(); })));

  // 自己評価を出し、かつ評価者が確定するまでは中身を見せない(順序を守ってバイアスを避けつつ、
  // 未確定の書きかけスコアが見えて後で食い違う事態も避ける)
  const unlocked = pd.selfSubmitted && pd.confirmed;
  if(!unlocked){
    const lockedCard = document.createElement("div");
    lockedCard.className = "card";
    lockedCard.style.cssText = "text-align:center;padding:40px 20px;";
    const reason = !pd.selfSubmitted
      ? "自己評価を提出すると、評価者の確定後に見られるようになります。"
      : "評価者による確定を待っています。確定されると自動的に見られるようになります。";
    lockedCard.innerHTML = `
      <div style="font-size:16px;font-weight:800;color:var(--ember-dark);margin-bottom:10px;">${myPagePeriod}分はまだ見られません</div>
      <div style="font-size:13.5px;color:var(--muted);margin-bottom:20px;">${reason}</div>
    `;
    if(!pd.selfSubmitted){
      const gotoBtn = document.createElement("button");
      gotoBtn.className = "primary";
      gotoBtn.textContent = "自己評価を入力する";
      gotoBtn.onclick = ()=>{ mySelfPeriod = myPagePeriod; activeTab = "mySelfEval"; render(); };
      lockedCard.appendChild(gotoBtn);
    }
    wrap.appendChild(lockedCard);
    return wrap;
  }

  // 1) 評価者からのコメント
  const commentCard = document.createElement("div");
  commentCard.className = "card";
  commentCard.innerHTML = `
    <div class="home-card-title" style="margin-bottom:6px;">評価者からのコメント</div>
    <div style="font-size:14px;white-space:pre-wrap;line-height:1.7;">${pd.comment ? pd.comment.replace(/</g,"&lt;") : '<span style="color:var(--muted);">(コメントはありません)</span>'}</div>
  `;
  wrap.appendChild(commentCard);

  // 2) 自己評価とズレた項目だけを抜き出す
  const diffs = [];
  CATEGORIES.forEach(cat=> cat.items.forEach(it=>{
    const v = pd.scores[it.name] ?? 0;
    const sv = pd.selfScores?.[it.name] ?? 0;
    if(v !== sv) diffs.push({it, v, sv});
  }));
  const diffCard = document.createElement("div");
  diffCard.className = "card";
  diffCard.innerHTML = `<div class="home-card-title">自己評価とのズレ${diffs.length ? `(${diffs.length}項目)` : ""}</div>
    <div class="home-card-sub">${diffs.length ? "自分がつけた点数と、評価者がつけた点数が違った項目です。" : "自己評価と評価者の点数は、すべての項目で一致しました。"}</div>`;
  diffs.forEach(d=>{
    const up = d.v > d.sv;
    const row = document.createElement("div");
    row.className = "diff-row";
    row.innerHTML = `<span class="nm">${d.it.name}</span>
      <span class="val">自分 ${d.sv}/${d.it.max}</span><span class="arrow">→</span>
      <span class="val strong ${up ? "up" : "down"}">評価者 ${d.v}/${d.it.max}</span>`;
    diffCard.appendChild(row);
  });
  wrap.appendChild(diffCard);

  // 3) 全項目の点数(普段は折りたたむ)
  const tableCard = document.createElement("details");
  tableCard.className = "card fold-card";
  tableCard.innerHTML = `<summary class="home-card-title">${myPagePeriod}の全項目の点数を見る</summary>`;
  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  tableWrap.style.marginTop = "12px";
  const table = document.createElement("table");
  table.className = "pcard-table pcard-table-compare";
  table.innerHTML = `<thead><tr><th colspan="2" class="item-col-head">評価項目</th><th>評価者</th><th>自己評価</th></tr></thead>`;
  const tbody = document.createElement("tbody");
  CATEGORIES.forEach(cat=>{
    cat.items.forEach((it, idx)=>{
      const tr = document.createElement("tr");
      if(idx===0){
        const catTd = document.createElement("td");
        catTd.className = "cat-col " + CAT_CLASS[cat.id];
        catTd.rowSpan = cat.items.length;
        catTd.textContent = cat.label;
        tr.appendChild(catTd);
      }
      const nameTd = document.createElement("td");
      nameTd.className = "item-col";
      nameTd.textContent = it.name;
      tr.appendChild(nameTd);
      const v = pd.scores[it.name] ?? 0;
      const sv = pd.selfScores?.[it.name] ?? 0;
      const scoreTd = document.createElement("td");
      scoreTd.innerHTML = `<span class="pcard-score ${scoreClass(v, it.max)}">${v}/${it.max}</span>`;
      const selfTd = document.createElement("td");
      selfTd.innerHTML = `<span class="pcard-score ${scoreClass(sv, it.max)}">${sv}/${it.max}</span>`;
      tr.appendChild(scoreTd);
      tr.appendChild(selfTd);
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  tableCard.appendChild(tableWrap);
  wrap.appendChild(tableCard);

  // 4) 前回立てた目標の振り返り(どちらも未設定なら出さない)
  // 目標は「設定した期間の"次"の期間に対する目標」なので、1つ前の期間で設定された目標を表示する。
  const prevRef = previousPeriodRef(selectedYear, myPagePeriod);
  const prevPd = prevRef ? me.yearData[prevRef.fiscalYear]?.[prevRef.period] : null;
  const prevSelfGoal = prevPd?.selfGoal || "";
  const prevEvaluatorGoal = prevPd?.evaluatorGoal || "";
  if(prevSelfGoal || prevEvaluatorGoal){
    const goalCard = document.createElement("div");
    goalCard.className = "card";
    const esc = s => s.replace(/</g,"&lt;");
    goalCard.innerHTML = `
      <div class="home-card-title" style="margin-bottom:10px;">前回立てた、今回までの目標</div>
      <div style="display:grid;grid-template-columns:repeat(auto-fit,minmax(200px,1fr));gap:14px;">
        ${prevSelfGoal ? `<div><div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;">自分の目標</div><div style="font-size:14px;font-weight:700;white-space:pre-wrap;">${esc(prevSelfGoal)}</div></div>` : ""}
        ${prevEvaluatorGoal ? `<div><div style="font-size:12px;color:var(--muted);font-weight:700;margin-bottom:4px;">評価者からの目標</div><div style="font-size:14px;font-weight:700;white-space:pre-wrap;">${esc(prevEvaluatorGoal)}</div></div>` : ""}
      </div>
    `;
    wrap.appendChild(goalCard);
  }

  // 5) 次回までの目標を設定する(この期間のselfGoalとして保存し、次の期間で振り返り表示される)
  const nextRefForGoal = advancePeriod(selectedYear, myPagePeriod);
  const canAdvance = !(nextRefForGoal.period===myPagePeriod && nextRefForGoal.fiscalYear===selectedYear);
  const nextLabelForGoal = canAdvance ? periodLabel(nextRefForGoal, selectedYear) : "次回";
  if(!unsaved) myGoalSnapshot = pd.selfGoal || "";
  leaveGuard = {
    save: ()=> saveState(),
    discard: ()=>{ pd.selfGoal = myGoalSnapshot; },
  };
  const goalSetCard = document.createElement("div");
  goalSetCard.className = "card";
  const goalSetHead = document.createElement("label");
  goalSetHead.textContent = `${nextLabelForGoal}までの目標を設定する`;
  goalSetCard.appendChild(goalSetHead);
  const goalSetInput = document.createElement("textarea");
  goalSetInput.placeholder = "例:レジとドリンカーを一人で回せるようになる";
  goalSetInput.value = pd.selfGoal || "";
  goalSetInput.oninput = ()=>{ markDirty(); pd.selfGoal = goalSetInput.value; };
  goalSetCard.appendChild(goalSetInput);
  const goalSetRow = document.createElement("div");
  goalSetRow.style.cssText = "margin-top:10px;display:flex;justify-content:flex-end;";
  const goalSetBtn = document.createElement("button");
  goalSetBtn.className = "primary";
  goalSetBtn.textContent = "目標を保存する";
  goalSetBtn.onclick = async ()=>{ clearDirty(); await saveState(); };
  goalSetRow.appendChild(goalSetBtn);
  goalSetCard.appendChild(goalSetRow);
  wrap.appendChild(goalSetCard);

  return wrap;
}

function renderGuideline(){
  const wrap = document.createElement("div");
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "評価ガイドライン";
  wrap.appendChild(h);

  const listStyle = "margin:0;padding-left:18px;font-size:13.5px;line-height:1.9;color:var(--ink);";

/* ============================== 変更履歴 ============================== */
function trashIconSVG(){
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`;
}
function renderHistory(){
  const wrap = document.createElement("div");
  const titleRow = document.createElement("div");
  titleRow.className = "title-row";
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "変更履歴";
  titleRow.appendChild(h);

  if(state.history && state.history.length > 0 && isCurrentUserAdmin()){
    const actions = document.createElement("div");
    actions.style.cssText = "display:flex;gap:8px;";
    const delAllBtn = document.createElement("button");
    delAllBtn.textContent = "すべて削除";
    delAllBtn.style.cssText = "background:#fff;border:1px solid #B23A2E;color:#B23A2E;border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;";
    delAllBtn.onclick = ()=>{
      showModal("変更履歴をすべて削除しますか?この操作は取り消せません。", ()=>{
        state.history = [];
        saveState();
        render();
      }, {confirmLabel:"すべて削除する"});
    };
    actions.appendChild(delAllBtn);
    titleRow.appendChild(actions);
  }
  wrap.appendChild(titleRow);

  const card = document.createElement("div");
  card.className = "card";

  if(!state.history || state.history.length===0){
    card.innerHTML = `<div style="color:var(--muted);font-size:13.5px;padding:20px 4px;text-align:center;">まだ変更履歴はありません。評価入力タブで保存・確定・編集を行うと、ここに記録されます。</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  const table = document.createElement("table");
  table.innerHTML = `
    <thead><tr>
      <th>日時</th><th>操作者</th><th class="name-col">スタッフ</th><th>年度</th><th>評価時期</th><th>項目</th><th>変更前</th><th></th><th>変更後</th><th style="width:36px;"></th>
    </tr></thead>
  `;
  const tbody = document.createElement("tbody");
  state.history.slice(0, 300).forEach(en=>{
    const tr = document.createElement("tr");
    const dt = new Date(en.ts).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});

    const cells = [
      {text: dt, style:"color:var(--muted);font-size:11px;"},
      {text: en.user, style:""},
      {text: en.staffName, className:"name-col", style:""},
      {text: en.year || "-", style:""},
      {text: en.period, style:""},
      {text: en.field, style:"font-weight:700;"},
      {text: en.oldValue, style:""},
      {text: "→", style:"color:var(--muted);"},
      {text: en.newValue, style:"font-weight:800;color:var(--ember-dark);"},
    ];
    cells.forEach(c=>{
      const td = document.createElement("td");
      if(c.className) td.className = c.className;
      td.style.cssText = c.style;
      td.textContent = c.text;
      tr.appendChild(td);
    });

    const delTd = document.createElement("td");
    if(isCurrentUserAdmin()){
      const delBtn = document.createElement("button");
      delBtn.innerHTML = trashIconSVG();
      delBtn.title = "この履歴を削除";
      delBtn.style.cssText = "background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;";
      delBtn.onclick = ()=>{
        showModal("この変更履歴を削除しますか?", ()=>{
          state.history = state.history.filter(x => x.id !== en.id);
          saveState();
          render();
        }, {confirmLabel:"削除する"});
      };
      delTd.appendChild(delBtn);
    }
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);
  if(state.history.length > 300){
    const note = document.createElement("div");
    note.style.cssText = "margin-top:10px;font-size:12px;color:var(--muted);";
    note.textContent = `直近300件を表示しています(全${state.history.length}件)。`;
    card.appendChild(note);
  }
  wrap.appendChild(card);
  return wrap;
}

/* ============================== 起動(ログイン後にリアルタイム購読を開始) ============================== */
let appStarted = false;
/* 変更履歴を本体から独立させる前の旧データには、state側に history が同居している可能性がある。
   新しい保存先(historyRef)がまだ空で、旧データ側に履歴が残っている場合だけ、一度だけ移す。 */
async function migrateLegacyHistoryIfNeeded(){
  try{
    const [stateSnap, histSnap] = await Promise.all([get(stateRef), get(historyRef)]);
    const legacyHistory = stateSnap.val()?.history;
    const currentHistory = histSnap.val();
    if(Array.isArray(legacyHistory) && legacyHistory.length>0 && (!Array.isArray(currentHistory) || currentHistory.length===0)){
      await set(historyRef, legacyHistory);
    }
  }catch(e){
    console.error("履歴の移行チェックに失敗", e);
  }
}

function startApp(){
  if(appStarted) return;
  appStarted = true;
  document.getElementById("main").innerHTML = `<div style="padding:30px;color:var(--muted);">読み込み中...</div>`;

  // フォーム内の入力欄にフォーカスがある間は「編集中」とみなし、
  // 他の人の保存によるリアルタイム再描画で入力中の内容を消さないようにする。
  // 解除は行わず(true にするだけ)、実際に解除するのは保存・確定・タブ切り替えなど
  // 各操作ハンドラ側の editingForm=false に任せる。
  // 理由: 点数ボタン(button要素)を押すと画面全体を再描画するため、フォーカスが外れて
  // focusout が発火してしまい、ここで自動的にfalseへ戻すと「編集中」判定が
  // ボタンを押すたびに解除されてしまう(=同時編集ガードが機能しなくなる)バグがあった。
  const mainEl = document.getElementById("main");
  mainEl.addEventListener("focusin", (e)=>{
    if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) editingForm = true;
  });

  // Firebaseの接続状態そのものを監視
  onValue(ref(db, ".info/connected"), (snap)=>{
    setSyncStatus(snap.val() === true);
  });

  state = { staff: [], years: [INITIAL_YEAR], history: [], updatedAt: null };
  function tryFirstRender(){
    if(stateLoaded && historyLoaded && !firstLoadDone){
      firstLoadDone = true;
      currentPersonName = resolveCurrentPersonName();
      render();
    }
  }

  // データ本体(staff/years)をリアルタイム購読。誰かが保存すると全員の画面に自動反映される
  onValue(stateRef, async (snapshot)=>{
    const val = snapshot.val();
    if(val === null){
      if(!stateLoaded){
        const seed = defaultCoreState();
        state.staff = seed.staff;
        state.years = seed.years;
        lastServerCore = JSON.parse(JSON.stringify({staff:state.staff, years:state.years}));
        stateLoaded = true;
        tryFirstRender();
        saveState();
      }
      return;
    }
    if(editingForm && firstLoadDone){
      return; // 編集中は他人の更新の取り込みを見送る(自分の未保存の変更を守る)
    }
    const migrated = migrateCoreState(val);
    const incoming = JSON.stringify({staff: migrated.staff, years: migrated.years});
    if(firstLoadDone && incoming === JSON.stringify({staff: state.staff, years: state.years})){
      lastServerCore = JSON.parse(incoming); // 内容が手元と同じ(=自分の保存の反映)なので、再描画しない
      return;
    }
    state.staff = migrated.staff;
    state.years = migrated.years;
    state.updatedAt = migrated.updatedAt;
    lastServerCore = JSON.parse(JSON.stringify({staff: state.staff, years: state.years})); // 保存時の差分判定の基準点を更新
    stateLoaded = true;
    currentPersonName = resolveCurrentPersonName();
    if(firstLoadDone) render(); else tryFirstRender();
  });

  // 変更履歴を別パスでリアルタイム購読(本体とは独立して増減する)
  migrateLegacyHistoryIfNeeded().then(()=>{
    onValue(historyRef, (snapshot)=>{
      const val = snapshot.val();
      if(val === null){
        if(!historyLoaded){
          state.history = [];
          lastServerHistory = [];
          historyLoaded = true;
          tryFirstRender();
        }
        return;
      }
      if(editingForm && firstLoadDone){
        return;
      }
      state.history = Array.isArray(val) ? val : [];
      lastServerHistory = JSON.parse(JSON.stringify(state.history));
      historyLoaded = true;
      if(firstLoadDone) render(); else tryFirstRender();
    });
  });
}

/* ページを再読み込みするボタン。ホーム画面に追加してアプリ化して使うと
   Safariの更新ボタンが使えなくなるため、代わりにアプリ内に用意している。 */
document.getElementById("reload-btn").onclick = ()=> window.location.reload();

/* ---- ログイン画面の制御 ---- */
document.getElementById("login-btn").onclick = async ()=>{
  const code = document.getElementById("login-code").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  if(!code || !password){
    errEl.textContent = "社員CDとパスワードを入力してください。";
    return;
  }
  try{
    await signInWithEmailAndPassword(auth, codeToEmail(code), password);
  }catch(e){
    errEl.textContent = "ログインできませんでした。社員CDかパスワードをご確認ください。";
  }
};
document.getElementById("login-code").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") document.getElementById("login-password").focus();
});
document.getElementById("login-password").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") document.getElementById("login-btn").click();
});

onAuthStateChanged(auth, (user)=>{
  const loginScreen = document.getElementById("login-screen");
  const app = document.getElementById("app");
  if(user){
    loginScreen.style.display = "none";
    app.style.display = "";
    startApp();
  } else {
    loginScreen.style.display = "flex";
    app.style.display = "none";
  }
});
</script>
