<!DOCTYPE html>
<html lang="ja">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>凱旋門 ATS評価システム</title>
<style>
  :root{
    --charcoal:#241E19;
    --charcoal-2:#332A22;
    --ember:#C1531B;
    --ember-dark:#9C4013;
    --cream:#FBF6EE;
    --card:#FFFFFF;
    --ink:#2B2420;
    --muted:#8A7F72;
    --line:#E7DFD2;
    --green:#3F7D4C;
    --green-bg:#E4F1E6;
    --amber:#C98A2C;
    --amber-bg:#FBF0DC;
    --gray-bg:#EFEAE1;
    --gray-ink:#9C9184;
    --cat-kitchen:#F5E7DA;
    --cat-hall:#E4EEF1;
    --cat-special:#EDE7F3;
    --cat-shift:#FBF0DC;
    --cat-attitude:#E4F1E6;

  .app{min-height:100vh;display:flex;flex-direction:column;}
  header{background:linear-gradient(135deg, var(--charcoal), var(--charcoal-2));color:#F2E9DC;padding:20px 26px 0 26px;border-bottom:4px solid var(--ember);}
  .brand{display:flex;align-items:center;gap:12px;margin-bottom:12px;flex-wrap:wrap;}
  .brand h1{font-size:18px;margin:0;font-weight:800;letter-spacing:.02em;white-space:nowrap;}
  .brand .tag{font-size:11px;color:#C8BBA8;border:1px solid rgba(255,255,255,.25);border-radius:20px;padding:2px 10px;}
  @media (max-width:760px){
    main{padding:16px 14px 60px;}
    header{padding:16px 16px 0 16px;}
    .brand{flex-direction:column;align-items:flex-start;gap:10px;}
    #top-right-slot{width:100%;flex-wrap:wrap;gap:12px !important;}
    nav{overflow-x:auto;flex-wrap:nowrap;-webkit-overflow-scrolling:touch;}
    nav button{padding:9px 12px;font-size:12.5px;white-space:nowrap;}
    .title-row{flex-direction:column;align-items:flex-start;}
    .meta-row{gap:10px 16px;}
    .item-name{width:110px !important;}
    h2.title{font-size:17px;}
  }
  nav{display:flex;gap:4px;flex-wrap:wrap;}
  nav button{background:transparent;border:none;color:#D8CBB8;padding:10px 16px;font-size:13.5px;font-weight:700;cursor:pointer;border-radius:8px 8px 0 0;position:relative;top:1px;font-family:inherit;}
  nav button.active{background:var(--cream);color:var(--ink);}
  nav button:not(.active):hover{background:rgba(255,255,255,0.08);}
  main{flex:1;max-width:1400px;width:100%;margin:0 auto;padding:24px 24px 60px;}
  .title-row{display:flex;align-items:center;justify-content:space-between;flex-wrap:wrap;gap:10px;margin-bottom:16px;}
  h2.title{font-size:20px;margin:0;font-weight:800;}
  .btn-group{display:flex;gap:6px;flex-wrap:wrap;}
  .btn-group button{background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;}
  .btn-group button.active{background:var(--ember);border-color:var(--ember);color:#fff;}
  .period-row{display:flex;align-items:center;gap:10px;margin-bottom:14px;flex-wrap:wrap;}
  .period-row .lbl{font-size:12px;color:var(--muted);font-weight:700;}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:18px;margin-bottom:18px;}
  .table-wrap{overflow-x:auto;border:1px solid var(--line);border-radius:12px;}
  table{border-collapse:collapse;width:100%;font-size:11.5px;}
  thead th{background:var(--charcoal);color:#EFE5D6;padding:7px 6px;text-align:center;font-weight:700;white-space:nowrap;}
  thead th.name-col{text-align:left;padding-left:12px;}
  thead tr.cat-row th{font-size:10.5px;background:var(--charcoal-2);border-left:2px solid var(--charcoal);}
  tbody td{padding:6px;text-align:center;border-bottom:1px solid var(--line);white-space:nowrap;}
  tbody td.name-col{text-align:left;padding-left:12px;font-weight:700;}
  tbody tr:hover{background:#FAF5EC;}
  .aff-chip{display:inline-block;font-size:10px;font-weight:800;padding:1px 8px;border-radius:20px;background:var(--gray-bg);color:var(--muted);}
  .aff-chip.hall{background:#E4EEF1;color:#2F6B7A;}
  .aff-chip.kitchen{background:#F5E7DA;color:var(--ember-dark);}
  .aff-chip.both{background:var(--amber-bg);color:var(--amber);}
  .score-cell{display:inline-flex;align-items:center;justify-content:center;min-width:22px;height:20px;border-radius:5px;font-weight:800;font-variant-numeric:tabular-nums;padding:0 3px;}
  .score-cell.ready{background:var(--green-bg);color:var(--green);}
  .score-cell.mid{background:var(--amber-bg);color:var(--amber);}
  .score-cell.low{background:var(--gray-bg);color:var(--gray-ink);}
  .legend{display:flex;gap:14px;margin:12px 2px 0;font-size:11.5px;color:var(--muted);flex-wrap:wrap;align-items:center;}
  .legend span{display:inline-flex;align-items:center;gap:5px;}
  .dot{width:10px;height:10px;border-radius:3px;display:inline-block;}
  .staff-picker{max-width:360px;margin-bottom:14px;}
  label{font-size:12px;color:var(--muted);font-weight:700;display:block;margin-bottom:5px;}
  select, textarea{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;background:#fff;color:var(--ink);}
  textarea{resize:vertical;min-height:90px;}
  .meta-row{display:flex;gap:20px;flex-wrap:wrap;margin-bottom:16px;font-size:12.5px;color:var(--muted);}
  .meta-row strong{color:var(--ink);}

  /* 紙の評価票を模した表 */
  .paper-table-wrap{overflow-x:auto;border:1px solid var(--charcoal);border-radius:6px;}
  table.paper-table{border-collapse:collapse;width:100%;min-width:640px;}
  table.paper-table td{border:1px solid var(--line);padding:0;vertical-align:middle;}
  table.paper-table td.cat-col{
    width:110px;font-weight:800;font-size:12.5px;text-align:center;padding:10px 6px;
    border-right:2px solid var(--charcoal);writing-mode:horizontal-tb;
  }
  table.paper-table td.item-col{width:150px;font-weight:700;font-size:13px;padding:8px 12px;background:#fff;}
  table.paper-table td.opts-col{padding:6px 10px;background:#fff;}
  .cat-kitchen{background:var(--cat-kitchen);}
  .cat-hall{background:var(--cat-hall);}
  .cat-special{background:var(--cat-special);}
  .cat-shift{background:var(--cat-shift);}
  .cat-attitude{background:var(--cat-attitude);}
  .chip-group{display:flex;gap:6px;flex-wrap:wrap;}
  .chip-btn{width:32px;height:32px;border-radius:50%;border:2px solid var(--line);background:#fff;font-weight:800;font-size:12.5px;color:var(--muted);cursor:pointer;font-family:inherit;display:flex;align-items:center;justify-content:center;}
  .chip-btn.selected{background:var(--ember);border-color:var(--ember);color:#fff;}

  button.primary{background:var(--ember);color:#fff;border:none;border-radius:8px;padding:10px 20px;font-weight:800;font-size:13.5px;cursor:pointer;font-family:inherit;}
  button.primary:hover{background:var(--ember-dark);}
  .save-toast{position:fixed;bottom:20px;left:50%;transform:translateX(-50%) translateY(20px);background:var(--charcoal);color:#fff;padding:10px 20px;border-radius:30px;font-size:13px;font-weight:700;opacity:0;transition:.25s;pointer-events:none;z-index:50;}
  .save-toast.show{opacity:1;transform:translateX(-50%) translateY(0);}
  .sync-row{display:flex;align-items:center;gap:10px;margin-bottom:12px;font-size:11px;color:#C8BBA8;}
  .sync-dot{width:8px;height:8px;border-radius:50%;background:#5EA36B;flex:none;}
  .sync-dot.off{background:#B23A2E;}

  .login-screen{
    min-height:100vh;display:flex;align-items:center;justify-content:center;
    background:
      repeating-linear-gradient(90deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 26px),
      repeating-linear-gradient(0deg, rgba(255,255,255,0.045) 0 2px, transparent 2px 26px),
      linear-gradient(135deg, var(--charcoal), var(--charcoal-2));
    padding:20px;
  }
  .login-card{
    background:var(--card);border-radius:16px;padding:32px 28px;width:100%;max-width:340px;
    text-align:center;box-shadow:0 20px 60px rgba(0,0,0,0.35);
  }
  .login-card h2{font-size:17px;margin:0 0 4px;font-weight:800;color:var(--ink);}
  .login-card p{font-size:12.5px;color:var(--muted);margin:0 0 18px;}
  .login-card input{width:100%;padding:9px 10px;border:1px solid var(--line);border-radius:8px;font-size:14px;font-family:inherit;margin-bottom:10px;height:42px;box-sizing:border-box;}
  .login-card button{width:100%;margin-top:4px;}
  .login-error{color:#B23A2E;font-size:12.5px;margin-top:10px;min-height:16px;}
  .logout-btn{background:transparent;border:1px solid rgba(255,255,255,0.25);color:#EFE5D6;border-radius:20px;padding:3px 12px;font-size:11px;cursor:pointer;font-family:inherit;white-space:nowrap;}
</style>

const PERIODS = ["4月","7月","10月","1月"]; // 店長印のタイミング(年4回)に合わせた評価時期
function starAt(max){ return Math.min(3, max); }
function scoreClass(value, max){
  const th = starAt(max);
  if(value >= th) return "ready";
  if(value >= 1) return "mid";
  return "low";
}
const EVALUATOR_SEED_NAMES = ["青木","井上","熊本","寺澤","木内","篠原","和田"]; // 移行専用(既存データのisEvaluator初期値判定に使用)
function starCount(scores){
  return ALL_ITEMS.filter(it => scoreClass(scores[it.name] ?? 0, it.max) === "ready").length;
}
function totalScore(periodData){
  return starCount(periodData.scores) + (periodData.bonus ?? 0);
}
function emptyScores(){
  const s = {};
  ALL_ITEMS.forEach(it => { s[it.name] = 0; });
  return s;
}
function emptyPeriods(){
  const p = {};
  PERIODS.forEach(period => { p[period] = { scores: emptyScores(), comment:"", evaluator:"", bonus:0, confirmed:false }; });
  return p;
}

function computeTenureText(hireDateStr){
  if(!hireDateStr) return "-";
  const hire = new Date(hireDateStr);
  const now = new Date();
  let years = now.getFullYear() - hire.getFullYear();
  let months = now.getMonth() - hire.getMonth();
  if(now.getDate() < hire.getDate()) months -= 1;
  if(months < 0){ years -= 1; months += 12; }
  if(years < 0) return "-";
  return `${years}年${months}ヶ月`;
}

function migrateState(s){
  if(!Array.isArray(s.staff)) s.staff = [];
  if(!Array.isArray(s.history)) s.history = [];
  if(!s.years || s.years.length===0) s.years = [INITIAL_YEAR];
  s.staff.forEach(st=>{
    if(!st.status){ st.status = st.active===false ? "resigned" : "active"; }
    if(st.isEvaluator === undefined){ st.isEvaluator = EVALUATOR_SEED_NAMES.includes(st.name); }
    if(st.hasLogin === undefined){ st.hasLogin = false; }
  });
  return s;
}

function diffAndLog(staffObj, year, period, before, after){
  const entries = [];
  ALL_ITEMS.forEach(it=>{
    const ov = before.scores[it.name] ?? 0, nv = after.scores[it.name] ?? 0;
    if(ov !== nv) entries.push({field: it.name, oldValue: String(ov), newValue: String(nv)});
  });
  if((before.bonus ?? 0) !== (after.bonus ?? 0)) entries.push({field:"加点", oldValue:String(before.bonus ?? 0), newValue:String(after.bonus ?? 0)});
  if((before.evaluator || "") !== (after.evaluator || "")) entries.push({field:"評価者", oldValue: before.evaluator || "(未選択)", newValue: after.evaluator || "(未選択)"});
  if((before.comment || "") !== (after.comment || "")) entries.push({field:"コメント", oldValue:"(変更前あり)", newValue:"(変更後あり)"});
  if(!!before.confirmed !== !!after.confirmed) entries.push({field:"ステータス", oldValue: before.confirmed ? "確定" : "編集中", newValue: after.confirmed ? "確定" : "編集中"});
  if(entries.length===0) return;
  const ts = new Date().toISOString();
  entries.forEach(e=>{
    state.history.unshift({
      id: "h"+Date.now()+Math.random().toString(36).slice(2,6),
      ts, user: currentPersonName || `(不明:${getLoginCode()})`, staffName: staffObj.name, year, period,
      field: e.field, oldValue: e.oldValue, newValue: e.newValue,
    });
  });
}

/* 「4月・7月・10月・1月」のうち、今日時点で直近に経過している時期と、
   それが属する年度をあわせて判定する。1〜3月は前年度の1月分として扱う。
   (例:2026年9月なら → 2026年度・7月。2027年2月なら → 2026年度・1月) */
function computeCurrentPeriodDefault(){
  const now = new Date();
  const month = now.getMonth() + 1; // 1-12
  const calYear = now.getFullYear();
  let period, fiscalYear;
  if(month>=4 && month<=6){ period="4月"; fiscalYear=calYear; }
  else if(month>=7 && month<=9){ period="7月"; fiscalYear=calYear; }
  else if(month>=10 && month<=12){ period="10月"; fiscalYear=calYear; }
  else { period="1月"; fiscalYear=calYear-1; }
  return { period, fiscalYear: String(fiscalYear) };
}
let defaultsApplied = false;
function applyDefaultYearAndPeriod(){
  if(defaultsApplied) return;
  defaultsApplied = true;
  const { period, fiscalYear } = computeCurrentPeriodDefault();
  selectedYear = state.years.includes(fiscalYear) ? fiscalYear : state.years[state.years.length-1];
  dashboardPeriod = period;
  entrySelectedPeriod = period;
}

      <td><span class="aff-chip ${affClass(st.affiliation)}">${st.affiliation}</span></td>
      <td style="color:var(--muted);font-size:11px;">${computeTenureText(st.hireDate)}</td>
      <td>${period.evaluator || "-"}</td>
      ${ALL_ITEMS.map(it=>{
        const v = scores[it.name] ?? 0;
        const cls = scoreClass(v, it.max);
        return `<td><span class="score-cell ${cls}">${v}/${it.max}</span></td>`;
      }).join("")}
      <td>${period.bonus ?? 0}</td>
      <td style="font-weight:800;color:var(--ember-dark);">${totalScore(period)}</td>
    `;
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);

  const legend = document.createElement("div");
  legend.className = "legend";
  legend.innerHTML = `
    <span><span class="dot" style="background:var(--green)"></span>基準達成(独り立ち・満点クリア)</span>
    <span><span class="dot" style="background:var(--amber)"></span>基準未達だが経験あり</span>
    <span><span class="dot" style="background:var(--gray-ink)"></span>0点・未経験</span>
    <span style="margin-left:auto;">列見出しをクリックすると並び替えできます・上のボタンで4月/7月/10月/1月のデータを切り替え</span>
  `;
  card.appendChild(legend);

  const bulkRow = document.createElement("div");
  bulkRow.style.cssText = "margin-top:14px;padding-top:14px;border-top:1px solid var(--line);display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;";
  const unconfirmedCount = filtered.filter(st => !st.yearData[selectedYear][dashboardPeriod].confirmed).length;
  const bulkInfo = document.createElement("span");
  bulkInfo.style.cssText = "font-size:12px;color:var(--muted);";
  bulkInfo.textContent = `表示中${filtered.length}名のうち、未確定${unconfirmedCount}名`;
  bulkRow.appendChild(bulkInfo);
  if(unconfirmedCount > 0){
    const bulkBtn = document.createElement("button");
    bulkBtn.className = "primary";
    bulkBtn.style.background = "var(--charcoal)";
    bulkBtn.textContent = `表示中の${unconfirmedCount}名を一括確定`;
    bulkBtn.onclick = ()=>{
      showModal(`現在表示中の${filtered.length}名のうち、未確定の${unconfirmedCount}名を${selectedYear}年度${dashboardPeriod}として確定します。よろしいですか?`, ()=>{
        filtered.forEach(st=>{
          const pd = st.yearData[selectedYear][dashboardPeriod];
          if(!pd.confirmed){
            const before = clonePeriod(pd);
            pd.confirmed = true;
            diffAndLog(st, selectedYear, dashboardPeriod, before, pd);
          }
        });
        saveState();
        render();
      }, {confirmLabel:"一括確定する"});
    };
    bulkRow.appendChild(bulkBtn);
  }
  card.appendChild(bulkRow);

  wrap.appendChild(card);
  return wrap;
}

/* ---------- ATS評価入力(紙の評価票と同じ表レイアウト・4期間分の履歴を保持) ---------- */
let entrySelectedId = null;
let entryShowInactive = false;
let entrySelectedPeriod = null; // 初回ロード時に自動設定
const CAT_CLASS = {kitchen:"cat-kitchen", hall:"cat-hall", special:"cat-special", shift:"cat-shift", attitude:"cat-attitude"};
const editSnapshots = {}; // key: `${staffId}:${period}` -> 直近保存時点のperiodDataのコピー(履歴の差分計算用)
function snapKey(staffId, period){ return `${staffId}:${period}`; }
function clonePeriod(p){ return JSON.parse(JSON.stringify(p)); }

function renderEntry(){
  const wrap = document.createElement("div");
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "ATS評価入力";
  wrap.appendChild(h);

  const card = document.createElement("div");
  card.className = "card";
  const picker = document.createElement("div");
  picker.className = "staff-picker";
  picker.innerHTML = `<label>対象スタッフ</label>`;
  const pickerRow = document.createElement("div");
  pickerRow.style.cssText = "display:flex;gap:10px;align-items:center;";
  const sel = document.createElement("select");
  sel.style.flex = "1";
  const STATUS_LABEL = {active:"", leave:"(休職)", resigned:"(退職)"};
  const visibleStaff = state.staff.filter(s => entryShowInactive || s.status==="active");
  sel.innerHTML = visibleStaff.map(s=>`<option value="${s.id}">${s.name}${STATUS_LABEL[s.status]||""}</option>`).join("");
  if(!entrySelectedId || !visibleStaff.some(s=>s.id===entrySelectedId)) entrySelectedId = visibleStaff[0]?.id;
  sel.value = entrySelectedId;
  sel.onchange = ()=>{ entrySelectedId = sel.value; render(); };
  pickerRow.appendChild(sel);
  const inactiveLabel = document.createElement("label");
  inactiveLabel.style.cssText = "display:flex;align-items:center;gap:5px;font-size:12px;color:var(--muted);font-weight:700;white-space:nowrap;";
  const inactiveCheck = document.createElement("input");
  inactiveCheck.type = "checkbox";
  inactiveCheck.checked = entryShowInactive;
  inactiveCheck.onchange = ()=>{ entryShowInactive = inactiveCheck.checked; render(); };
  inactiveLabel.appendChild(inactiveCheck);
  inactiveLabel.appendChild(document.createTextNode("休職・退職者も表示"));
  pickerRow.appendChild(inactiveLabel);
  picker.appendChild(pickerRow);
  card.appendChild(picker);

  const staffObj = state.staff.find(s=>s.id===entrySelectedId);
  if(!staffObj){ wrap.appendChild(card); return wrap; }
  if(!staffObj.yearData[selectedYear]) staffObj.yearData[selectedYear] = emptyPeriods();
  const periodData = staffObj.yearData[selectedYear][entrySelectedPeriod];
  const key = snapKey(staffObj.id, selectedYear+entrySelectedPeriod);
  if(!editSnapshots[key]) editSnapshots[key] = clonePeriod(periodData);
  const locked = !!periodData.confirmed;

  // 評価時期ボタン + 前回の評価を反映ボタン(同じ行の右側・年度をまたいでも1月→翌年度4月で繋がる)
  const periodIdx = PERIODS.indexOf(entrySelectedPeriod);
  const yearIdx = state.years.indexOf(selectedYear);
  let prevRef = null;
  if(periodIdx > 0){ prevRef = { year: selectedYear, period: PERIODS[periodIdx-1] }; }
  else if(yearIdx > 0){ prevRef = { year: state.years[yearIdx-1], period: PERIODS[PERIODS.length-1] }; }
  const periodRow = renderPeriodButtons(entrySelectedPeriod, (p)=>{ entrySelectedPeriod = p; render(); });
  if(prevRef && !locked && staffObj.yearData[prevRef.year]){
    const copyBtn = document.createElement("button");
    const prevLabel = prevRef.year===selectedYear ? prevRef.period : `${prevRef.year}年度${prevRef.period}`;
    copyBtn.textContent = `${prevLabel}の評価を反映`;
    copyBtn.style.cssText = "margin-left:auto;background:#fff;border:1px solid var(--ember);color:var(--ember-dark);border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;";
    copyBtn.onclick = ()=>{
      showModal(`${entrySelectedPeriod}分の入力内容を、${prevLabel}の内容で上書きします。よろしいですか?`, ()=>{
        editingForm = true;
        const prev = staffObj.yearData[prevRef.year][prevRef.period];
        periodData.scores = JSON.parse(JSON.stringify(prev.scores));
        periodData.bonus = prev.bonus;
        periodData.comment = prev.comment;
        periodData.evaluator = prev.evaluator;
        render();
      }, {confirmLabel:"反映する"});
    };
    periodRow.appendChild(copyBtn);
  }
  card.appendChild(periodRow);

  if(locked){
    const banner = document.createElement("div");
    banner.style.cssText = "background:var(--green-bg);color:var(--green);border-radius:8px;padding:10px 14px;font-size:13px;font-weight:700;margin-bottom:14px;";
    banner.textContent = `${selectedYear}年度${entrySelectedPeriod}分は確定済みです。編集するには右の「編集」ボタンを押してください。`;
    card.appendChild(banner);
  }

  const meta = document.createElement("div");
  meta.className = "meta-row";
  meta.innerHTML = `
    <span>社員CD: <strong>${staffObj.code}</strong></span>
    <span>雇用区分: <strong>${staffObj.employType}</strong></span>
    <span>評価時期: <strong>${selectedYear}年度 ${entrySelectedPeriod}</strong></span>
  `;
  card.appendChild(meta);

  const evaluatorRow = document.createElement("div");
  evaluatorRow.style.cssText = "width:100%;margin-bottom:16px;display:flex;align-items:flex-end;gap:10px;justify-content:space-between;flex-wrap:wrap;";
  const evaluatorBox = document.createElement("div");
  evaluatorBox.style.cssText = "flex:0 1 320px;min-width:220px;";
  evaluatorBox.innerHTML = `<label>評価者(${entrySelectedPeriod}分)</label>`;
  const evaluatorSelect = document.createElement("select");
  evaluatorSelect.disabled = locked;
  const evaluatorNames = state.staff.filter(s=>s.isEvaluator).map(s=>s.name);
  evaluatorSelect.innerHTML = `<option value="">未選択</option>` + evaluatorNames.map(name=>`<option value="${name}" ${periodData.evaluator===name?"selected":""}>${name}</option>`).join("");
  evaluatorSelect.onchange = ()=>{ editingForm = true; periodData.evaluator = evaluatorSelect.value; };
  evaluatorBox.appendChild(evaluatorSelect);
  evaluatorRow.appendChild(evaluatorBox);
  if(locked){
    const editBtn = document.createElement("button");
    editBtn.className = "primary";
    editBtn.textContent = "編集";
    editBtn.style.cssText = "background:var(--charcoal);margin-left:auto;";
    editBtn.onclick = ()=>{
      editingForm = false;
      const before = clonePeriod(periodData);
      periodData.confirmed = false;
      diffAndLog(staffObj, selectedYear, entrySelectedPeriod, before, periodData);
      editSnapshots[key] = clonePeriod(periodData);
      saveState();
      render();
    };
    evaluatorRow.appendChild(editBtn);
  }
  card.appendChild(evaluatorRow);

  const tableWrap = document.createElement("div");
  tableWrap.className = "paper-table-wrap";
  if(locked) tableWrap.style.opacity = "0.6";
  const table = document.createElement("table");
  table.className = "paper-table";
  const tbody = document.createElement("tbody");

  CATEGORIES.forEach(cat=>{
    cat.items.forEach((it, idx)=>{
      const tr = document.createElement("tr");
      if(idx===0){
        const catTd = document.createElement("td");
        catTd.className = "cat-col " + CAT_CLASS[cat.id];
        catTd.rowSpan = cat.items.length;
        catTd.textContent = cat.label;
        tr.appendChild(catTd);
      }
      const nameTd = document.createElement("td");
      nameTd.className = "item-col";
      nameTd.textContent = it.name;
      tr.appendChild(nameTd);

      const optsTd = document.createElement("td");
      optsTd.className = "opts-col";
      const chipGroup = document.createElement("div");
      chipGroup.className = "chip-group";
      const current = periodData.scores[it.name] ?? 0;
      for(let v=0; v<=it.max; v++){
        const chip = document.createElement("button");
        chip.className = "chip-btn" + (v===current ? " selected" : "");
        chip.textContent = v;
        chip.disabled = locked;
        chip.onclick = ()=>{ editingForm = true; periodData.scores[it.name] = v; render(); };
        chipGroup.appendChild(chip);
      }
      optsTd.appendChild(chipGroup);
      tr.appendChild(optsTd);
      tbody.appendChild(tr);
    });
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);

  const bonusRow = document.createElement("div");
  bonusRow.style.cssText = "margin-top:18px;display:flex;align-items:center;gap:16px;flex-wrap:wrap;padding:12px 4px;border-top:1px solid var(--line);";
  const bonusLabel = document.createElement("div");
  bonusLabel.style.cssText = "font-weight:800;font-size:13.5px;width:150px;";
  bonusLabel.textContent = "加点";
  bonusRow.appendChild(bonusLabel);
  const bonusChips = document.createElement("div");
  bonusChips.className = "chip-group";
  [0,1].forEach(v=>{
    const chip = document.createElement("button");
    chip.className = "chip-btn" + (v===(periodData.bonus ?? 0) ? " selected" : "");
    chip.textContent = v;
    chip.disabled = locked;
    chip.onclick = ()=>{ editingForm = true; periodData.bonus = v; render(); };
    bonusChips.appendChild(chip);
  });
  bonusRow.appendChild(bonusChips);
  const totalDisplay = document.createElement("div");
  totalDisplay.style.cssText = "margin-left:auto;font-weight:800;font-size:15px;color:var(--ember-dark);";
  totalDisplay.textContent = `合計点数: ${totalScore(periodData)}点 (★${starCount(periodData.scores)} + 加点${periodData.bonus ?? 0})`;
  bonusRow.appendChild(totalDisplay);
  card.appendChild(bonusRow);

  const commentBlock = document.createElement("div");
  commentBlock.style.marginTop = "18px";
  const commentHead = document.createElement("label");
  commentHead.textContent = `コメント(自由記述・${entrySelectedPeriod}分)`;
  commentBlock.appendChild(commentHead);
  const commentArea = document.createElement("textarea");
  commentArea.placeholder = "所感・特記事項など";
  commentArea.value = periodData.comment || "";
  commentArea.disabled = locked;
  commentArea.oninput = ()=>{ editingForm = true; periodData.comment = commentArea.value; };
  commentBlock.appendChild(commentArea);
  card.appendChild(commentBlock);

  if(!locked){
    const saveRow = document.createElement("div");
    saveRow.style.cssText = "margin-top:18px;display:flex;justify-content:flex-end;gap:10px;";
    const saveBtn = document.createElement("button");
    saveBtn.className = "primary";
    saveBtn.style.background = "var(--charcoal)";
    saveBtn.textContent = `${entrySelectedPeriod}分を保存する`;
    saveBtn.onclick = ()=>{
      editingForm = false;
      diffAndLog(staffObj, selectedYear, entrySelectedPeriod, editSnapshots[key], periodData);
      editSnapshots[key] = clonePeriod(periodData);
      saveState();
    };
    const confirmBtn = document.createElement("button");
    confirmBtn.className = "primary";
    confirmBtn.textContent = `${entrySelectedPeriod}分を確定する`;
    confirmBtn.onclick = ()=>{
      showModal(`${staffObj.name}さんの${selectedYear}年度 ${entrySelectedPeriod}評価を確定します。確定後は「編集」ボタンを押さないと内容を変更できなくなります。`, ()=>{
        editingForm = false;
        const before = clonePeriod(periodData);
        periodData.confirmed = true;
        diffAndLog(staffObj, selectedYear, entrySelectedPeriod, before, periodData);
        editSnapshots[key] = clonePeriod(periodData);
        saveState();
        render();
      }, {confirmLabel:"確定する"});
    };
    saveRow.appendChild(saveBtn);
    saveRow.appendChild(confirmBtn);
    card.appendChild(saveRow);
  }

  wrap.appendChild(card);
  return wrap;
}

/* ============================== スタッフ管理 ============================== */
function renderStaffAdmin(){
  const wrap = document.createElement("div");
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "スタッフマスタ";
  wrap.appendChild(h);

  // 新規追加フォーム
  const addCard = document.createElement("div");
  addCard.className = "card";
  addCard.innerHTML = `<div style="font-weight:800;font-size:15px;margin-bottom:12px;">新規スタッフを追加</div>`;
  const form = document.createElement("div");
  form.style.cssText = "display:flex;gap:10px;flex-wrap:wrap;align-items:flex-end;";
  form.innerHTML = `
    <div style="min-width:140px;"><label>氏名</label><input id="sa-name" type="text" placeholder="山田 太郎"></div>
    <div style="min-width:120px;"><label>社員CD</label><input id="sa-code" type="text" placeholder="220001"></div>
    <div style="min-width:120px;"><label>雇用区分</label><select id="sa-type"><option>アルバイト</option><option>パート</option><option>社員</option></select></div>
    <div style="min-width:110px;"><label>所属</label><select id="sa-aff"><option>ホール</option><option>キッチン</option><option>両方</option></select></div>
    <div style="min-width:150px;"><label>入社日</label><input id="sa-hire" type="date"></div>
  `;
  addCard.appendChild(form);
  const addBtn = document.createElement("button");
  addBtn.className = "primary";
  addBtn.textContent = "追加する";
  addBtn.style.marginTop = "14px";
  addBtn.onclick = ()=>{
    const name = document.getElementById("sa-name").value.trim();
    const code = document.getElementById("sa-code").value.trim();
    const employType = document.getElementById("sa-type").value;
    const affiliation = document.getElementById("sa-aff").value;
    const hireDate = document.getElementById("sa-hire").value || null;
    if(!name || !code){ showToast("氏名と社員CDは必須です"); return; }
    if(state.staff.some(s=>String(s.code)===String(code))){ showToast(`社員CD ${code} は既に登録されています`); return; }
    const yearData = {};
    state.years.forEach(y => { yearData[y] = emptyPeriods(); });
    state.staff.push({
      id: "s"+Date.now(), code, name, employType, affiliation, hireDate, status:"active", yearData,
    });
    saveState();
    render();
  };
  addCard.appendChild(addBtn);
  wrap.appendChild(addCard);

  // 一覧・在籍/休職/退職の切り替え
  const STATUS_META = {
    active:   {label:"在籍", style:"background:var(--green-bg);color:var(--green);"},
    leave:    {label:"休職", style:"background:var(--amber-bg);color:var(--amber);"},
    resigned: {label:"退職", style:"background:#FBE4E1;color:#B23A2E;"},
  };
  const listCard = document.createElement("div");
  listCard.className = "card";
  listCard.innerHTML = `<div style="font-weight:800;font-size:15px;margin-bottom:12px;">スタッフ一覧(${state.staff.filter(s=>s.status==="active").length}名在籍)</div>`;
  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  const table = document.createElement("table");
  table.innerHTML = `<thead><tr><th>社員CD</th><th class="name-col">氏名</th><th>雇用区分</th><th>所属</th><th>入社日</th><th>状態</th><th>ログイン</th><th style="text-align:right;">操作</th></tr></thead>`;
  const tbody = document.createElement("tbody");
  [...state.staff].sort((a,b)=> Number(a.code)-Number(b.code)).forEach(st=>{
    const tr = document.createElement("tr");
    const meta = STATUS_META[st.status] || STATUS_META.active;
    tr.innerHTML = `
      <td>${st.code}</td>
      <td class="name-col" style="${st.hasLogin ? "" : "color:var(--muted);"}">${st.name}</td>
      <td>${st.employType}</td>
      <td>${st.affiliation}</td>
      <td style="color:var(--muted);font-size:11px;">${st.hireDate ?? "-"}</td>
      <td><span class="aff-chip" style="${meta.style}">${meta.label}</span></td>
      <td>${st.hasLogin
        ? `<span class="aff-chip" style="background:var(--green-bg);color:var(--green);">設定済み</span>`
        : `<span class="aff-chip" style="background:var(--gray-bg);color:var(--gray-ink);">未設定</span>`}</td>
    `;
    const actionTd = document.createElement("td");
    actionTd.style.textAlign = "right";
    const actionGroup = document.createElement("div");
    actionGroup.className = "btn-group";
    actionGroup.style.justifyContent = "flex-end";
    [{key:"leave", label:"休職"}, {key:"resigned", label:"退職"}].forEach(opt=>{
      const btn = document.createElement("button");
      btn.textContent = opt.label;
      const isOn = st.status === opt.key;
      btn.className = isOn ? "active" : "";
      btn.onclick = ()=>{
        const nextStatus = isOn ? "active" : opt.key;
        const msg = nextStatus==="active"
          ? `${st.name}さんを在籍に戻します。`
          : nextStatus==="resigned"
          ? `${st.name}さんを退職にします。過去の評価データは残りますが、ダッシュボード・評価入力の対象一覧からは初期状態で除外されます。`
          : `${st.name}さんを休職にします。ダッシュボード・評価入力の対象一覧からは初期状態で除外されます(データは残ります)。`;
        showModal(msg, ()=>{
          st.status = nextStatus;
          saveState();
          render();
        }, {confirmLabel: nextStatus==="active" ? "在籍に戻す" : opt.label + "にする"});
      };
      actionGroup.appendChild(btn);
    });
    const loginBtn = document.createElement("button");
    loginBtn.textContent = st.hasLogin ? "ログイン再設定" : "ログイン設定";
    loginBtn.style.cssText = "background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 14px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;";
    loginBtn.onclick = ()=>{
      showInputModal(
        `${st.name}さん(社員CD: ${st.code})のログインパスワードを設定します。\n6文字以上で入力してください。${st.hasLogin ? "\n※既に設定済みのようです。パスワードの再設定(リセット)は現在の仕組みではできません。" : ""}`,
        async (password, close)=>{
          if(!password || password.length < 6){ throw new Error("パスワードは6文字以上にしてください(Firebaseの制限です)。"); }
          try{
            await createLoginAccount(st.code, password);
          }catch(e){
            throw new Error(e.code==="auth/email-already-in-use" ? "このスタッフのログインは既に設定済みです。" : ("作成に失敗しました:" + (e.message||"")));
          }
          st.hasLogin = true;
          await saveState();
          close();
          showToast(`${st.name}さんのログインを設定しました`);
          render();
        },
        {inputType:"password", placeholder:"新しいパスワード", confirmLabel:"設定する"}
      );
    };
    actionGroup.appendChild(loginBtn);
    if(!st.hasLogin){
      const markBtn = document.createElement("button");
      markBtn.textContent = "設定済みにする";
      markBtn.title = "以前から実際にはログインアカウントがある場合、この記録だけを直します";
      markBtn.style.cssText = "background:#fff;border:1px solid var(--line);color:var(--muted);border-radius:20px;padding:5px 14px;font-size:11.5px;font-weight:700;cursor:pointer;font-family:inherit;white-space:nowrap;";
      markBtn.onclick = ()=>{
        showModal(
          `${st.name}さんは、以前から実際にはログインアカウントを作成済みですか?\nこの操作はアプリ側の表示だけを直すもので、新しくアカウントを作るわけではありません。`,
          ()=>{
            st.hasLogin = true;
            saveState();
            render();
          },
          {confirmLabel:"設定済みにする"}
        );
      };
      actionGroup.appendChild(markBtn);
    }
    actionTd.appendChild(actionGroup);
    tr.appendChild(actionTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  listCard.appendChild(tableWrap);
  wrap.appendChild(listCard);

  // 評価者一覧
  const evalCard = document.createElement("div");
  evalCard.className = "card";
  evalCard.innerHTML = `<div style="font-weight:800;font-size:15px;margin-bottom:4px;">評価者一覧</div><div style="font-size:12px;color:var(--muted);margin-bottom:14px;">ここで選ばれた人が、ATS評価入力画面の「評価者」プルダウンに表示されます。</div>`;
  const currentEvaluators = state.staff.filter(s=>s.isEvaluator);
  const chipsWrap = document.createElement("div");
  chipsWrap.style.cssText = "display:flex;flex-wrap:wrap;gap:8px;margin-bottom:16px;";
  if(currentEvaluators.length===0){
    const empty = document.createElement("div");
    empty.style.cssText = "color:var(--muted);font-size:13px;";
    empty.textContent = "評価者が1人も選ばれていません。下のプルダウンから追加してください。";
    chipsWrap.appendChild(empty);
  }
  currentEvaluators.forEach(st=>{
    const chip = document.createElement("span");
    chip.style.cssText = "display:inline-flex;align-items:center;gap:6px;background:var(--amber-bg);color:var(--amber);border-radius:20px;padding:5px 8px 5px 14px;font-size:12.5px;font-weight:700;";
    chip.textContent = st.name;
    const removeBtn = document.createElement("button");
    removeBtn.textContent = "✕";
    removeBtn.style.cssText = "background:none;border:none;color:inherit;cursor:pointer;font-size:12px;padding:2px 4px;font-family:inherit;";
    removeBtn.onclick = ()=>{
      st.isEvaluator = false;
      saveState();
      render();
    };
    chip.appendChild(removeBtn);
    chipsWrap.appendChild(chip);
  });
  evalCard.appendChild(chipsWrap);

  const addRow = document.createElement("div");
  addRow.style.cssText = "display:flex;gap:10px;align-items:center;";
  const addSelect = document.createElement("select");
  addSelect.style.maxWidth = "260px";
  const candidates = state.staff.filter(s=>!s.isEvaluator && s.status==="active");
  addSelect.innerHTML = candidates.length
    ? candidates.map(s=>`<option value="${s.id}">${s.name}</option>`).join("")
    : `<option value="">(追加できる在籍スタッフがいません)</option>`;
  addRow.appendChild(addSelect);
  const addEvalBtn = document.createElement("button");
  addEvalBtn.className = "ghost small";
  addEvalBtn.textContent = "評価者に追加";
  addEvalBtn.style.cssText = "background:transparent;color:var(--ember-dark);border:1px solid var(--ember);border-radius:8px;padding:8px 16px;font-weight:700;font-size:12.5px;cursor:pointer;font-family:inherit;";
  addEvalBtn.onclick = ()=>{
    const target = state.staff.find(s=>s.id===addSelect.value);
    if(!target) return;
    target.isEvaluator = true;
    saveState();
    render();
  };
  addRow.appendChild(addEvalBtn);
  evalCard.appendChild(addRow);
  wrap.appendChild(evalCard);

  return wrap;
}

/* ============================== 変更履歴 ============================== */
function trashIconSVG(){
  return `<svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><polyline points="3 6 5 6 21 6"></polyline><path d="M19 6l-1 14a2 2 0 0 1-2 2H8a2 2 0 0 1-2-2L5 6"></path><path d="M10 11v6"></path><path d="M14 11v6"></path><path d="M9 6V4a1 1 0 0 1 1-1h4a1 1 0 0 1 1 1v2"></path></svg>`;
}
function renderHistory(){
  const wrap = document.createElement("div");
  const titleRow = document.createElement("div");
  titleRow.className = "title-row";
  const h = document.createElement("h2");
  h.className = "title";
  h.textContent = "変更履歴";
  titleRow.appendChild(h);

  if(state.history && state.history.length > 0){
    const actions = document.createElement("div");
    actions.style.cssText = "display:flex;gap:8px;";
    const delAllBtn = document.createElement("button");
    delAllBtn.textContent = "すべて削除";
    delAllBtn.style.cssText = "background:#fff;border:1px solid #B23A2E;color:#B23A2E;border-radius:20px;padding:6px 16px;font-size:12.5px;font-weight:700;cursor:pointer;font-family:inherit;";
    delAllBtn.onclick = ()=>{
      showModal("変更履歴をすべて削除しますか?この操作は取り消せません。", ()=>{
        state.history = [];
        saveState();
        render();
      }, {confirmLabel:"すべて削除する"});
    };
    actions.appendChild(delAllBtn);
    titleRow.appendChild(actions);
  }
  wrap.appendChild(titleRow);

  const card = document.createElement("div");
  card.className = "card";

  if(!state.history || state.history.length===0){
    card.innerHTML = `<div style="color:var(--muted);font-size:13.5px;padding:20px 4px;text-align:center;">まだ変更履歴はありません。評価入力タブで保存・確定・編集を行うと、ここに記録されます。</div>`;
    wrap.appendChild(card);
    return wrap;
  }

  const tableWrap = document.createElement("div");
  tableWrap.className = "table-wrap";
  const table = document.createElement("table");
  table.innerHTML = `
    <thead><tr>
      <th>日時</th><th>操作者</th><th class="name-col">スタッフ</th><th>年度</th><th>評価時期</th><th>項目</th><th>変更前</th><th></th><th>変更後</th><th style="width:36px;"></th>
    </tr></thead>
  `;
  const tbody = document.createElement("tbody");
  state.history.slice(0, 300).forEach(en=>{
    const tr = document.createElement("tr");
    const dt = new Date(en.ts).toLocaleString("ja-JP",{month:"numeric",day:"numeric",hour:"2-digit",minute:"2-digit"});

    const cells = [
      {text: dt, style:"color:var(--muted);font-size:11px;"},
      {text: en.user, style:""},
      {text: en.staffName, className:"name-col", style:""},
      {text: en.year || "-", style:""},
      {text: en.period, style:""},
      {text: en.field, style:"font-weight:700;"},
      {text: en.oldValue, style:""},
      {text: "→", style:"color:var(--muted);"},
      {text: en.newValue, style:"font-weight:800;color:var(--ember-dark);"},
    ];
    cells.forEach(c=>{
      const td = document.createElement("td");
      if(c.className) td.className = c.className;
      td.style.cssText = c.style;
      td.textContent = c.text;
      tr.appendChild(td);
    });

    const delTd = document.createElement("td");
    const delBtn = document.createElement("button");
    delBtn.innerHTML = trashIconSVG();
    delBtn.title = "この履歴を削除";
    delBtn.style.cssText = "background:transparent;border:none;color:var(--muted);cursor:pointer;padding:4px;display:flex;align-items:center;";
    delBtn.onclick = ()=>{
      showModal("この変更履歴を削除しますか?", ()=>{
        state.history = state.history.filter(x => x.id !== en.id);
        saveState();
        render();
      }, {confirmLabel:"削除する"});
    };
    delTd.appendChild(delBtn);
    tr.appendChild(delTd);
    tbody.appendChild(tr);
  });
  table.appendChild(tbody);
  tableWrap.appendChild(table);
  card.appendChild(tableWrap);
  if(state.history.length > 300){
    const note = document.createElement("div");
    note.style.cssText = "margin-top:10px;font-size:12px;color:var(--muted);";
    note.textContent = `直近300件を表示しています(全${state.history.length}件)。`;
    card.appendChild(note);
  }
  wrap.appendChild(card);
  return wrap;
}

/* ============================== 起動(ログイン後にリアルタイム購読を開始) ============================== */
let appStarted = false;
function startApp(){
  if(appStarted) return;
  appStarted = true;
  document.getElementById("main").innerHTML = `<div style="padding:30px;color:var(--muted);">読み込み中...</div>`;

  // フォーム内の入力欄にフォーカスがある間は「編集中」とみなし、
  // 他の人の保存によるリアルタイム再描画で入力中の内容を消さないようにする。
  // 解除は行わず(true にするだけ)、実際に解除するのは保存・確定・タブ切り替えなど
  // 各操作ハンドラ側の editingForm=false に任せる。
  // 理由: 点数ボタン(button要素)を押すと画面全体を再描画するため、フォーカスが外れて
  // focusout が発火してしまい、ここで自動的にfalseへ戻すと「編集中」判定が
  // ボタンを押すたびに解除されてしまう(=同時編集ガードが機能しなくなる)バグがあった。
  const mainEl = document.getElementById("main");
  mainEl.addEventListener("focusin", (e)=>{
    if(["INPUT","SELECT","TEXTAREA"].includes(e.target.tagName)) editingForm = true;
  });

  // Firebaseの接続状態そのものを監視
  onValue(ref(db, ".info/connected"), (snap)=>{
    setSyncStatus(snap.val() === true);
  });

  // データ本体をリアルタイム購読。誰かが保存すると全員の画面に自動反映される
  onValue(stateRef, async (snapshot)=>{
    const val = snapshot.val();
    if(val === null){
      if(!firstLoadDone){
        state = defaultState();
        firstLoadDone = true;
        currentPersonName = resolveCurrentPersonName();
        render();
        saveState();
      }
      return;
    }
    if(editingForm && firstLoadDone){
      return; // 編集中は他人の更新の取り込みを見送る(自分の未保存の変更を守る)
    }
    state = migrateState(val);
    currentPersonName = resolveCurrentPersonName();
    firstLoadDone = true;
    render();
  });
}

/* ---- ログイン画面の制御 ---- */
document.getElementById("login-btn").onclick = async ()=>{
  const code = document.getElementById("login-code").value.trim();
  const password = document.getElementById("login-password").value;
  const errEl = document.getElementById("login-error");
  errEl.textContent = "";
  if(!code || !password){
    errEl.textContent = "社員CDとパスワードを入力してください。";
    return;
  }
  try{
    await signInWithEmailAndPassword(auth, codeToEmail(code), password);
  }catch(e){
    errEl.textContent = "ログインできませんでした。社員CDかパスワードをご確認ください。";
  }
};
document.getElementById("login-code").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") document.getElementById("login-password").focus();
});
document.getElementById("login-password").addEventListener("keydown", (e)=>{
  if(e.key === "Enter") document.getElementById("login-btn").click();
});

onAuthStateChanged(auth, (user)=>{
  const loginScreen = document.getElementById("login-screen");
  const app = document.getElementById("app");
  if(user){
    loginScreen.style.display = "none";
    app.style.display = "";
    startApp();
  } else {
    loginScreen.style.display = "flex";
    app.style.display = "none";
  }
});
